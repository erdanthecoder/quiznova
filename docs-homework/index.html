<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quoldek homework</title>
<link href="fonts.css?v=40a238ef" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg?v=662a6df7">
<link rel="apple-touch-icon" href="logo.svg?v=662a6df7">
<meta name="theme-color" content="#7C4DFF">
<meta name="description" content="Quoldek is a teaching tool for classrooms and families: write or paste a quiz, put it on the board, and everyone answers on their own device. Made for lessons, revision and formative assessment.">
<meta name="application-name" content="Quoldek">
<meta name="apple-mobile-web-app-title" content="Quoldek">
<meta name="category" content="Education">
<meta name="classification" content="Education">
<meta name="subject" content="Education, classroom learning, formative assessment, quizzes">
<meta name="audience" content="Teachers, pupils, schools, families">
<meta name="rating" content="General">
<meta name="distribution" content="global">
<meta property="og:site_name" content="Quoldek">
<meta property="og:type" content="website">
<meta property="og:title" content="Quoldek — classroom quizzes">
<meta property="og:description" content="A teaching tool for classrooms: write or paste a quiz, put it on the board, and the class answers on their own devices.">
<link rel="stylesheet" href="nova.css?v=4c8347b4">
<style>
.shell{max-width:740px;margin:0 auto;padding:28px 20px 90px}
.progress{position:fixed;top:0;left:0;right:0;height:8px;background:var(--paper);z-index:80;border-bottom:2px solid var(--line)}
.progress i{display:block;height:100%;background:var(--grad-brand);width:0;transition:width .5s var(--ease)}

.cover{padding:36px;text-align:left}
.cover h1{font-size:clamp(2rem,5.5vw,3rem);margin:16px 0 12px}
.cover .facts{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 28px}

.qbox{padding:clamp(22px,4vw,34px);animation:fadeUp .4s var(--bounce) both}
.qkicker{font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:900;margin-bottom:12px}
.qbox h2{font-size:clamp(2rem,7vw,2.8rem);line-height:1.12;margin-bottom:28px}
.opt{display:flex;gap:14px;align-items:center;padding:19px;font-size:1.15rem;border-radius:var(--r-lg);
  border:2.5px solid var(--line);background:var(--card);cursor:pointer;transition:.16s var(--ease);
  margin-bottom:12px;box-shadow:var(--pop-1);font-weight:700}
.opt:hover{transform:translateY(-2px);box-shadow:var(--pop-2)}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.on{background:#EFEAFF;border-color:var(--grape);box-shadow:var(--pop-2)}
.opt .key{width:38px;height:38px;flex:none;border-radius:11px;background:var(--paper);border:2.5px solid var(--line);
  display:grid;place-items:center;font-weight:900;font-size:.9rem;color:var(--muted)}
.opt.on .key{background:var(--grape);color:#fff}
.opt.multi .key{border-radius:9px}
.opt.k0 .key{background:#FFD9DF}
.opt.k1 .key{background:#DCE6FF}
.opt.k2 .key{background:#FFEFC2}
.opt.k3 .key{background:#CFF6E8}
.opt.on .key{background:var(--grape);color:#fff}

.nav{display:flex;gap:10px;align-items:center;margin-top:26px}
.pips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--line);transition:.2s var(--bounce);cursor:pointer}
.pip.done{background:var(--mint)}
.pip.now{background:var(--sun);transform:scale(1.45)}

.score-ring{width:184px;height:184px;margin:0 auto 22px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:2.7rem;font-weight:900;letter-spacing:-.04em}
.review{padding:17px 19px;border-radius:var(--r-lg);border:2.5px solid var(--line);margin-bottom:12px;
  background:var(--card);box-shadow:var(--pop-1)}
.review.ok{background:#D8FBF0}
.review.no{background:#FFE1E6}
</style>
</head>
<body>
<div class="progress"><i id="bar"></i></div>
<main class="shell" id="app">
  <div class="card pad center" style="min-height:50vh"><div class="skeleton" style="width:220px;height:24px"></div></div>
</main>

<script src="sprites.js?v=756a85b1"></script>
<script src="nova.js?v=30a2cc36"></script>
<script src="quizbank.js?v=f18e8cbc"></script>
<script src="realtime.js?v=75e1623c"></script>
<script src="arena.js?v=fb3b6182"></script>
<script src="paste.js?v=3032c005"></script>
<script src="rules.js?v=69bf1ad8"></script>
<script src="live.js?v=b7190675"></script>
<script src="nova-local.js?v=340f2f93"></script>
<script src="account.js?v=00c10e3c"></script>
<script>
window.QUOLDEK_LOCAL = /^(localhost|127\.|0\.0\.0\.0|\[?::1)/.test(location.hostname);
window.QUOLDEK_JOIN = window.QUOLDEK_LOCAL
  ? location.href.replace(/[^/]*$/, '') + 'play.html?pin='
  : 'https://playquoldek.web.app/?pin=';
window.QUOLDEK_LIVE = window.QUOLDEK_LOCAL ? '' : 'livequoldek.web.app';
window.QUOLDEK_HOMEWORK = window.QUOLDEK_LOCAL
  ? location.href.replace(/[^/]*$/, '') + 'take.html?c='
  : 'https://hwquoldek.web.app/';
const { $, api, el, esc, qs, toast, confetti, modal } = Nova;

/* Interface icons are drawn, not typed: emoji change shape on every device. */
function paintIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(node => {
    if (node.firstElementChild) return;
    node.innerHTML = Sprite.icon(node.dataset.icon, Number(node.dataset.size) || 26);
  });
  const mark = root.querySelector ? root.querySelector('#brand-mark') : null;
  if (mark && !mark.firstElementChild) mark.innerHTML = Sprite.logo(42);
}
document.addEventListener('DOMContentLoaded', () => paintIcons());
paintIcons();
// A quiz reaches a student either as ?id= (server edition) or as a #d= payload
// inside the link itself (static edition) — accept both.
const quizId = qs('id');
const hasPayload = location.hash.includes('d=');
/* Homework arrives three ways now: ?id= on a server, a #d= payload packed into
   the link, or — on homework.quoldek.web.app — a six-character code in the path
   or the query, which is the short one a teacher can actually send to a class. */
const shortCode = (function () {
  const fromQuery = (qs('c') || '').trim();
  const fromPath = (location.pathname.replace(/^\/+|\/+$/g, '') || '');
  const code = fromQuery || fromPath;
  return /^[a-hjkmnp-z2-9]{6}$/i.test(code) ? code.toLowerCase() : '';
})();
let quiz = null, order = [], answers = {}, step = -1, startedAt = 0, name = Nova.store.get('studentName') || '';

async function boot() {
  if (!quizId && !hasPayload && !shortCode) return fail('This link is missing its quiz.');
  try {
    quiz = shortCode ? await NovaLive.sharedQuiz(shortCode) : await api('/quizzes/' + quizId);
  } catch (err) {
    return fail(shortCode ? 'That homework link is not valid any more.'
                          : 'This quiz link is not valid any more.');
  }
  quiz.settings = quiz.settings || {};
  if (!quiz.questions.length) return fail('Your teacher has not added any questions yet.');

  order = quiz.questions.map((q, i) => i);
  if (quiz.settings.shuffleQuestions) order.sort(() => Math.random() - .5);
  cover();
}

const fail = (msg) => { $('#app').innerHTML = `<div class="card pad empty"><span class="em" data-icon="ghost"></span>${esc(msg)}</div>`; };

function cover() {
  const totalPoints = quiz.questions.reduce((s, q) => s + (q.points || 100), 0);
  $('#app').innerHTML = `
    <div class="card cover fade-up">
      <span class="chip">Quoldek</span>
      <h1 style="margin-top:14px">${esc(quiz.title)}</h1>
      <p class="muted">${esc(quiz.description || 'Answer every question, then submit. Good luck!')}</p>
      <div class="facts">
        <span class="chip">${quiz.questions.length} questions</span>
        <span class="chip">${totalPoints} points</span>
        <span class="chip">${quiz.settings.showAnswers ? 'Answers shown at the end' : 'Answers hidden'}</span>
      </div>
      ${quiz.settings.requireName ? `
        <div class="field" style="max-width:340px;margin-bottom:22px">
          <label class="label" for="nm">Your name</label>
          <input class="input" id="nm" placeholder="e.g. Amina K." value="${esc(name)}" autocomplete="name">
        </div>` : ''}
      <button class="btn primary lg" id="start">Start the quiz →</button>
    </div>`;
  $('#start').onclick = () => {
    if (quiz.settings.requireName) {
      name = ($('#nm').value || '').trim();
      if (!name) return toast('Please type your name first', 'bad');
      Nova.store.set('studentName', name);
    } else name = 'Anonymous';
    startedAt = Date.now();
    step = 0;
    render();
  };
  $('#nm')?.addEventListener('keydown', e => { if (e.key === 'Enter') $('#start').click(); });
}

function choicesOf(q) {
  const list = q.choices.slice();
  if (quiz.settings.shuffleChoices && q.type !== 'tf') list.sort(() => Math.random() - .5);
  return list;
}
const shuffled = {};

function render() {
  const q = quiz.questions[order[step]];
  $('#bar').style.width = (step / quiz.questions.length * 100) + '%';
  if (!shuffled[q.id]) shuffled[q.id] = choicesOf(q);

  const box = el('div', { class: 'card qbox' });
  box.append(el('div', { class: 'qkicker' }, `Question ${step + 1} of ${quiz.questions.length} · ${q.points || 100} points`),
             el('h2', {}, q.text || 'Untitled question'));

  if (q.type === 'short') {
    const input = el('input', { class: 'input', style: 'font-size:1.05rem;padding:16px', placeholder: 'Type your answer…',
      oninput: (e) => { answers[q.id] = e.target.value; } });
    input.value = answers[q.id] || '';
    input.addEventListener('keydown', e => { if (e.key === 'Enter') next(); });
    box.append(input);
    setTimeout(() => input.focus(), 60);
  } else {
    shuffled[q.id].forEach((c, i) => {
      const isMulti = q.type === 'multi';
      const picked = isMulti ? (answers[q.id] || []).includes(c.id) : answers[q.id] === c.id;
      const opt = el('div', { class: `opt k${i % 4}` + (picked ? ' on' : '') + (isMulti ? ' multi' : ''), onclick: () => {
        if (isMulti) {
          const set = new Set(answers[q.id] || []);
          set.has(c.id) ? set.delete(c.id) : set.add(c.id);
          answers[q.id] = Array.from(set);
        } else {
          answers[q.id] = c.id;
        }
        render();
        if (!isMulti) { clearTimeout(advanceTimer); advanceTimer = setTimeout(next, 260); }
      } });
      opt.append(el('span', { class: 'key' }, String.fromCharCode(65 + i)), el('span', {}, c.text || '—'));
      box.append(opt);
    });
    if (q.type === 'multi') box.append(el('p', { class: 'tiny faint', style: 'margin-top:8px' }, 'Choose every correct option.'));
  }

  const nav = el('div', { class: 'nav' });
  nav.append(el('button', { class: 'btn ghost', ...(step === 0 ? { disabled: 'disabled' } : {}), onclick: () => { step--; render(); } }, '← Back'),
             el('div', { class: 'grow' }),
             el('button', { class: 'btn primary', onclick: next },
                step === quiz.questions.length - 1 ? 'Finish & submit' : 'Next →'));
  box.append(nav);

  const pips = el('div', { class: 'pips' });
  quiz.questions.forEach((_, i) => {
    const qq = quiz.questions[order[i]];
    pips.append(el('div', {
      class: 'pip' + (i === step ? ' now' : (answers[qq.id] !== undefined && answers[qq.id] !== '' ? ' done' : '')),
      title: 'Question ' + (i + 1), onclick: () => { step = i; render(); }
    }));
  });

  $('#app').innerHTML = '';
  $('#app').append(box, pips);
}

let advanceTimer = null;      // the auto-advance after picking an answer
let submitting = false;       // one submission per attempt, no matter how fast the taps

function next() {
  clearTimeout(advanceTimer);
  if (step === quiz.questions.length - 1) return submit();
  step++; render();
}

/* A child who has left answers blank should be told inside the quiz, not by a
 * browser dialog they will click through without reading. */
function askAboutBlanks(count) {
  const close = modal(`
    <h2 style="margin-bottom:6px">${count} question${count === 1 ? '' : 's'} not answered</h2>
    <p class="muted" style="margin-bottom:20px">You can go back and finish, or send it as it is.</p>
    <div class="row" style="justify-content:flex-end;gap:10px">
      <button class="btn" id="back">Go back</button>
      <button class="btn primary" id="send">Send it anyway</button>
    </div>`, {
    onMount(box) {
      box.querySelector('#back').onclick = () => close();
      box.querySelector('#send').onclick = () => { close(); submit(true); };
    }
  });
}

async function submit(force) {
  if (submitting) return;
  const missing = quiz.questions.filter(q => answers[q.id] === undefined || answers[q.id] === '' ||
                                            (Array.isArray(answers[q.id]) && !answers[q.id].length));
  if (missing.length && !force) return askAboutBlanks(missing.length);
  submitting = true;
  clearTimeout(advanceTimer);
  $('#app').innerHTML = '<div class="card pad center" style="min-height:40vh"><div class="thinking">Marking…</div></div>';
  try {
    const result = await api(`/quizzes/${quizId}/submit`, {
      method: 'POST',
      body: { name, answers, seconds: Math.round((Date.now() - startedAt) / 1000) }
    });
    showResult(result);
  } catch (err) { submitting = false; fail('Could not submit: ' + err.message); }
}

function showResult(result) {
  $('#bar').style.width = '100%';
  const pct = result.total ? Math.round(result.score / result.total * 100) : 0;
  const circumference = 2 * Math.PI * 74;
  const stroke = circumference * (1 - pct / 100);
  const mood = pct >= 90 ? ['Outstanding', 'trophy'] : pct >= 70 ? ['Great work', 'medal']
             : pct >= 50 ? ['Good effort', 'flag'] : ['Keep practising', 'spark'];

  const box = el('div', { class: 'card pad fade-up', style: 'text-align:center;padding:38px' });
  box.innerHTML = `
    <div style="line-height:0;margin-bottom:10px">${Sprite.icon(mood[1], 52, 'var(--grape)')}</div>
    <h1 style="font-size:1.9rem;margin-bottom:6px">${mood[0]}</h1>
    <p class="muted" style="margin-bottom:26px">${esc(result.name)} · ${result.score} of ${result.total} points</p>
    <div class="score-ring">
      <svg width="168" height="168">
        <circle cx="84" cy="84" r="74" stroke="#EFE7DC" stroke-width="13" fill="none"></circle>
        <circle cx="84" cy="84" r="74" stroke="url(#g)" stroke-width="13" fill="none" stroke-linecap="round"
                stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}" id="ring"></circle>
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6C4CF1"></stop><stop offset="1" stop-color="#2BA8FF"></stop></linearGradient></defs>
      </svg>
      <div class="val">${pct}%</div>
    </div>`;
  $('#app').innerHTML = '';
  $('#app').append(box);
  setTimeout(() => {
    const ring = document.getElementById('ring');
    ring.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)';
    ring.style.strokeDashoffset = stroke;
  }, 120);
  if (pct >= 70) confetti();

  if (quiz.settings.showAnswers) {
    const review = el('div', { style: 'margin-top:26px' }, el('h3', { style: 'margin-bottom:14px' }, 'Your answers'));
    quiz.questions.forEach((q, i) => {
      const line = result.breakdown.find(b => b.id === q.id);
      const ok = line?.correct;
      const right = q.type === 'short' ? q.answer
        : q.choices.filter(c => c.correct).map(c => c.text).join(', ');
      const given = q.type === 'short' ? (line?.given || '—')
        : (Array.isArray(line?.given) ? line.given : [line?.given])
            .map(id => q.choices.find(c => c.id === id)?.text).filter(Boolean).join(', ') || '—';
      review.append(el('div', { class: 'review ' + (ok ? 'ok' : 'no'), style: 'text-align:left' },
        el('div', { class: 'spread', style: 'align-items:flex-start;gap:12px' },
          el('strong', { style: 'font-size:.96rem' }, `${i + 1}. ${q.text || 'Untitled'}`),
          el('span', { class: 'chip ' + (ok ? 'live' : ''),
        html: Sprite.icon(ok ? 'tick' : 'cross', 13) + (ok ? ' correct' : ' missed') })),
        el('p', { class: 'tiny muted', style: 'margin-top:8px' }, `You answered: ${given}`),
        ok ? '' : el('p', { class: 'tiny', style: 'margin-top:4px;font-weight:800' }, `Correct: ${right}`),
        q.explanation ? el('p', { class: 'tiny faint', style: 'margin-top:8px;font-style:italic' }, q.explanation) : ''));
    });
    $('#app').append(review);
  }
  $('#app').append(el('div', { class: 'row', style: 'justify-content:center;margin-top:26px' },
    el('button', { class: 'btn', onclick: () => location.reload() }, '↻ Take it again')));
}

boot();
</script>
</body>
</html>
