# Publishes both sites to Firebase Hosting: quoldek.web.app for whoever is
# running the quiz, and playquoldek.web.app for everyone joining it. Schools that
# block github.io can still reach both.
#
# This runs only once the FIREBASE_SERVICE_ACCOUNT secret exists, so it stays
# quiet until Firebase is connected rather than failing on every push.
name: Publish to quoldek.web.app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The key is read from the environment. Pasting it into the script itself broke
      # the test (the JSON's quote marks end the string), so every run skipped.
      - name: Is Firebase connected?
        id: check
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No FIREBASE_SERVICE_ACCOUNT secret yet — skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the site
        if: steps.check.outputs.ready == 'true'
        run: python3 build_pages.py

      # both hosting targets, in one go
      - name: Publish
        if: steps.check.outputs.ready == 'true'
        env:
          # written from the environment rather than a heredoc, so the JSON is
          # never reshaped by the indentation of this file
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx --yes firebase-tools@latest deploy --only hosting \
            --project quiznova-88751 --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
