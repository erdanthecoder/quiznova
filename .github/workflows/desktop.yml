# Builds the Windows app on a real Windows machine.
#
# The zip can be made anywhere, but the installer cannot: putting it together
# runs the installer once to produce its own uninstaller, which needs Windows.
# So the whole thing is built here, on a runner GitHub gives us for nothing, and
# both files are attached to the run for downloading.
name: Windows app

on:
  # No paths filter: it would apply to tag pushes too, and a tag must always
  # build, whatever that commit happened to touch.
  push:
    branches: [main]
    tags: ['v*']
  # Run by hand with a version to publish a release; leave it blank to just build.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a release under this tag, e.g. v1.0.0 (blank = build only)'
        required: false
        default: ''
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    # only the release step needs this; everything else just reads
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: desktop
        run: npm ci || npm install

      - name: Check the app's own pieces still work
        working-directory: desktop
        run: node -e "require('./server.js');require('./games.js');require('./store.js');require('./ops.js');require('./settings.js');console.log('all load')"

      - name: Build the installer and the portable zip
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      # The build proves it compiles. This proves it runs: install the .exe the
      # way a teacher installs it, launch what that put on the disk, and click
      # through the first screens. A green build that opens to a white window
      # has happened before and would pass every other check here.
      - name: Install it and open it, like a teacher would
        working-directory: desktop
        shell: pwsh
        run: |
          npm install --no-save playwright@1.48.2
          $setup = Get-ChildItem dist\Quoldek-Setup-*.exe | Select-Object -First 1
          Write-Host "installing $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"
          # /S is NSIS silent; /D must be last and unquoted
          Start-Process -FilePath $setup.FullName -ArgumentList '/S','/D=C:\QuoldekTest' -Wait
          if (-not (Test-Path 'C:\QuoldekTest\Quoldek.exe')) {
            Get-ChildItem C:\QuoldekTest -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            throw 'the installer did not produce Quoldek.exe'
          }
          $built = Get-Item 'C:\QuoldekTest\Quoldek.exe'
          Write-Host "installed Quoldek.exe ($([math]::Round($built.Length/1MB,1)) MB)"
          node test\smoke.js 'C:\QuoldekTest\Quoldek.exe'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Quoldek-windows-screenshots
          path: desktop/test/shots/*.png
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Quoldek-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 90

      # A tag makes a release with the files on it, so there is one plain link to
      # send people rather than a build to dig through.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          name: Quoldek ${{ inputs.tag || github.ref_name }} for Windows
          tag_name: ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            **Quoldek for Windows.** Its own app, not a browser pointed at the
            website: its own home screen, its own board for the projector, and
            your quizzes in a folder on your own disk.

            **4.1 fixes live games, which did not work in 4.0.** The teacher
            pressed start and the class sat looking at a lobby: the app was
            sending every update and the phones were dropping all of them
            unread. If you have 4.0, replace it.

            Every game mode is also a different game now. You pick a move each
            round as well as an answer — wager your points, rob somebody by
            name, take the route that drops rocks on the climbers below you —
            and the answer decides whether it works.

            Sign in and those quizzes follow you — what you write here is what
            you see on quoldek.web.app and on any other computer you sign in on.

            With no connection you can still write and edit questions, which is
            the point of having an app at all. Live games need the internet,
            because a game is several devices doing something together.

            - **Quoldek-Setup-x.y.z.exe** — the installer. Most people want this one.
            - **Quoldek-x.y.z-windows-x64.zip** — the same app, nothing to install.
              Unzip it anywhere and run `Quoldek.exe`. Use this on a computer you
              are not allowed to install software on.

            Windows will say the publisher is unknown, because the app is not
            signed — that needs a certificate costing money every year. Choose
            **More info → Run anyway**.
          files: |
            desktop/dist/*.exe
            desktop/dist/*.zip
