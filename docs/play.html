<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Quoldek</title>
<link href="fonts.css?v=40a238ef" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg?v=662a6df7">
<link rel="apple-touch-icon" href="logo.svg?v=662a6df7">
<meta name="theme-color" content="#7C4DFF">
<meta name="description" content="Quoldek is a teaching tool for classrooms and families: write or paste a quiz, put it on the board, and everyone answers on their own device. Made for lessons, revision and formative assessment.">
<meta name="application-name" content="Quoldek">
<meta name="apple-mobile-web-app-title" content="Quoldek">
<meta name="category" content="Education">
<meta name="classification" content="Education">
<meta name="subject" content="Education, classroom learning, formative assessment, quizzes">
<meta name="audience" content="Teachers, pupils, schools, families">
<meta name="rating" content="General">
<meta name="distribution" content="global">
<meta property="og:site_name" content="Quoldek">
<meta property="og:type" content="website">
<meta property="og:title" content="Quoldek — classroom quizzes">
<meta property="og:description" content="A teaching tool for classrooms: write or paste a quiz, put it on the board, and the class answers on their own devices.">
<link rel="stylesheet" href="nova.css?v=4c8347b4">
<style>
.shell{max-width:640px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.hud{display:flex;gap:9px;align-items:center;padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.06);
  border:1px solid var(--line-soft);margin-bottom:12px;position:sticky;top:8px;z-index:20;backdrop-filter:blur(14px)}
.hud .who{display:flex;gap:7px;align-items:center;font-weight:800;font-size:.95rem}
.hud .stat{margin-left:auto;text-align:right;line-height:1}
.hud .stat b{display:block;font-size:1.15rem;line-height:1.1}
.hud .stat span{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:800}



/* the phone is the controller: the buttons get the whole screen */
.play{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
#app{display:flex;flex-direction:column;min-height:100dvh}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:.7rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.qhead .left{font-size:1.5rem;letter-spacing:0;font-weight:900;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1}
.qhead .left.hurry{color:#FF6B5A}

/* The clock is a bar that empties, not a number to squint at: a child can see
 * how long is left without reading anything. */
.timerbar{height:12px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;
  border:1px solid var(--line-soft);margin:6px 0 12px;flex:none}
.timerbar i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,#12BE8E,#7BC62D);transition:width .25s linear}
.timerbar i.warn{background:linear-gradient(90deg,#FFC53D,#FF9A3D)}
.timerbar i.hurry{background:linear-gradient(90deg,#FF4D5E,#FF7A45);animation:throb .6s ease-in-out infinite}
@keyframes throb{50%{opacity:.55}}

/* The question sits on paper, dark type on light, so it is the thing you read
 * first — on the old screen it was small grey text above four huge slabs. */
.qcard{background:#FFFDF7;color:#1B1233;border-radius:20px;padding:18px 16px;text-align:center;
  border:2px solid var(--line);box-shadow:0 8px 0 -2px rgba(0,0,0,.35);flex:none;
  animation:tileIn .3s var(--ease) both}
.qtext{font-size:clamp(1.3rem,6.4vw,2rem);font-weight:900;line-height:1.2;letter-spacing:-.01em}
.qcard .askn{display:block;font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  color:#8478A8;margin-bottom:6px}

/* Tiles sized like buttons, not like wallpaper, and sat at the bottom of the
 * screen where a thumb actually reaches. */
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(84px,132px);
  align-content:end;gap:10px;min-height:0;margin-top:12px;padding-bottom:2px}
.opt-btn{display:flex;align-items:center;justify-content:flex-start;text-align:left;gap:12px;
  padding:14px 16px;border-radius:20px;border:2px solid rgba(0,0,0,.35);
  cursor:pointer;font-weight:900;font-size:clamp(1.15rem,5.2vw,1.7rem);color:#fff;background:var(--c);
  transition:transform .12s var(--ease),filter .2s,opacity .2s;
  box-shadow:0 8px 0 -1px rgba(0,0,0,.4),inset 0 -14px 24px -14px rgba(0,0,0,.45);
  animation:tileIn .3s var(--ease) both;overflow:hidden}
@keyframes tileIn{from{opacity:0;transform:translateY(12px)}}
.opt-btn .shape{width:34px;height:34px;flex:none;fill:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.opt-btn:active{transform:translateY(6px);box-shadow:0 2px 0 -1px rgba(0,0,0,.4)}
.opt-btn:disabled{opacity:.4}
.opt-btn.chosen{border-color:#fff;transform:translateY(3px);box-shadow:0 5px 0 -1px rgba(0,0,0,.4)}
.opt-btn .lbl{line-height:1.15;min-width:0;overflow-wrap:anywhere}
.opts.one{grid-template-columns:1fr}
.opts.one .opt-btn{justify-content:center;text-align:center}
/* a long answer should shrink to fit rather than push the tile out of shape */
.opt-btn .lbl.long{font-size:clamp(.95rem,3.6vw,1.15rem)}

/* The middle of the screen was dead space under the question. It belongs to the
 * game: whatever the mode is, this is where a child sees their own side of it —
 * their kart, their fort, their balloons — while the question is still open. */
.stagebox{flex:1;min-height:0;margin-top:12px;border-radius:20px;position:relative;overflow:hidden;
  border:2px solid var(--line-soft);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.22));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;
  animation:tileIn .35s var(--ease) both}
.stagebox .cap{font-size:.64rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.stagebox .big-num{font-size:2.5rem;font-weight:900;line-height:1;letter-spacing:-.02em}
.stagebox .mini-face svg{width:74px;height:74px}
.stagebox .rowline{display:flex;align-items:center;gap:10px}

/* levels, coins, and parts that have to be earned */
.wallet{display:flex;align-items:center;gap:10px;margin:2px 0 14px;padding:11px 13px;border-radius:16px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.wallet .lvl{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--sun);color:#3a2a00;font-weight:900;font-size:1rem;border:2px solid rgba(0,0,0,.35)}
.wallet .mid{flex:1;min-width:0}
.wallet .cap{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.wallet .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:5px}
.wallet .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFC53D,#FF9A3D);
  transition:width .6s cubic-bezier(.22,1,.36,1)}
.wallet .coins{flex:none;display:flex;align-items:center;gap:5px;font-weight:900;font-size:1rem}
.wallet .coins .c{line-height:0}

.choice.locked,.swatch.locked{position:relative;opacity:.5}
.choice.locked::after,.swatch.locked::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:rgba(6,3,16,.42)}
.price{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);z-index:2;font-size:.6rem;
  font-weight:900;padding:1px 6px;border-radius:99px;background:#161036;color:#FFC53D;white-space:nowrap}
.price.no{color:#FF8A9B}
.choice,.swatch{position:relative}

/* what a game paid, on the results screen */
.payout{margin-top:16px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);text-align:left}
.payout h4{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.65;
  margin-bottom:9px}
.payout .line{display:flex;justify-content:space-between;font-size:.86rem;font-weight:650;padding:3px 0}
.payout .line b{font-weight:900}
.payout .sum{border-top:1px solid rgba(255,255,255,.16);margin-top:7px;padding-top:8px;font-size:1rem}
.levelup{margin-top:12px;padding:13px 15px;border-radius:16px;text-align:center;
  background:linear-gradient(120deg,#FFC53D,#FF9A3D);color:#3a2a00;font-weight:900;
  border:2px solid rgba(0,0,0,.35)}

/* the eight cards, on a phone */
.minihand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:2px 0 4px}
.mcard{width:26px;height:36px;border-radius:5px;border:2px solid rgba(0,0,0,.35);background:#fff;
  display:grid;place-items:center}
.mcard.gap{background:rgba(255,255,255,.1);border-style:dashed;border-color:rgba(255,255,255,.3)}

/* a little track, tower, fort or bar, depending on the game */
.minitrack{width:100%;height:22px;border-radius:99px;background:rgba(0,0,0,.32);position:relative;
  border:1px solid var(--line-soft);overflow:hidden}
.minitrack i{position:absolute;top:2px;bottom:2px;left:2px;border-radius:99px;
  background:linear-gradient(90deg,#4F6BFF,#2BA8FF);transition:width .8s var(--ease)}
.minitrack .flag{position:absolute;right:5px;top:3px;bottom:3px;width:4px;border-radius:2px;background:#FFC53D}
.ministack{display:flex;flex-direction:column-reverse;gap:3px;align-items:center}
.ministack i{width:52px;height:13px;border-radius:3px;background:var(--c,#7C4DFF);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);animation:tileIn .3s var(--ease) both}
.minifort{display:flex;flex-direction:column-reverse;gap:3px;align-items:center}
.minifort .row{display:flex;gap:3px}
.minifort i{width:26px;height:14px;border-radius:3px;background:var(--c,#4F6BFF);box-shadow:inset 0 -4px 0 rgba(0,0,0,.24)}
.minifort i.gone{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16)}
.answeredbar{width:100%;height:10px;border-radius:99px;background:rgba(0,0,0,.32);overflow:hidden;border:1px solid var(--line-soft)}
.answeredbar i{display:block;height:100%;background:linear-gradient(90deg,#7C4DFF,#2BA8FF);transition:width .5s var(--ease)}

/* the arena on a phone */
.arena-wrap{gap:8px}
.arena-shell{position:relative;flex:1;min-height:240px;border-radius:20px;overflow:hidden;
  border:2px solid rgba(255,255,255,.12);touch-action:none}
.arena-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;background:#0D0A1C}
.energy{position:absolute;left:10px;right:10px;bottom:10px;height:12px;border-radius:99px;
  background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(255,255,255,.16)}
.energy i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,#12BE8E,#7BC62D);transition:width .12s linear}
.energy i.low{background:linear-gradient(90deg,#FF6B5A,#FFC53D)}
.opt-btn.right{outline:4px solid #12BE8E}
.opt-btn.wrong{outline:4px solid #F4364C;opacity:.75}

/* the shooting range: an arena to swing a crosshair across, and the controls */
.range{position:relative;flex:1;min-height:230px;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#2C2752,#100C22);
  border:2px solid rgba(255,255,255,.10);cursor:crosshair}
.range::after{content:'';position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:100% 14%,14% 100%}
.foe{position:absolute;transform:translate(-50%,50%);display:flex;flex-direction:column;align-items:center;
  gap:3px;animation:drift 3.4s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-50%,50%) translateX(18px)}}
.foe .hp{display:block;width:46px;height:5px;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden}
.foe .hp i{display:block;height:100%;background:var(--mint)}
.foe .nm{font-size:.7rem;font-weight:800;opacity:.85}
.foe.struck{animation:struck .4s}
@keyframes struck{0%,100%{filter:none}30%{filter:brightness(2.4) saturate(2)}60%{transform:translate(-50%,50%) scale(.92)}}
.cross{position:absolute;width:46px;height:46px;margin:0 0 -23px -23px;pointer-events:none;
  border-radius:50%;border:2px solid rgba(255,197,61,.9);box-shadow:0 0 14px rgba(255,197,61,.5)}
.cross::before,.cross::after{content:'';position:absolute;background:rgba(255,197,61,.9)}
.cross::before{left:50%;top:-8px;bottom:-8px;width:2px;margin-left:-1px}
.cross::after{top:50%;left:-8px;right:-8px;height:2px;margin-top:-1px}
.cross.bang{animation:bang .28s var(--ease)}
@keyframes bang{0%{transform:scale(.7);box-shadow:0 0 0 12px rgba(255,197,61,.35)}100%{transform:none}}
.gamepad{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px}
.gamepad .stick{width:112px;height:112px;border-radius:50%;position:relative;touch-action:none;flex:none;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.13),rgba(255,255,255,.04));
  border:2px solid rgba(255,255,255,.16)}
.gamepad .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:linear-gradient(180deg,#8E7BFF,#5B3FE8);box-shadow:0 6px 0 -1px rgba(0,0,0,.4);transition:transform .08s}
.gamepad .fire{flex:1;height:112px;border:none;border-radius:24px;cursor:pointer;font:inherit;font-weight:900;
  font-size:1.5rem;letter-spacing:.06em;color:#fff;background:linear-gradient(180deg,#FF6B5A,#E01F35);
  box-shadow:0 8px 0 -2px rgba(0,0,0,.45)}
.gamepad .fire:active{transform:translateY(4px);box-shadow:0 4px 0 -2px rgba(0,0,0,.45)}
.chip.warn{border-color:var(--amber);color:var(--amber)}

/* the result takes over the screen, the way it does on a games console */
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border-radius:26px;padding:30px 20px;text-align:center;animation:swell .34s var(--ease) both}
@keyframes swell{from{opacity:0;transform:scale(.94)}}
.big .mark{font-size:clamp(3.4rem,20vw,5.5rem);line-height:1;animation:pop .45s var(--ease) both}
.big h2{font-size:clamp(1.5rem,7vw,2.2rem);font-weight:900;margin:6px 0 0}
.big .gain{font-size:clamp(1.6rem,8vw,2.4rem);font-weight:900;margin-top:4px}
.big .sub{opacity:.85;font-weight:600}
.big.good{background:linear-gradient(165deg,#12BE8E,#0B8F6B);color:#fff}
.big.bad{background:linear-gradient(165deg,#F4364C,#B31F32);color:#fff}
.big.wait{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.big .lobby-art{line-height:0;border-radius:16px;overflow:hidden;width:min(300px,86%);margin-bottom:6px;
  border:2px solid rgba(255,255,255,.14)}
.big .lobby-art svg{display:block;width:100%;height:auto}
.big .you{line-height:0;animation:bob 2.4s ease-in-out infinite}
.big .you svg{width:clamp(96px,30vw,150px);height:auto}
.mini-face{display:inline-flex;line-height:0;vertical-align:middle}
.row-name{display:flex;align-items:center;gap:8px}
@keyframes bob{50%{transform:translateY(-8px)}}
.big .sub.dim{opacity:.5;font-size:.9rem}
.big.late{background:linear-gradient(165deg,#5A5170,#3A3350);color:#fff}

.verdict{padding:44px 24px;text-align:center;border-radius:var(--r-xl);animation:fadeUp .4s var(--ease) both}
.verdict.good{background:linear-gradient(160deg,rgba(52,224,161,.24),rgba(52,224,161,.05));border:1px solid rgba(52,224,161,.45)}
.verdict.bad{background:linear-gradient(160deg,rgba(255,77,94,.22),rgba(255,77,94,.05));border:1px solid rgba(255,77,94,.4)}
.verdict .em{font-size:3.6rem;display:block;margin-bottom:10px;animation:pop .5s var(--ease) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}

.hpwrap{margin-top:12px}
.hpwrap .bar{height:13px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.hpwrap .bar i{display:block;height:100%;transition:width .6s var(--ease)}
.charge{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.charge i{display:block;height:100%;background:linear-gradient(90deg,#ffc857,#ff5d8f);transition:width .5s}
.balloons{display:flex;gap:8px;justify-content:center;margin:16px 0 6px}
.balloons i{width:30px;height:38px;border-radius:50% 50% 46% 46%;background:var(--c,#F4364C);
  position:relative;animation:sway 2.6s ease-in-out infinite;transform-origin:bottom center;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.14)}
.balloons i::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:12px;
  margin-left:-1px;background:rgba(255,255,255,.3)}
.balloons i.popped::after{display:none}
.balloons i:nth-child(2){animation-delay:-.9s}
.balloons i:nth-child(3){animation-delay:-1.8s}
.balloons i.popped{background:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);animation:none;opacity:.55}
.balloons.hud-strip{margin:0;gap:5px}
.balloons.hud-strip i{width:15px;height:19px}
@keyframes sway{50%{transform:rotate(9deg)}}
.team-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.team-btn{padding:18px;border-radius:var(--r-lg);border:2px solid var(--line);cursor:pointer;text-align:center;font-weight:800;transition:.2s}
.team-btn.red.on{border-color:#ff4d5e;background:rgba(255,77,94,.18)}
.team-btn.blue.on{border-color:#4f6bff;background:rgba(79,107,255,.18)}
.big-timer{font-size:2.6rem;font-weight:900;text-align:center;letter-spacing:-.03em}
.waiting .pulse{width:60px;height:60px;border-radius:50%;background:var(--grad-brand);margin:0 auto 18px;animation:breathe 2s infinite}
@keyframes breathe{50%{transform:scale(1.18);opacity:.75}}

/* choosing a character */
.picker{margin-top:18px}
.picker .preview{display:flex;justify-content:center;line-height:0;margin-bottom:4px}
.picker .preview svg{width:118px;height:118px;transition:transform .25s var(--ease)}
.picker .preview.bump svg{animation:pop .32s var(--ease)}
.picker h2{font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:14px 0 8px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swatch{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);transition:transform .15s var(--ease)}
.swatch:active{transform:scale(.9)}
.swatch.on{border-color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 0 0 3px rgba(255,255,255,.28)}
/* the part being changed, as a row of tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:99px;border:2px solid var(--line-soft);
  background:rgba(255,255,255,.05);color:var(--muted);font-weight:800;font-size:.82rem;cursor:pointer;
  transition:.15s}
.tab.on{background:#fff;color:#1B1233;border-color:#fff}

/* the choices for that part — never called .shape, that is the marker on an
 * answer button and it has collided with a picker before */
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.choices.swatches{grid-template-columns:repeat(6,1fr)}
.choice{aspect-ratio:1;border-radius:14px;border:2px solid var(--line-soft);background:rgba(255,255,255,.05);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:5px;line-height:0;
  transition:transform .15s var(--ease),border-color .15s,background .15s}
.choice:active{transform:scale(.92)}
.choice.on{border-color:#fff;background:rgba(255,255,255,.14)}
.choice svg{width:100%;height:100%}
</style>
</head>

<script src="quizbank.js?v=f18e8cbc"></script>
<script src="realtime.js?v=75e1623c"></script>
<script src="arena.js?v=fb3b6182"></script>
<script src="paste.js?v=3032c005"></script>
<script src="rules.js?v=2b1ca27f"></script>

<script src="nova-local.js?v=340f2f93"></script>
<script src="account.js?v=00c10e3c"></script>
<script>
window.QUOLDEK_LOCAL = /^(localhost|127\.|0\.0\.0\.0|\[?::1)/.test(location.hostname);
window.QUOLDEK_JOIN = window.QUOLDEK_LOCAL
  ? location.href.replace(/[^/]*$/, '') + 'play.html?pin='
  : 'https://playquoldek.web.app/?pin=';
window.QUOLDEK_LIVE = window.QUOLDEK_LOCAL ? '' : 'livequoldek.web.app';
window.QUOLDEK_HOMEWORK = window.QUOLDEK_LOCAL
  ? location.href.replace(/[^/]*$/, '') + 'take.html?c='
  : 'https://hwquoldek.web.app/';
const { $, api, el, esc, qs, toast, stream, store, confetti, SHAPES, modal } = Nova;

const drawFace = (p, size) => Sprite.face(p && p.avatar, size);
const paintMark = () => { const m = document.getElementById('brand-mark');
                          if (m) m.innerHTML = Sprite.logo(76); };
let pin = qs('pin'), me = null, game = null, drift = 0, ticker = null, picked = null, lastKey = '';
let answeredIndex = -1;   // the question this device has already sent — sticky until the next one
/* What this phone has done this game, counted here rather than asked for: the
   coins it earns are worked out on the device that earned them. */
let tally = { answered: 0, right: 0, bestRun: 0, counted: -1 };
let paidOut = null;              // the payout, worked out once when the game ends

if (pin) { const saved = store.get('player:' + pin); if (saved) me = saved; }

start();

function start() {
  if (!pin) return askPin();
  if (!me) return askName();
  connect();
}

/* ── entry screens ─────────────────────────────── */
function askPin() {
  $('#app').innerHTML = `
    <div class="card pad fade-up" style="margin-top:9vh;text-align:center">
      <div class="brand-mark" id="brand-mark" style="margin:0 auto 18px;width:76px;height:76px"></div>
      <h1 style="font-size:1.9rem;margin-bottom:6px">Join the game</h1>
      <p class="muted tiny" style="margin-bottom:22px">Ask your teacher for the 6-digit PIN.</p>
      <input class="input" id="pin" inputmode="numeric" maxlength="6" placeholder="000000"
             style="font-size:2rem;text-align:center;letter-spacing:.36em;font-weight:800;padding:16px">
      <button class="btn primary lg block" style="margin-top:16px" id="go">Enter</button>
    </div>`;
  const go = async () => {
    const v = $('#pin').value.replace(/\D/g, '');
    if (v.length !== 6) return toast('A PIN is 6 digits', 'bad');
    const btn = $('#go');
    btn.disabled = true; btn.textContent = 'Checking';
    try {
      // check the code is a real game before asking a child to type their name
      await api('/games/' + v);
    } catch {
      btn.disabled = false; btn.textContent = 'Enter';
      $('#pin').value = ''; $('#pin').focus();
      return toast('No game with that PIN. Check the board.', 'bad');
    }
    pin = v; history.replaceState(null, '', 'play.html?pin=' + pin);
    me = store.get('player:' + pin) || null;
    start();
  };
  paintMark();
  $('#go').onclick = go;
  $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#pin').focus();
}

function askName() {
  /* Building your own monster.
   *
   * Five things to choose: the colour and the silhouette, which are what tell
   * two players apart across a room, then the eyes, the mouth and the markings,
   * which are nobody's business but yours. It all packs into one number, so the
   * whole game still passes a character around as a single value.
   */
  const saved = Number(store.get('avatar'));
  const COUNTS = { colour: Sprite.COLOURS, shape: Sprite.SHAPES, eyes: Sprite.EYES,
                   mouth: Sprite.MOUTHS, pattern: Sprite.PATTERNS };

  /* A monster made only of parts this phone actually owns. Used for the one a
     child is shown before they touch anything and for "surprise me", so neither
     can hand over something that has not been earned. */
  const ownedPart = (key, n) => {
    const open = [];
    for (let i = 0; i < n; i++) {
      const held = window.NovaLaunch && !NovaLaunch.out();
      if (held || !window.NovaProgress || NovaProgress.partState(key, i, COUNTS).owned) open.push(i);
    }
    return open.length ? open[Math.floor(Math.random() * open.length)] : 0;
  };
  const randomOwned = () => ({
    colour: ownedPart('colour', Sprite.COLOURS), shape: ownedPart('shape', Sprite.SHAPES),
    eyes: ownedPart('eyes', Sprite.EYES), mouth: ownedPart('mouth', Sprite.MOUTHS),
    pattern: ownedPart('pattern', Sprite.PATTERNS)
  });

  let part = Number.isFinite(saved) && saved > 0 ? Sprite.partsOf(saved) : randomOwned();
  const chosen = () => Sprite.pack(part);

  const TABS = [
    { key: 'colour',  label: 'Colour',  n: Sprite.COLOURS },
    { key: 'shape',   label: 'Shape',   n: Sprite.SHAPES },
    { key: 'eyes',    label: 'Eyes',    n: Sprite.EYES },
    { key: 'mouth',   label: 'Mouth',   n: Sprite.MOUTHS },
    { key: 'pattern', label: 'Markings', n: Sprite.PATTERNS }
  ];
  let tab = 0;

  $('#app').innerHTML = `
    <div class="card pad fade-up" style="margin-top:4vh">
      <span class="chip">PIN ${esc(pin)}</span>
      <h1 style="font-size:1.7rem;margin:14px 0 4px">What is your name?</h1>
      <p class="muted tiny">Everyone sees this on the big screen.</p>
      <div class="field" style="margin-top:16px">
        <input class="input" id="nm" maxlength="16" placeholder="e.g. Sam" value="${esc(store.get('studentName') || '')}"></div>

      <div class="wallet" id="wallet" hidden></div>

      <div class="picker">
        <div class="preview" id="pv"></div>
        <div class="row" style="justify-content:center;gap:8px;margin:2px 0 12px">
          <button class="btn ghost sm" type="button" id="surprise">Surprise me</button>
        </div>
        <div class="tabs" id="tabs"></div>
        <div class="choices" id="choices"></div>
      </div>

      <button class="btn primary lg block" style="margin-top:18px" id="join">Join the game</button>
      <p class="tiny faint" style="margin-top:10px;text-align:center">Wrong PIN? <a href="play.html" style="text-decoration:underline">Change it</a></p>
    </div>`;

  const pv = $('#pv'), tabsBox = $('#tabs'), choices = $('#choices');
  const all = (sel) => Array.from(document.querySelectorAll(sel));

  /* The level and the purse, drawn from this phone's own progress. Nothing about
     it leaves the device — it is what this browser has earned, and the screen
     says so rather than implying it follows the child around. */
  function paintWallet() {
    const box = $('#wallet');
    if (!box || !window.NovaProgress) return;
    if (window.NovaLaunch && !NovaLaunch.out()) return;   // the update is not open yet
    const state = NovaProgress.read();
    const lv = NovaProgress.levelFor(state.lifetime);
    box.hidden = false;
    box.innerHTML = '';
    box.append(
      el('div', { class: 'lvl' }, String(lv.level)),
      el('div', { class: 'mid' },
        el('div', { class: 'cap' }, lv.top ? 'Top level' : `${lv.toNext} coins to level ${lv.level + 1}`),
        el('div', { class: 'bar' }, el('i', { style: `width:${lv.need ? Math.round(lv.into / lv.need * 100) : 100}%` }))),
      el('div', { class: 'coins' },
        el('span', { class: 'c', html: Sprite.icon('coin', 20, '#FFC53D') }),
        String(state.coins)));
    box.title = 'Kept on this phone. Play to earn coins and unlock more monsters.';
  }

  /* Each swatch shows the monster you would get by changing only that one thing,
   * so a child can see the choice rather than guess at it. */
  const paint = () => {
    pv.innerHTML = Sprite.face(chosen(), 118);
    pv.classList.remove('bump'); void pv.offsetWidth; pv.classList.add('bump');
    all('.tab').forEach((b, i) => b.classList.toggle('on', i === tab));

    const { key, n } = TABS[tab];
    choices.innerHTML = '';
    choices.className = 'choices' + (key === 'colour' ? ' swatches' : '');
    // before the update opens, every monster is simply available, exactly as it
    // was yesterday — nothing is teased and nothing is taken away
    const prog = (window.NovaLaunch && !NovaLaunch.out()) ? null : window.NovaProgress;
    for (let i = 0; i < n; i++) {
      const info = prog ? prog.partState(key, i, COUNTS) : { owned: true };
      const b = el('button', { class: (key === 'colour' ? 'swatch' : 'choice')
                                      + (part[key] === i ? ' on' : '')
                                      + (info.owned ? '' : ' locked'),
                               type: 'button',
                               title: info.owned ? TABS[tab].label + ' ' + (i + 1)
                                    : `${info.tierName} · ${info.cost} coins`
                                      + (info.levelReached ? '' : ` · level ${info.needsLevel}`) });
      if (key === 'colour') b.style.background = Sprite.palette[i];
      else if (key === 'shape') b.innerHTML = Sprite.crest(i, 46, Sprite.palette[part.colour]);
      else b.innerHTML = Sprite.face(Sprite.pack(Object.assign({}, part, { [key]: i })), 52);

      if (!info.owned) {
        // a locked part shows what it costs, or what level opens it — never just
        // a padlock, because "no" without a reason is the most annoying thing a
        // game can say
        b.append(el('span', { class: 'price' + (info.canBuy ? '' : ' no') },
          info.levelReached ? String(info.cost) : 'Lv ' + info.needsLevel));
      }

      b.onclick = () => {
        if (info.owned) { part[key] = i; paint(); return; }
        const bought = prog.buy(key, i, COUNTS);
        if (!bought.ok) return toast(bought.why, 'bad');
        toast(`Unlocked for ${info.cost} coins`, 'good');
        part[key] = i;
        paintWallet();
        paint();
      };
      choices.append(b);
    }
  };

  TABS.forEach((t, i) => {
    const b = el('button', { class: 'tab', type: 'button', onclick: () => { tab = i; paint(); } }, t.label);
    tabsBox.append(b);
  });
  $('#surprise').onclick = () => { part = randomOwned(); paint(); };
  paintWallet();
  paint();

  const join = async () => {
    const name = ($('#nm').value || '').trim();
    if (!name) return toast('Type your name first', 'bad');
    store.set('studentName', name);
    store.set('avatar', String(chosen()));
    if (window.NovaProgress) NovaProgress.remember(chosen());
    try {
      const res = await api(`/games/${pin}/join`, { method: 'POST', body: { name, avatar: chosen() } });
      me = res.player;
      // the game keeps two players from looking alike, so say so rather than
      // quietly handing back a different monster
      if (Number(me.avatar) !== chosen()) toast('Someone had that colour and shape. You got the next shape.');
      store.set('player:' + pin, me);
      connect();
    } catch (err) { toast(err.message, 'bad'); }
  };
  $('#join').onclick = join;
  $('#nm').onkeydown = e => { if (e.key === 'Enter') join(); };
  setTimeout(() => $('#nm').focus(), 80);
}

/* ── realtime ──────────────────────────────────── */
/* Phones drop the network all the time: the screen locks, the tab goes to the
 * back, the wifi hands over to 4G. A failed request means "ask again", never
 * "the game is over" — only the server saying 404 means that. Getting this
 * wrong is what made closing the tab look like it finished the game. */
function gone() {
  store.del('player:' + pin);
  $('#app').innerHTML = `<div class="card pad empty" style="margin-top:14vh"><span class="em">${Sprite.icon('ghost', 44)}</span>
    That game is not running any more.<br><a class="btn sm" style="margin-top:14px" href="play.html">Try another PIN</a></div>`;
}

function waiting() {
  if (game) return;                       // already playing — say nothing, just retry
  $('#app').innerHTML = `<div class="card pad empty" style="margin-top:14vh"><span class="em">${Sprite.icon('ghost', 44)}</span>
    Getting you back into the game…</div>`;
}

let reconnects = 0;
function refresh() {
  /* Asking and drawing are kept apart on purpose. A failed request is a network
     problem and is worth retrying quietly; a failure while drawing is a bug in
     this page, and swallowing it as "bad wifi" means the screen sits there
     frozen with nothing in the console — which is exactly how a missing variable
     once hid for an afternoon. Drawing throws out loud. */
  return api(`/games/${pin}`).then(
    state => { reconnects = 0; return state; },
    err => {
      if (err && err.status === 404) { gone(); return null; }   // it really has ended
      reconnects += 1;
      waiting();
      setTimeout(refresh, Math.min(8000, 600 * reconnects));
      return null;
    }
  ).then(state => { if (state) apply(state); });
}

function connect() {
  refresh();
  stream(`/games/${pin}/events`, (msg) => { if (msg.data && msg.data.pin) apply(msg.data); }, `/games/${pin}`);
  // coming back from another app: don't wait for the next poll, catch up now
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  window.addEventListener('online', refresh);
}

function apply(state) {
  game = state;
  drift = state.serverNow - Date.now();
  const mine = state.players.find(p => p.id === me?.id);
  if (mine) me = { ...me, ...mine };
  else if (state.state !== 'lobby') { /* removed */ }
  // our own answer reaches the host a moment before the host scores it: until then
  // the state still says answered:false, and believing it would flash the question back
  if (state.state === 'question' && answeredIndex === state.index && me) me.answered = true;

  // one question is counted once, when its answer comes up
  if (state.state === 'reveal' && mine && tally.counted !== state.index) {
    tally.counted = state.index;
    if (mine.correct !== null && mine.correct !== undefined) {
      tally.answered += 1;
      if (mine.correct) tally.right += 1;
    }
    tally.bestRun = Math.max(tally.bestRun, mine.streak || 0, mine.best || 0);
  }
  document.body.classList.toggle('laser', state.mode === 'laser');
  const key = state.state + ':' + state.index + ':' + (me?.answered ? 'a' : 'w');
  const fresh = key !== lastKey;
  lastKey = key;
  if (fresh) render(true); else patch();
}

/* Between two states nothing structural changes — only numbers do. Updating them in
 * place keeps the cards, their entry animations and the answer buttons alive; rebuilding
 * the screen every poll is what made the game look like it was stuttering. */
function patch() {
  if (!me) return;
  const hudNode = document.querySelector('#app .hud');
  if (hudNode) hudNode.replaceWith(hud());
  const players = document.getElementById('lobby-count');
  if (players) players.textContent = game.players.length + ' player' + (game.players.length === 1 ? '' : 's') + ' waiting';
  const counts = document.querySelectorAll('[data-team-count]');
  counts.forEach(node => {
    const side = node.getAttribute('data-team-count');
    node.textContent = game.players.filter(p => p.team === side).length + ' players';
  });
}

function hud() {
  const node = el('div', { class: 'hud' });
  node.append(el('div', { class: 'who' }, el('span', { class: 'mini-face', html: drawFace(me, 30) }), me.name));
  if (game.mode === 'laser') {
    node.append(el('span', { class: 'chip ' + (me.team === 'red' ? '' : 'live'),
      style: `border-color:${me.team === 'red' ? 'rgba(255,77,94,.5)' : 'rgba(79,107,255,.5)'}` },
      me.team === 'red' ? 'Crimson' : 'Cobalt'));
    node.append(el('div', { class: 'stat' }, el('b', {}, me.down ? 'DOWN' : me.hp + ' HP'), el('span', {}, 'shield')));
  } else {
    if (game.mode === 'snow') {
      node.append(el('span', { class: 'chip ' + (me.team === 'red' ? '' : 'live'),
        style: `border-color:${me.team === 'red' ? 'rgba(255,77,94,.5)' : 'rgba(79,107,255,.5)'}` },
        me.team === 'red' ? 'Crimson' : 'Cobalt'));
    }
    const unit = { kart: ['distance', (me.distance || 0) + 'm'], tower: ['blocks', String(me.blocks || 0)],
                   treasure: ['coins', String(me.coins || 0)], boss: ['damage', String(me.score)],
                   snow: ['blocks off', String(me.hits || 0)], heist: ['gold', String(me.coins || 0)],
                   cards: ['cards', `${(me.cards || []).length}/8`],
                   tug: ['pulled', String(me.hits || 0)] }[game.mode]
                 || ['points', String(me.score)];
    node.append(el('div', { class: 'stat' }, el('b', {}, unit[1]), el('span', {}, unit[0])));
    // in Balloon Drop what is left is more urgent than the score
    if (game.mode === 'balloon') {
      const strip = el('div', { class: 'balloons hud-strip' });
      for (let b = 0; b < 3; b++) {
        strip.append(el('i', { class: b < (me.balloons || 0) ? '' : 'popped',
                               style: `--c:${['#F4364C', '#FFC53D', '#2BA8FF'][b]}` }));
      }
      node.append(strip);
    }
  }
  if (me.streak >= 2) node.append(el('span', { class: 'chip warn' },
    el('span', { class: 'mini-face', html: Sprite.icon('flame', 14) }), String(me.streak)));
  return node;
}

function render(fresh) {
  if (!me) return;
  const app = $('#app');
  app.innerHTML = '';
  app.append(hud());

  if (game.state === 'lobby') return app.append(lobbyCard());
  if (game.state === 'arena') return app.append(arenaCard());
  if (arena) { arena.stop(); arena = null; }
  if (game.state === 'over') return app.append(overCard());
  if (game.state === 'reveal') return app.append(revealCard());
  app.append(questionCard(fresh));
  runTimer();   // only reached on a structural change, so the countdown is not restarted
}

function lobbyCard() {
  const card = el('div', { class: 'play' });
  const panel = el('div', { class: 'big wait' });
  panel.innerHTML = `
    <div class="lobby-art">${Sprite.scene(game.mode, 300)}</div>
    <div class="you">${drawFace(me, 120)}</div>
    <h2>You are in</h2>
    <p class="sub">${esc(game.quizTitle)}</p>
    <p class="sub" style="margin-top:14px">${esc((game.modeInfo && game.modeInfo.blurb) || '')}</p>
    <p class="sub dim" id="lobby-count">${game.players.length} player${game.players.length === 1 ? '' : 's'} waiting</p>`;
  card.append(panel);

  // both team games let a child choose a side before the whistle
  if (game.mode === 'laser' || game.mode === 'snow') {
    const pick = el('div', { class: 'team-pick', style: 'flex:none' });
    ['red', 'blue'].forEach(side => {
      const count = game.players.filter(p => p.team === side).length;
      pick.append(el('div', { class: `team-btn ${side}` + (me.team === side ? ' on' : ''), onclick: async () => {
        if (me.team === side) return;
        try { await api(`/games/${pin}/team`, { method: 'POST', body: { playerId: me.id } }); }
        catch (err) { toast(err.message, 'bad'); }
      } }, (side === 'red' ? 'Crimson' : 'Cobalt'),
         el('div', { class: 'tiny faint', 'data-team-count': side }, count + ' players')));
    });
    card.append(el('p', { class: 'label', style: 'margin-top:14px;flex:none' }, 'Pick your team'), pick);
  }
  if (game.mode === 'balloon') {
    const strip = el('div', { class: 'balloons lobby', style: 'flex:none' });
    for (let b = 0; b < 3; b++) strip.append(el('i', { style: `--c:${['#F4364C', '#FFC53D', '#2BA8FF'][b]}` }));
    card.append(strip);   // the mode's own blurb above already explains them
  }
  return card;
}

/* Laser Tag: one arena, and your own energy bar decides when you answer.
 *
 * Play until the bar empties or somebody tags you, answer a question to get back
 * in with a full bar, and carry on. Ten points for an alien, a hundred for another
 * player. The joystick walks and aims at once; a keyboard uses WASD and the mouse.
 */
let arena = null, arenaQ = 0, arenaAsking = false;

function arenaCard() {
  const card = el('div', { class: 'play arena-wrap' });
  card.append(el('div', { class: 'qhead' },
    el('span', { class: 'chip', id: 'a-score' }, '0'),
    el('span', { class: 'chip', id: 'a-power' }, ''),
    el('span', { class: 'chip', id: 'a-alive' }, 'In play')));

  const shell = el('div', { class: 'arena-shell' });
  const canvas = el('canvas', { class: 'arena-canvas', id: 'arena' });
  const bar = el('div', { class: 'energy' }, el('i', { id: 'a-energy' }));
  shell.append(canvas, bar);
  card.append(shell);

  const pad = el('div', { class: 'gamepad' });
  pad.innerHTML = `<div class="stick" id="stick"><span class="knob" id="knob"></span></div>
    <button class="fire" id="fire">FIRE</button>`;
  card.append(pad);
  setTimeout(startArena, 0);
  return card;
}

function startArena() {
  const canvas = document.getElementById('arena');
  if (!canvas || arena) return;
  arena = NovaArena.start({
    canvas, me,
    send: (event, payload) => Nova.arenaSend && Nova.arenaSend(pin, event, payload),
    onScore: (score) => { const n = document.getElementById('a-score'); if (n) n.textContent = score; },
    onSave: (score) => api(`/games/${pin}/score`, { method: 'POST', body: { playerId: me.id, score } })
                         .catch(() => {}),
    onQuestion: () => askArenaQuestion()
  });
  if (Nova.arenaListen) Nova.arenaListen(pin, (event, payload) => arena && arena.heard(event, payload));
  wireStick();
  paintArenaHud();
}

function paintArenaHud() {
  if (!arena) return;
  const bar = document.getElementById('a-energy');
  if (!bar) return;                                  // the screen moved on
  bar.style.width = Math.max(0, arena.energy) + '%';
  bar.classList.toggle('low', arena.energy < 28);
  const power = document.getElementById('a-power');
  if (power) { power.textContent = arena.power || 'no power-up'; power.classList.toggle('live', !!arena.power); }
  const alive = document.getElementById('a-alive');
  if (alive) alive.textContent = arena.alive ? 'In play' : 'Out';
  requestAnimationFrame(paintArenaHud);
}

/* The stick both walks and aims, so a thumb never has to do two jobs. */
function wireStick() {
  const stick = document.getElementById('stick');
  const knob = document.getElementById('knob');
  const fire = document.getElementById('fire');
  if (!stick) return;
  const grip = (e) => {
    const t = e.touches ? e.touches[0] : e;
    const box = stick.getBoundingClientRect();
    const dx = (t.clientX - (box.left + box.width / 2)) / (box.width / 2);
    const dy = (t.clientY - (box.top + box.height / 2)) / (box.height / 2);
    const len = Math.min(1, Math.hypot(dx, dy));
    const ang = Math.atan2(dy, dx);
    if (arena) arena.stick(Math.cos(ang) * len, Math.sin(ang) * len);
    knob.style.transform = `translate(${Math.cos(ang) * len * 26}px,${Math.sin(ang) * len * 26}px)`;
    e.preventDefault();
  };
  const release = () => { if (arena) arena.stick(0, 0); knob.style.transform = 'none'; };
  ['touchstart', 'touchmove'].forEach(ev => stick.addEventListener(ev, grip, { passive: false }));
  ['touchend', 'touchcancel'].forEach(ev => stick.addEventListener(ev, release));
  stick.addEventListener('mousedown', (e) => {
    grip(e);
    const move = (m) => grip(m);
    const up = () => { release(); window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  });
  let held = null;
  const hold = (e) => { e.preventDefault(); if (arena) arena.fire(); held = setInterval(() => arena && arena.fire(), 90); };
  const drop = () => { clearInterval(held); held = null; };
  fire.addEventListener('touchstart', hold, { passive: false });
  ['touchend', 'touchcancel'].forEach(ev => fire.addEventListener(ev, drop));
  fire.addEventListener('mousedown', hold);
  window.addEventListener('mouseup', drop);
}

/* Out of energy, or tagged: one question buys the way back in. */
function askArenaQuestion() {
  if (arenaAsking) return;
  arenaAsking = true;
  const set = (game.quiz && game.quiz.length) ? game.quiz : [];
  if (!set.length) { arenaAsking = false; if (arena) arena.revive(); return; }
  const q = set[arenaQ % set.length];
  arenaQ += 1;

  const close = modal(`
    <p class="label" style="margin-bottom:6px">Answer to get back in</p>
    <h2 style="margin-bottom:16px">${esc(q.text || 'Question')}</h2>
    <div class="opts" id="q-opts" style="min-height:180px"></div>`, {
    onMount(box) {
      const wrap = box.querySelector('#q-opts');
      (q.choices || []).forEach((c, i) => {
        const btn = el('button', { class: `opt-btn a${i % 6}`, onclick: () => {
          const right = !!c.correct;
          btn.classList.add(right ? 'right' : 'wrong');
          if (navigator.vibrate) navigator.vibrate(right ? [18, 40, 18] : 80);
          setTimeout(() => {
            if (right) {
              close();
              arenaAsking = false;
              if (arena) arena.revive();
            } else {
              // wrong keeps you out: try the next one
              close();
              arenaAsking = false;
              askArenaQuestion();
            }
          }, right ? 420 : 760);
        } });
        const text = c.text || '';
      btn.innerHTML = `${SHAPES[i % 6]}<span class="lbl${text.length > 16 ? ' long' : ''}">${esc(text)}</span>`;
        wrap.append(btn);
      });
    }
  });
}

/* Your own side of whatever game is being played, under the question.
 *
 * The board shows the whole class; this shows only you, because a child looking
 * down at their phone should still be able to tell how they are doing without
 * looking up. Each mode fills it with its own thing. */
function stagePanel() {
  const box = el('div', { class: 'stagebox', id: 'stagebox' });
  const rank = game.players.findIndex(p => p.id === me.id) + 1;
  const answered = game.players.filter(p => p.answered).length;

  if (game.mode === 'kart') {
    const far = Math.max(1, game.trackLength || 1000);
    box.append(el('span', { class: 'cap' }, 'Your kart'),
      el('div', { class: 'rowline' },
        el('span', { class: 'mini-face', html: Sprite.icon('kart', 44, '#FFC53D') }),
        el('span', { class: 'big-num' }, `${me.distance || 0}m`)),
      el('div', { class: 'minitrack' },
        el('i', { style: `width:${Math.max(4, Math.min(96, (me.distance || 0) / far * 96))}%` }),
        el('span', { class: 'flag' })));
  } else if (game.mode === 'tower') {
    const stack = el('div', { class: 'ministack' });
    for (let i = 0; i < Math.min(8, me.blocks || 0); i++) {
      stack.append(el('i', { style: `--c:${['#F4364C', '#FFC53D', '#4F6BFF', '#12BE8E'][i % 4]};animation-delay:${i * 40}ms` }));
    }
    box.append(el('span', { class: 'cap' }, 'Your tower'),
               stack.children.length ? stack : el('span', { class: 'cap' }, 'Nothing built yet'),
               el('span', { class: 'big-num' }, String(me.blocks || 0)));
  } else if (game.mode === 'tug') {
    // the rope belongs to the room, so the phone shows which way it is going
    const rope = Math.max(-100, Math.min(100, game.rope || 0));
    const ours = me.team === 'red' ? -rope : rope;
    box.append(el('span', { class: 'cap' },
                 ours > 0 ? 'Your team is winning the rope'
               : ours < 0 ? 'They are pulling it back' : 'Dead even'),
      el('div', { class: 'minitrack' },
        el('i', { style: `width:${Math.round(Math.max(2, Math.min(100, (ours + 100) / 2)))}%;` +
                         `background:${me.team === 'red' ? '#F4364C' : '#4F6BFF'}` })),
      el('span', { class: 'big-num' }, `${Math.abs(ours)}`));
  } else if (game.mode === 'heist') {
    box.append(el('span', { class: 'cap' }, 'Your gold'),
      el('div', { class: 'rowline' },
        el('span', { class: 'mini-face', html: Sprite.icon('coin', 40, '#FFC53D') }),
        el('span', { class: 'big-num' }, String(me.coins || 0))),
      me.chest ? el('span', { class: 'cap' }, me.chest) : el('span', {}));
  } else if (game.mode === 'cards') {
    const all = ['star', 'moon', 'leaf', 'flame', 'drop', 'bolt', 'gem', 'crown'];
    const tint = { star: '#FFC53D', moon: '#8C7BB8', leaf: '#12BE8E', flame: '#FF7A45',
                   drop: '#2BA8FF', bolt: '#F4364C', gem: '#7C4DFF', crown: '#E5A02A' };
    const hand = el('div', { class: 'minihand' });
    const held = me.cards || [];
    all.forEach(c => hand.append(el('i', { class: 'mcard' + (held.includes(c) ? '' : ' gap'),
                                           html: held.includes(c) ? Sprite.icon(c, 15, tint[c]) : '' })));
    box.append(el('span', { class: 'cap' }, `${held.length} of 8 cards`), hand,
               me.spares ? el('span', { class: 'cap' }, `${me.spares} spare — three trades for one you need`)
                         : el('span', {}));
  } else if (game.mode === 'treasure') {
    box.append(el('span', { class: 'cap' }, 'Your coins'),
      el('div', { class: 'rowline' },
        el('span', { class: 'mini-face', html: Sprite.icon('gem', 40, '#FFC53D') }),
        el('span', { class: 'big-num' }, String(me.coins || 0))));
  } else if (game.mode === 'boss' && game.boss) {
    box.append(el('span', { class: 'cap' }, game.boss.name),
      el('span', { class: 'mini-face', html: Sprite.icon('dragon', 58, '#9B7BFF') }),
      el('div', { class: 'answeredbar' },
         el('i', { style: `width:${Math.max(0, game.boss.hp / game.boss.max * 100)}%;background:linear-gradient(90deg,#F4364C,#FF7A45)` })),
      el('span', { class: 'cap' }, `${game.boss.hp} HP left`));
  } else if (game.mode === 'snow') {
    const foe = game.teams[me.team === 'red' ? 'blue' : 'red'] || { blocks: 0, max: 0, name: '' };
    const fort = el('div', { class: 'minifort' });
    const rows = Math.max(1, Math.ceil((foe.max || 1) / 3));
    for (let r = 0; r < rows; r++) {
      const row = el('div', { class: 'row' });
      for (let c = 0; c < 3; c++) {
        const nth = r * 3 + c;
        if (nth >= (foe.max || 0)) continue;
        row.append(el('i', { class: nth < foe.blocks ? '' : 'gone',
                             style: `--c:${me.team === 'red' ? '#4F6BFF' : '#F4364C'}` }));
      }
      fort.append(row);
    }
    box.append(el('span', { class: 'cap' }, `Knock down the ${foe.name} fort`), fort,
               el('span', { class: 'cap' }, `${foe.blocks} block${foe.blocks === 1 ? '' : 's'} standing`));
  } else if (game.mode === 'balloon') {
    const strip = el('div', { class: 'balloons' });
    for (let b = 0; b < 3; b++) {
      strip.append(el('i', { class: b < (me.balloons || 0) ? '' : 'popped',
                             style: `--c:${['#F4364C', '#FFC53D', '#2BA8FF'][b]}` }));
    }
    box.append(el('span', { class: 'cap' }, 'Your balloons'), strip,
      el('span', { class: 'cap' }, (me.balloons || 0) > 0
        ? `Get it wrong and one pops` : 'All gone — play on for points'));
  } else {
    box.append(el('span', { class: 'mini-face', html: drawFace(me, 74) }),
      el('span', { class: 'big-num' }, rank ? '#' + rank : '—'),
      el('span', { class: 'cap' }, `of ${game.players.length} playing`));
  }

  // what the game is being played for, if it is not simply every question
  const goal = game.goal || { kind: 'questions' };
  if (goal.kind === 'points') {
    box.append(el('span', { class: 'cap', style: 'margin-top:6px' },
      `${Math.max(0, goal.value - (me.score || 0))} points to ${goal.value}`));
  } else if (goal.kind === 'time' && game.startedAt) {
    const left = Math.max(0, game.startedAt + goal.value * 60000 - (Date.now() + drift));
    const m = Math.floor(left / 60000), sec = Math.floor(left % 60000 / 1000);
    box.append(el('span', { class: 'cap', style: 'margin-top:6px' },
      `${m}:${String(sec).padStart(2, '0')} left in the game`));
  }

  // everybody's game shows how much of the class is still thinking
  box.append(el('div', { class: 'answeredbar', style: 'margin-top:6px' },
      el('i', { style: `width:${game.players.length ? answered / game.players.length * 100 : 0}%` })),
    el('span', { class: 'cap' }, `${answered} of ${game.players.length} answered`));
  return box;
}

function questionCard(fresh) {
  const q = game.question;
  const card = el('div', { class: 'play' });

  if (me.answered) {
    const shape = SHAPES[(picked && (q.choices || []).findIndex(c => c.id === picked)) % 6] || '';
    card.append(el('div', { class: 'big wait' },
      el('div', { class: 'mark', html: shape ? shape.replace('class="shape"', 'class="shape" style="width:74px;height:74px;fill:#fff"') : '⏳' }),
      el('h2', {}, 'Answer sent'),
      el('p', { class: 'sub' }, 'Eyes on the board')));
    return card;
  }

  card.append(el('div', { class: 'qhead' },
    el('span', { class: 'left', id: 'ptimer' }, ''),
    el('span', {}, `Question ${game.index + 1} of ${game.total}`)));
  card.append(el('div', { class: 'timerbar' }, el('i', { id: 'ptimerbar' })));
  card.append(el('div', { class: 'qcard' }, el('h2', { class: 'qtext' }, q.text || 'Question')));
  card.append(stagePanel());
  if (game.mode === 'laser' && me.down)
    card.append(el('p', { class: 'tiny', style: 'color:var(--amber)' },
      'You are down. A right answer heals a teammate.'));

  if (q.type === 'short') {
    const input = el('input', { class: 'input', style: 'font-size:1.15rem;padding:16px', placeholder: 'Type your answer' });
    const send = el('button', { class: 'btn primary lg block', style: 'margin-top:12px',
      onclick: () => answer(input.value.trim()) }, 'Send');
    input.onkeydown = e => { if (e.key === 'Enter') answer(input.value.trim()); };
    card.append(input, send);
    setTimeout(() => input.focus(), 80);
  } else {
    const isMulti = q.type === 'multi';
    const chosen = new Set();
    const wrap = el('div', { class: 'opts' + (q.choices.length <= 2 ? ' one' : '') });
    q.choices.forEach((c, i) => {
      const btn = el('button', { class: `opt-btn a${i % 6}`, style: `animation-delay:${i * 50}ms`, onclick: () => {
        if (isMulti) {
          chosen.has(c.id) ? chosen.delete(c.id) : chosen.add(c.id);
          btn.classList.toggle('chosen', chosen.has(c.id));
        } else answer(c.id);
      } });
      const text = c.text || '';
      btn.innerHTML = `${SHAPES[i % 6]}<span class="lbl${text.length > 16 ? ' long' : ''}">${esc(text)}</span>`;
      wrap.append(btn);
    });
    card.append(wrap);
    if (isMulti) card.append(el('button', { class: 'btn primary lg block',
      onclick: () => answer(Array.from(chosen)) }, 'Send my answers'));
  }
  return card;
}

async function answer(value) {
  if (!value || (Array.isArray(value) && !value.length)) return toast('Pick an answer first', 'bad');
  picked = value;
  try {
    const res = await api(`/games/${pin}/answer`, { method: 'POST', body: { playerId: me.id, answer: value } });
    answeredIndex = game.index;
    me.answered = true; me.correct = res.correct; me.score = res.score; me.hp = res.hp; me.streak = res.streak;
    if (navigator.vibrate) navigator.vibrate(res.correct ? [22, 40, 22] : 90);
    render(true);
  } catch (err) { toast(err.message, 'bad'); }
}

function revealCard() {
  const q = game.question;
  const ok = me.correct;
  const card = el('div', { class: 'play' });
  const g = me.lastGain || 0;

  if (me.correct === null || me.correct === undefined) {
    card.append(el('div', { class: 'big late' },
      el('div', { class: 'mark', html: Sprite.icon('clock', 78) }),
      el('h2', {}, 'Too slow'),
      el('p', { class: 'sub' }, 'Be quicker next round')));
  } else {
    const line = game.mode === 'laser' ? (me.down ? 'Teammate healed' : ok ? 'Laser fired' : 'Shield hit')
      : game.mode === 'kart'     ? (ok ? `+${g} metres` : 'Spun out')
      : game.mode === 'tower'    ? (ok ? `+${g} block${g > 1 ? 's' : ''}` : 'A block fell')
      : game.mode === 'treasure' ? (ok ? `+${g} coins` : 'Empty chest')
      : game.mode === 'tug'      ? (ok ? `Pulled ${g}` : 'Lost your grip')
      : game.mode === 'heist'    ? (ok ? (me.chest || `+${g} gold`) : 'Empty-handed')
      : game.mode === 'cards'    ? (ok ? (me.chest || 'A card') : 'No card this time')
      : game.mode === 'boss'     ? (ok ? `${g} damage` : 'The boss hit back')
      : game.mode === 'snow'     ? (ok ? `Direct hit · +${g}` : 'Wide of the fort')
      : game.mode === 'balloon'  ? (ok ? `+${g || 0}`
                                       : (me.balloons > 0 ? `A balloon popped · ${me.balloons} left`
                                                          : 'Your last balloon popped'))
      :                            (ok ? `+${g || 0}` : 'No points');
    card.append(el('div', { class: 'big ' + (ok ? 'good' : 'bad') },
      el('div', { class: 'mark', html: Sprite.icon(ok ? (me.streak >= 3 ? 'flame' : 'tick') : 'cross', 86) }),
      el('h2', {}, ok ? (me.streak >= 3 ? 'On fire' : 'Correct') : 'Not this time'),
      el('p', { class: 'gain' }, line),
      me.chest ? el('p', { class: 'sub' }, me.chest) : '',
      me.streak >= 2 ? el('p', { class: 'sub' }, `${me.streak} in a row`) : ''));
  }

  const right = q.type === 'short' ? q.answer : (q.choices || []).filter(c => c.correct).map(c => c.text).join(', ');
  const info = el('div', { class: 'card pad', style: 'margin-top:12px;flex:none' },
    el('p', { class: 'tiny faint' }, 'Answer'),
    el('p', { style: 'font-weight:800;font-size:1.15rem;margin-top:2px' }, right || ''));
  if (q.explanation) info.append(el('p', { class: 'tiny muted', style: 'margin-top:6px' }, q.explanation));
  card.append(info);

  if (game.mode === 'boss' && game.boss) {
    const b = game.boss;
    card.append(el('div', { class: 'card pad', style: 'margin-top:12px;flex:none;text-align:center' },
      el('p', { class: 'tiny faint' }, b.name),
      el('h2', { style: 'font-size:1.6rem' }, `${b.hp} HP left`),
      el('div', { style: 'height:12px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:8px' },
        el('i', { style: `display:block;height:100%;width:${Math.max(0, b.hp / b.max * 100)}%;background:linear-gradient(90deg,#F4364C,#FF9A3D)` })),
      el('p', { class: 'tiny muted', style: 'margin-top:10px' }, `Class health ${b.classHp}%`)));
  } else if (game.mode === 'laser') {
    const maxHp = (side) => Math.max(100, 100 * game.players.filter(p => p.team === side).length);
    const box = el('div', { class: 'card pad hpwrap', style: 'margin-top:14px' });
    ['red', 'blue'].forEach(side => {
      const t = game.teams[side];
      box.append(el('div', { class: 'spread', style: 'margin-top:8px' },
        el('span', { class: 'tiny' }, t.name + (side === me.team ? ' (you)' : '')),
        el('span', { class: 'tiny faint' }, Math.max(0, t.hp) + ' HP')));
      box.append(el('div', { class: 'bar' }, el('i', {
        style: `width:${Math.max(0, t.hp / maxHp(side) * 100)}%;background:${side === 'red' ? 'linear-gradient(90deg,#ff4d5e,#ff9b6a)' : 'linear-gradient(90deg,#4f6bff,#22d3ee)'}`
      })));
    });
    box.style.flex = 'none';
    card.append(box);
  } else {
    const rank = game.players.findIndex(p => p.id === me.id) + 1;
    card.append(el('div', { class: 'card pad', style: 'margin-top:12px;flex:none;text-align:center' },
      el('p', { class: 'tiny faint' }, 'Your position'),
      el('h2', { style: 'font-size:2rem' }, '#' + (rank || '–')),
      el('p', { class: 'tiny muted' }, me.score + ' points')));
  }
  card.append(el('p', { class: 'tiny faint', style: 'text-align:center;margin-top:14px' }, 'Look up at the board'));
  return card;
}

function overCard() {
  clearInterval(ticker);
  const rank = game.players.findIndex(p => p.id === me.id) + 1;

  /* Pay for the game, once. The result screen can be drawn again — a reconnect,
     a rotation — and a child should not earn the same game twice, so the payout
     is worked out on the first draw and remembered. */
  if (!paidOut && window.NovaProgress && !(window.NovaLaunch && !NovaLaunch.out())) {
    paidOut = NovaProgress.award({
      answered: tally.answered, right: tally.right,
      bestRun: tally.bestRun, score: me.score || 0, place: rank
    });
  }
  const card = el('div', { class: 'card pad fade-up', style: 'text-align:center;padding:36px 22px' });

  if (game.mode === 'laser') {
    const mine = game.teams[me.team];
    const foe = game.teams[me.team === 'red' ? 'blue' : 'red'];
    const won = mine.hp > foe.hp;
    const draw = mine.hp === foe.hp;
    card.append(el('div', { class: 'mini-face', html: Sprite.icon(draw ? 'handshake' : won ? 'trophy' : 'laser', 64) }),
      el('h1', { style: 'font-size:1.7rem;margin:8px 0 4px' }, draw ? 'Draw!' : won ? 'Your team wins!' : 'Your team fought hard'),
      el('p', { class: 'muted tiny' }, `${mine.name} ${Math.max(0, mine.hp)} HP · ${foe.name} ${Math.max(0, foe.hp)} HP`),
      el('div', { class: 'row', style: 'justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap' },
        el('span', { class: 'chip' }, me.score + ' damage dealt'),
        el('span', { class: 'chip' }, 'Best streak ' + (me.streak || 0))));
    if (won || draw) confetti(120);
  } else if (game.mode === 'boss' && game.boss) {
    const won = game.boss.hp === 0;
    card.append(el('div', { class: 'mini-face', html: Sprite.icon(won ? 'trophy' : 'dragon', 64) }),
      el('h1', { style: 'font-size:1.7rem;margin:8px 0 4px' }, won ? 'The boss is beaten!' : 'The boss survived'),
      el('p', { class: 'muted' }, `You dealt ${me.score} damage`));
    if (won) confetti(120);
  } else {
    const medal = rank <= 3 ? Sprite.icon('medal', 46,
        rank === 1 ? '#E8A400' : rank === 2 ? '#93A0BC' : '#B4713A') : Sprite.icon('flag', 46);
    // el() puts a plain string in as text; a drawn medal has to go in as markup,
    // or the child gets the source code of an SVG at 3.4rem
    card.append(el('div', { class: 'mini-face', style: 'line-height:0', html: medal }),
      el('h1', { style: 'font-size:1.7rem;margin:8px 0 4px' }, rank === 1 ? 'You won!' : `You finished #${rank}`),
      el('p', { class: 'muted' }, game.mode === 'kart' ? `${me.distance || 0}m driven`
        : game.mode === 'tower' ? `${me.blocks || 0} blocks high`
        : game.mode === 'treasure' ? `${me.coins || 0} coins`
        : game.mode === 'snow' ? `${me.hits || 0} blocks knocked off`
        : game.mode === 'balloon' ? `${me.score} points · ${me.balloons || 0} balloon${me.balloons === 1 ? '' : 's'} left`
        : me.score + ' points'));
    if (rank <= 3) confetti(120);
  }

  const lb = el('div', { class: 'card pad', style: 'margin-top:18px;text-align:left' },
    el('h3', { style: 'font-size:1rem;margin-bottom:10px' }, 'Final standings'));
  game.players.slice(0, 5).forEach((p, i) => lb.append(el('div', { class: 'spread', style: 'padding:7px 0' },
    el('span', { class: 'row-name' }, el('span', { class: 'mini-face', html: drawFace(p, 24) }),
       `#${i + 1} ${p.name}${p.id === me.id ? ' (you)' : ''}`),
    el('strong', {}, game.mode === 'kart' ? `${p.distance || 0}m`
      : game.mode === 'tower' ? `${p.blocks || 0} blocks`
      : game.mode === 'treasure' ? `${p.coins || 0} coins`
      : game.mode === 'snow' ? `${p.hits || 0} blocks`
      : String(p.score)))));
  card.append(lb);
  if (paidOut) card.append(payoutCard(paidOut));
  card.append(el('a', { class: 'btn block', style: 'margin-top:18px;justify-content:center', href: 'play.html' }, 'Play another game'));
  return card;
}

/* What the game paid, itemised. A number that just appears is a number nobody
   trusts; showing which part of playing earned what is also the clearest way to
   say "answering is what pays", which is the behaviour we want. */
function payoutCard(paid) {
  const box = el('div', { class: 'payout' }, el('h4', {}, 'Coins earned'));
  const rows = [
    ['Questions answered', paid.parts.answering],
    ['Right answers', paid.parts.correct],
    ['Best run', paid.parts.streak],
    ['Points scored', paid.parts.score],
    ['Finishing', paid.parts.place]
  ];
  rows.forEach(([label, value]) => {
    if (!value) return;
    box.append(el('div', { class: 'line' }, el('span', {}, label), el('b', {}, '+' + value)));
  });
  box.append(el('div', { class: 'line sum' },
    el('span', {}, 'Total'),
    el('b', {}, '+' + paid.parts.total)));

  const lv = NovaProgress.levelFor(NovaProgress.read().lifetime);
  box.append(el('div', { class: 'line' },
    el('span', {}, `Level ${lv.level}`),
    el('b', {}, lv.top ? 'Top level' : `${lv.toNext} to level ${lv.level + 1}`)));
  box.append(el('p', { class: 'tiny faint', style: 'margin-top:8px' },
    `${NovaProgress.read().coins} coins to spend on your monster. Kept on this phone.`));

  const wrap = el('div', {});
  if (paid.levelUp) {
    NovaProgress.markSeen(paid.levelUp);
    wrap.append(el('div', { class: 'levelup' },
      `Level ${paid.levelUp}! New monster parts unlocked.`));
    confetti(90);
  }
  wrap.append(box);
  return wrap;
}

function runTimer() {
  clearInterval(ticker);
  const count = document.getElementById('ptimer');
  const bar = document.getElementById('ptimerbar');
  if (!count || game.state !== 'question' || !game.endsAt) return;
  const total = Math.max(1000, (game.question && game.question.time ? game.question.time * 1000 : 20000));
  const paint = () => {
    const left = Math.max(0, game.endsAt - (Date.now() + drift));
    count.textContent = Math.ceil(left / 1000);
    count.className = 'left' + (left < 5200 ? ' hurry' : '');
    if (bar) {
      bar.style.width = Math.max(0, Math.min(100, left / total * 100)) + '%';
      bar.className = left < 5200 ? 'hurry' : left < 10200 ? 'warn' : '';
    }
    if (left <= 0) clearInterval(ticker);
  };
  paint();
  ticker = setInterval(paint, 200);
}
</script>
