<!DOCTYPE html>
<html lang="en">

<meta name="classification" content="Education">

<meta property="og:type" content="website">
<meta property="og:title" content="Quoldek — classroom quizzes">
<meta property="og:description" content="A teaching tool for classrooms: write or paste a quiz, put it on the board, and the class answers on their own devices.">
<link rel="stylesheet" href="nova.css?v=7831630d">
<style>
.shell{max-width:640px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.hud{display:flex;gap:9px;align-items:center;padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.06);
  border:1px solid var(--line-soft);margin-bottom:12px;position:sticky;top:8px;z-index:20;backdrop-filter:blur(14px)}
.hud .who{display:flex;gap:7px;align-items:center;font-weight:800;font-size:.95rem}
.hud .stat{margin-left:auto;text-align:right;line-height:1}
.hud .stat b{display:block;font-size:1.15rem;line-height:1.1}
.hud .stat span{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:800}



/* the phone is the controller: the buttons get the whole screen */
.play{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
#app{display:flex;flex-direction:column;min-height:100dvh}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:.7rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.qhead .left{font-size:1.5rem;letter-spacing:0;font-weight:900;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1}
.qhead .left.hurry{color:#FF6B5A}

/* The clock is a bar that empties, not a number to squint at: a child can see
 * how long is left without reading anything. */
.timerbar{height:12px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;
  border:1px solid var(--line-soft);margin:6px 0 12px;flex:none}
.timerbar i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,#12BE8E,#7BC62D);transition:width .25s linear}
.timerbar i.warn{background:linear-gradient(90deg,#FFC53D,#FF9A3D)}
.timerbar i.hurry{background:linear-gradient(90deg,#FF4D5E,#FF7A45);animation:throb .6s ease-in-out infinite}
@keyframes throb{50%{opacity:.55}}

/* The question sits on paper, dark type on light, so it is the thing you read
 * first — on the old screen it was small grey text above four huge slabs. */
.qcard{background:#FFFDF7;color:#1B1233;border-radius:20px;padding:18px 16px;text-align:center;
  border:2px solid var(--line);box-shadow:0 8px 0 -2px rgba(0,0,0,.35);flex:none;
  animation:tileIn .3s var(--ease) both}
.qtext{font-size:clamp(1.3rem,6.4vw,2rem);font-weight:900;line-height:1.2;letter-spacing:-.01em}
.qcard .askn{display:block;font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  color:#8478A8;margin-bottom:6px}

/* Tiles sized like buttons, not like wallpaper, and sat at the bottom of the
 * screen where a thumb actually reaches. */
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(84px,132px);
  align-content:end;gap:10px;min-height:0;margin-top:12px;padding-bottom:2px}
.opt-btn{display:flex;align-items:center;justify-content:flex-start;text-align:left;gap:12px;
  padding:14px 16px;border-radius:20px;border:2px solid rgba(0,0,0,.35);
  cursor:pointer;font-weight:900;font-size:clamp(1.15rem,5.2vw,1.7rem);color:#fff;background:var(--c);
  transition:transform .12s var(--ease),filter .2s,opacity .2s;
  box-shadow:0 8px 0 -1px rgba(0,0,0,.4),inset 0 -14px 24px -14px rgba(0,0,0,.45);
  animation:tileIn .3s var(--ease) both;overflow:hidden}
@keyframes tileIn{from{opacity:0;transform:translateY(12px)}}
.opt-btn .shape{width:34px;height:34px;flex:none;fill:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.opt-btn:active{transform:translateY(6px);box-shadow:0 2px 0 -1px rgba(0,0,0,.4)}
.opt-btn:disabled{opacity:.4}
.opt-btn.chosen{border-color:#fff;transform:translateY(3px);box-shadow:0 5px 0 -1px rgba(0,0,0,.4)}
.opt-btn .lbl{line-height:1.15;min-width:0;overflow-wrap:anywhere}
.opts.one{grid-template-columns:1fr}
.opts.one .opt-btn{justify-content:center;text-align:center}
/* a long answer should shrink to fit rather than push the tile out of shape */
.opt-btn .lbl.long{font-size:clamp(.95rem,3.6vw,1.15rem)}

/* The middle of the screen was dead space under the question. It belongs to the
 * game: whatever the mode is, this is where a child sees their own side of it —
 * their kart, their fort, their balloons — while the question is still open. */
.stagebox{flex:1;min-height:0;margin-top:12px;border-radius:20px;position:relative;overflow:hidden;
  border:2px solid var(--line-soft);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.22));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;
  animation:tileIn .35s var(--ease) both}
.stagebox .cap{font-size:.64rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.stagebox .big-num{font-size:2.5rem;font-weight:900;line-height:1;letter-spacing:-.02em}
.stagebox .mini-face svg{width:74px;height:74px}
.stagebox .rowline{display:flex;align-items:center;gap:10px}

/* levels, coins, and parts that have to be earned */
.wallet{display:flex;align-items:center;gap:10px;margin:2px 0 14px;padding:11px 13px;border-radius:16px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.wallet .lvl{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--sun);color:#3a2a00;font-weight:900;font-size:1rem;border:2px solid rgba(0,0,0,.35)}
.wallet .mid{flex:1;min-width:0}
.wallet .cap{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.wallet .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:5px}
.wallet .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFC53D,#FF9A3D);
  transition:width .6s cubic-bezier(.22,1,.36,1)}
.wallet .coins{flex:none;display:flex;align-items:center;gap:5px;font-weight:900;font-size:1rem}
.wallet .coins .c{line-height:0}

.choice.locked,.swatch.locked{position:relative;opacity:.5}
.choice.locked::after,.swatch.locked::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:rgba(6,3,16,.42)}
.price{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);z-index:2;font-size:.6rem;
  font-weight:900;padding:1px 6px;border-radius:99px;background:#161036;color:#FFC53D;white-space:nowrap}
.price.no{color:#FF8A9B}
.choice,.swatch{position:relative}

/* what a game paid, on the results screen */
.payout{margin-top:16px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);text-align:left}
.payout h4{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.65;
  margin-bottom:9px}
.payout .line{display:flex;justify-content:space-between;font-size:.86rem;font-weight:650;padding:3px 0}
.payout .line b{font-weight:900}
.payout .sum{border-top:1px solid rgba(255,255,255,.16);margin-top:7px;padding-top:8px;font-size:1rem}
.levelup{margin-top:12px;padding:13px 15px;border-radius:16px;text-align:center;
  background:linear-gradient(120deg,#FFC53D,#FF9A3D);color:#3a2a00;font-weight:900;
  border:2px solid rgba(0,0,0,.35)}

/* the eight cards, on a phone */
.minihand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:2px 0 4px}
.mcard{width:26px;height:36px;border-radius:5px;border:2px solid rgba(0,0,0,.35);background:#fff;
  display:grid;place-items:center}
.mcard.gap{background:rgba(255,255,255,.1);border-style:dashed;border-color:rgba(255,255,255,.3)}

/* a little track, tower, fort or bar, depending on the game */
/* Fishing: three places to cast, priced in odds rather than in words, because a
   child deciding whether to gamble needs the number and not an adjective. */
.casts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px;width:100%}
.cast{padding:9px 6px;border-radius:13px;font:inherit;color:inherit;cursor:pointer;
  background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);
  transition:transform .13s,border-color .13s,background .13s}
.cast:hover{transform:translateY(-2px)}
.cast b{display:block;font-size:.85rem;font-weight:900}
.cast span{display:block;font-size:.68rem;font-weight:750;opacity:.72;margin-top:2px}
.cast.on{background:rgba(43,168,255,.2);border-color:#2BA8FF;
  box-shadow:0 0 0 3px rgba(43,168,255,.22)}
.minitrack{width:100%;height:22px;border-radius:99px;background:rgba(0,0,0,.32);position:relative;
  border:1px solid var(--line-soft);overflow:hidden}
.minitrack i{position:absolute;top:2px;bottom:2px;left:2px;border-radius:99px;
  background:linear-gradient(90deg,#4F6BFF,#2BA8FF);transition:width .8s var(--ease)}
.minitrack .flag{position:absolute;right:5px;top:3px;bottom:3px;width:4px;border-radius:2px;background:#FFC53D}
.ministack{display:flex;flex-direction:column-reverse;gap:3px;align-items:center}
.ministack i{width:52px;height:13px;border-radius:3px;background:var(--c,#7C4DFF);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);animation:tileIn .3s var(--ease) both}
.minifort{display:flex;flex-direction:column-reverse;gap:3px;align-items:center}
.minifort .row{display:flex;gap:3px}
.minifort i{width:26px;height:14px;border-radius:3px;background:var(--c,#4F6BFF);box-shadow:inset 0 -4px 0 rgba(0,0,0,.24)}
.minifort i.gone{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16)}
.answeredbar{width:100%;height:10px;border-radius:99px;background:rgba(0,0,0,.32);overflow:hidden;border:1px solid var(--line-soft)}
.answeredbar i{display:block;height:100%;background:linear-gradient(90deg,#7C4DFF,#2BA8FF);transition:width .5s var(--ease)}

/* the arena on a phone */
.arena-wrap{gap:8px}
.arena-shell{position:relative;flex:1;min-height:240px;border-radius:20px;overflow:hidden;
  border:2px solid rgba(255,255,255,.12);touch-action:none}
.arena-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;background:#0D0A1C}
.energy{position:absolute;left:10px;right:10px;bottom:10px;height:12px;border-radius:99px;
  background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(255,255,255,.16)}
.energy i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,#12BE8E,#7BC62D);transition:width .12s linear}
.energy i.low{background:linear-gradient(90deg,#FF6B5A,#FFC53D)}

/* ── the superpower you are holding ──
   A chip reading "Rapid fire" tells you what you have and nothing about how
   long you have it for, which is the half that decides whether to charge or
   sit tight. So: the mark of the power, its name, and a bar that runs out. */
.power-slot{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:9px;
  padding:7px 13px 7px 8px;border-radius:99px;background:rgba(8,5,20,.72);
  border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);
  opacity:0;transform:translateY(-6px);transition:.18s ease;pointer-events:none}
.power-slot.on{opacity:1;transform:none}
.power-slot .mark{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center}
.power-slot .mark svg{width:16px;height:16px;display:block}
.power-slot .txt{display:flex;flex-direction:column;gap:3px;min-width:78px}
.power-slot b{font-size:.72rem;font-weight:900;letter-spacing:.04em;color:#fff;line-height:1}
.power-slot .clock{height:4px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.power-slot .clock i{display:block;height:100%;width:100%;border-radius:99px;transition:width .1s linear}

/* and the shout when you pick one up */
.power-shout{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);
  padding:10px 20px;border-radius:99px;font-weight:900;font-size:1rem;letter-spacing:.03em;
  color:#fff;background:rgba(8,5,20,.8);border:2px solid currentColor;
  opacity:0;pointer-events:none;white-space:nowrap}
.power-shout.go{animation:shout 1100ms ease forwards}
@keyframes shout{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  28%{transform:translate(-50%,-50%) scale(1)}
  72%{opacity:1;transform:translate(-50%,-58%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-72%) scale(1)}}
@media (prefers-reduced-motion:reduce){.power-shout.go{animation:none;opacity:1}}

/* ── the weapon in your hand ──
   "Everyone has a different knife" was true in the code and invisible on the
   screen: at the size a blade is drawn out in the ring it is a scratch. So the
   thing you earned is drawn once, big, on a card of its own, with its name
   under it — the blade, the guard, the wrapped grip and the pommel. */
.blade-card{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:16px;
  background:rgba(10,7,24,.66);border:1px solid rgba(255,255,255,.14)}
.blade-card canvas{display:block;width:132px;height:46px;flex:none}
.blade-card .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.blade-card b{font-size:.92rem;font-weight:900;line-height:1.1}
.blade-card span{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint,#8b86a6)}

/* the charge meter: how close the next boost is */
/* Renamed from .charge, which a seven-pixel meter elsewhere on this page
   already owned — it won, and this came out as a sliver with the words
   spilling over the top of it. */
.boostmeter{position:relative;flex:0 0 auto;height:36px;border-radius:99px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  overflow:hidden;display:flex;align-items:center}
.boostmeter i{position:absolute;inset:0;width:0;border-radius:99px;
  background:linear-gradient(90deg,#2BA8FF,#12BE8E);transition:width .25s ease}
.boostmeter i.full{background:linear-gradient(90deg,#FFC53D,#FF9A3D)}
.boostmeter span{position:relative;z-index:1;width:100%;text-align:center;
  font-size:.76rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.opt-btn.right{outline:4px solid #12BE8E}
.opt-btn.wrong{outline:4px solid #F4364C;opacity:.75}

/* the shooting range: an arena to swing a crosshair across, and the controls */
.range{position:relative;flex:1;min-height:230px;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#2C2752,#100C22);
  border:2px solid rgba(255,255,255,.10);cursor:crosshair}
.range::after{content:'';position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:100% 14%,14% 100%}
.foe{position:absolute;transform:translate(-50%,50%);display:flex;flex-direction:column;align-items:center;
  gap:3px;animation:drift 3.4s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-50%,50%) translateX(18px)}}
.foe .hp{display:block;width:46px;height:5px;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden}
.foe .hp i{display:block;height:100%;background:var(--mint)}
.foe .nm{font-size:.7rem;font-weight:800;opacity:.85}
.foe.struck{animation:struck .4s}
@keyframes struck{0%,100%{filter:none}30%{filter:brightness(2.4) saturate(2)}60%{transform:translate(-50%,50%) scale(.92)}}
.cross{position:absolute;width:46px;height:46px;margin:0 0 -23px -23px;pointer-events:none;
  border-radius:50%;border:2px solid rgba(255,197,61,.9);box-shadow:0 0 14px rgba(255,197,61,.5)}
.cross::before,.cross::after{content:'';position:absolute;background:rgba(255,197,61,.9)}
.cross::before{left:50%;top:-8px;bottom:-8px;width:2px;margin-left:-1px}
.cross::after{top:50%;left:-8px;right:-8px;height:2px;margin-top:-1px}
.cross.bang{animation:bang .28s var(--ease)}
@keyframes bang{0%{transform:scale(.7);box-shadow:0 0 0 12px rgba(255,197,61,.35)}100%{transform:none}}
.gamepad{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;justify-items:center;margin-top:12px}
.gamepad .stick{width:126px;height:126px;border-radius:50%;position:relative;touch-action:none;flex:none;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.13),rgba(255,255,255,.04));
  border:2px solid rgba(255,255,255,.16)}
.gamepad .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:linear-gradient(180deg,#8E7BFF,#5B3FE8);box-shadow:0 6px 0 -1px rgba(0,0,0,.4);transition:transform .08s}
.chip.warn{border-color:var(--amber);color:var(--amber)}

/* the result takes over the screen, the way it does on a games console */
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border-radius:26px;padding:30px 20px;text-align:center;animation:swell .34s var(--ease) both}
@keyframes swell{from{opacity:0;transform:scale(.94)}}
.big .mark{font-size:clamp(3.4rem,20vw,5.5rem);line-height:1;animation:pop .45s var(--ease) both}
.big h2{font-size:clamp(1.5rem,7vw,2.2rem);font-weight:900;margin:6px 0 0}
.big .gain{font-size:clamp(1.6rem,8vw,2.4rem);font-weight:900;margin-top:4px}
.big .sub{opacity:.85;font-weight:600}
.big.good{background:linear-gradient(165deg,#12BE8E,#0B8F6B);color:#fff}
.big.bad{background:linear-gradient(165deg,#F4364C,#B31F32);color:#fff}
.big.wait{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.big .lobby-art{line-height:0;border-radius:16px;overflow:hidden;width:min(300px,86%);margin-bottom:6px;
  border:2px solid rgba(255,255,255,.14)}
.big .lobby-art svg{display:block;width:100%;height:auto}
.big .you{line-height:0;animation:bob 2.4s ease-in-out infinite}
.big .you svg{width:clamp(96px,30vw,150px);height:auto}
.mini-face{display:inline-flex;line-height:0;vertical-align:middle}
.row-name{display:flex;align-items:center;gap:8px}
@keyframes bob{50%{transform:translateY(-8px)}}
.big .sub.dim{opacity:.5;font-size:.9rem}
.big.late{background:linear-gradient(165deg,#5A5170,#3A3350);color:#fff}

.verdict{padding:44px 24px;text-align:center;border-radius:var(--r-xl);animation:fadeUp .4s var(--ease) both}
.verdict.good{background:linear-gradient(160deg,rgba(52,224,161,.24),rgba(52,224,161,.05));border:1px solid rgba(52,224,161,.45)}
.verdict.bad{background:linear-gradient(160deg,rgba(255,77,94,.22),rgba(255,77,94,.05));border:1px solid rgba(255,77,94,.4)}
.verdict .em{font-size:3.6rem;display:block;margin-bottom:10px;animation:pop .5s var(--ease) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}

.hpwrap{margin-top:12px}
.hpwrap .bar{height:13px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.hpwrap .bar i{display:block;height:100%;transition:width .6s var(--ease)}
.charge{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.charge i{display:block;height:100%;background:linear-gradient(90deg,#ffc857,#ff5d8f);transition:width .5s}
.balloons{display:flex;gap:8px;justify-content:center;margin:16px 0 6px}
.balloons i{width:30px;height:38px;border-radius:50% 50% 46% 46%;background:var(--c,#F4364C);
  position:relative;animation:sway 2.6s ease-in-out infinite;transform-origin:bottom center;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.14)}
.balloons i::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:12px;
  margin-left:-1px;background:rgba(255,255,255,.3)}
.balloons i.popped::after{display:none}
.balloons i:nth-child(2){animation-delay:-.9s}
.balloons i:nth-child(3){animation-delay:-1.8s}
.balloons i.popped{background:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);animation:none;opacity:.55}
.balloons.hud-strip{margin:0;gap:5px}
.balloons.hud-strip i{width:15px;height:19px}
@keyframes sway{50%{transform:rotate(9deg)}}
.team-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.team-btn{padding:18px;border-radius:var(--r-lg);border:2px solid var(--line);cursor:pointer;text-align:center;font-weight:800;transition:.2s}
.team-btn.red.on{border-color:#ff4d5e;background:rgba(255,77,94,.18)}
.team-btn.blue.on{border-color:#4f6bff;background:rgba(79,107,255,.18)}
.big-timer{font-size:2.6rem;font-weight:900;text-align:center;letter-spacing:-.03em}
.waiting .pulse{width:60px;height:60px;border-radius:50%;background:var(--grad-brand);margin:0 auto 18px;animation:breathe 2s infinite}
@keyframes breathe{50%{transform:scale(1.18);opacity:.75}}

/* choosing a character */
/* The move: the row of choices under the question. It has to read at a glance
 * on a phone held under a desk, so each one is a short verb and one line saying
 * what it costs. A choice whose terms you cannot see is not a choice. */
/* Monster Run: the chase on top, the question underneath, both in view. A
 * child who has to scroll to answer is a child who gets caught. */
.runshell{position:relative;flex:0 0 auto;height:38vh;min-height:190px;max-height:340px;
  border-radius:18px;overflow:hidden;border:2px solid rgba(0,0,0,.5);
  box-shadow:0 14px 34px -18px rgba(0,0,0,.9)}
.runshell canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.runq{margin-top:4px;flex:1 1 auto;display:flex;flex-direction:column;min-height:0;gap:10px}
.runq-text{font-size:1.02rem;font-weight:800;line-height:1.3;margin-bottom:10px;color:#fff}
.runq .opts{flex:0 1 auto}

/* Hold to boost. Big, because it is pressed under a desk while the eyes are on
 * the robot, and it says what it wants rather than showing an icon. */
.boostbtn{margin-top:2px;flex:none;border:0;border-radius:18px;padding:18px 12px;
  font-size:1rem;font-weight:900;letter-spacing:.09em;color:#fff;cursor:pointer;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,#FFB020,#E07000);
  box-shadow:0 7px 0 #9C4E00,0 12px 24px rgba(224,112,0,.38);
  transition:transform .08s ease,filter .08s ease}
.boostbtn:active{transform:translateY(4px) scale(.98);box-shadow:0 3px 0 #9C4E00}
.boostbtn:disabled{background:rgba(255,255,255,.08);box-shadow:none;color:rgba(255,255,255,.45);
  cursor:default;letter-spacing:.06em}

/* The sword pad. Both buttons are as big as a thumb can miss, because a child
 * in a ten-second fight is watching the boss, not their own hands. */
.aimstick{background:radial-gradient(circle at 50% 42%,rgba(255,176,32,.22),rgba(255,176,32,.06) 68%)}
.aimstick .knob{background:linear-gradient(180deg,#FFB020,#E07000)}
.padlabel{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:.6rem;
  font-weight:800;letter-spacing:.14em;opacity:.5;pointer-events:none}

.swordpad{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;flex:none}
.swordpad button{border:0;border-radius:20px;padding:26px 10px;font-size:1.05rem;font-weight:900;
  letter-spacing:.08em;color:#fff;cursor:pointer;touch-action:manipulation;
  transition:transform .08s ease,filter .08s ease;user-select:none;-webkit-user-select:none}
.swordpad button:active{transform:scale(.94);filter:brightness(1.2)}
.swordpad .swing{background:linear-gradient(180deg,#FFB020,#E07000);
  box-shadow:0 8px 0 #9C4E00,0 14px 26px rgba(224,112,0,.4)}
.swordpad .dodge{background:linear-gradient(180deg,#2BA8FF,#1466C8);
  box-shadow:0 8px 0 #0B4184,0 14px 26px rgba(20,102,200,.4)}
.swordpad button:active{box-shadow:0 3px 0 rgba(0,0,0,.4)}
.moves{display:grid;gap:8px;margin:12px 0 4px}
.moves.two{grid-template-columns:1fr 1fr}
.move{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;
  padding:13px 15px;border-radius:14px;cursor:pointer;
  border:2px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);
  color:#fff;transition:transform .16s var(--ease),border-color .16s,background .16s}
.move:active{transform:scale(.97)}
.move b{font-size:.97rem;font-weight:800;letter-spacing:-.01em;color:#fff}
/* .82 rather than .72, and white rather than the page ink: this is read at
   arm's length under a desk, and at .72 on a dark card it was not readable at
   all — the terms of the choice have to be legible or it is not a choice */
.move span{font-size:.76rem;opacity:.82;line-height:1.3;color:#E9ECF5}
.move.on{border-color:#FFC53D;background:rgba(255,197,61,.18);
  box-shadow:0 0 0 4px rgba(255,197,61,.22)}
.move.on b{color:#FFD86B}
.move.on span{opacity:.95}
.move:disabled{opacity:.45;cursor:default}
/* whoever or whatever the move is aimed at */
.aim{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.aim button{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
  font-size:.8rem;font-weight:700;cursor:pointer;border:2px solid transparent;
  background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.aim button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 18%,transparent)}
.aim svg{width:18px;height:18px}
.picker{margin-top:18px}
.picker .preview{display:flex;justify-content:center;line-height:0;margin-bottom:4px}
.picker .preview svg{width:118px;height:118px;transition:transform .25s var(--ease)}
.picker .preview.bump svg{animation:pop .32s var(--ease)}
.picker h2{font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:14px 0 8px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swatch{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);transition:transform .15s var(--ease)}
.swatch:active{transform:scale(.9)}
.swatch.on{border-color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 0 0 3px rgba(255,255,255,.28)}
/* the part being changed, as a row of tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:99px;border:2px solid var(--line-soft);
  background:rgba(255,255,255,.05);color:var(--muted);font-weight:800;font-size:.82rem;cursor:pointer;
  transition:.15s}
.tab.on{background:#fff;color:#1B1233;border-color:#fff}

/* the choices for that part — never called .shape, that is the marker on an
 * answer button and it has collided with a picker before */
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.choices.swatches{grid-template-columns:repeat(6,1fr)}
.choice{aspect-ratio:1;border-radius:14px;border:2px solid var(--line-soft);background:rgba(255,255,255,.05);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:5px;line-height:0;
  transition:transform .15s var(--ease),border-color .15s,background .15s}
.choice:active{transform:scale(.92)}
.choice.on{border-color:#fff;background:rgba(255,255,255,.14)}
.choice svg{width:100%;height:100%}
</style>

<body class="dark">
