<script>
window.QUOLDEK_LOCAL = /^(localhost|127\.|0\.0\.0\.0|\[?::1)/.test(location.hostname);
window.QUOLDEK_JOIN = window.QUOLDEK_LOCAL
  ? location.href.replace(/[^/]*$/, '') + 'play.html?pin='
  : 'https://playquoldek.web.app/?pin=';
window.QUOLDEK_LIVE = window.QUOLDEK_LOCAL ? '' : 'livequoldek.web.app';
window.QUOLDEK_HUB = window.QUOLDEK_LOCAL ? '/quiz' : 'https://quoldek.web.app/quiz';
window.QUOLDEK_HOMEWORK = window.QUOLDEK_LOCAL
  ? location.href.replace(/[^/]*$/, '') + 'take.html?c='
  : 'https://hwquoldek.web.app/';
const { $, api, el, esc, qs, toast, stream, store, confetti, SHAPES, modal } = Nova;

const drawFace = (p, size) => Sprite.face(p && p.avatar, size);
const paintMark = () => { const m = document.getElementById('brand-mark');
                          if (m) m.innerHTML = Sprite.logo(76); };
let pin = qs('pin'), me = null, game = null, drift = 0, ticker = null, picked = null, lastKey = '';
let strike = null, strikeTotal = 0;
let runner = null, runQ = 0, runStarting = false, runCardNode = null;
let answeredIndex = -1;   // the question this device has already sent — sticky until the next one
/* What this phone has done this game, counted here rather than asked for: the
   coins it earns are worked out on the device that earned them. */
let tally = { answered: 0, right: 0, bestRun: 0, counted: -1 };
let paidOut = null;              // the payout, worked out once when the game ends

if (pin) { const saved = store.get('player:' + pin); if (saved) me = saved; }

start();

function start() {
  if (!pin) return askPin();
  if (!me) return askName();
  connect();
}

/* ── entry screens ─────────────────────────────── */
function askPin() {
  $('#app').innerHTML = `
    <div class="card pad fade-up" style="margin-top:9vh;text-align:center">
      <div class="brand-mark" id="brand-mark" style="margin:0 auto 18px;width:76px;height:76px"></div>
      <h1 style="font-size:1.9rem;margin-bottom:6px">Join the game</h1>
      <p class="muted tiny" style="margin-bottom:22px">Ask your teacher for the 6-digit PIN.</p>
      <input class="input" id="pin" inputmode="numeric" maxlength="6" placeholder="000000"
             style="font-size:2rem;text-align:center;letter-spacing:.36em;font-weight:800;padding:16px">
      <button class="btn primary lg block" style="margin-top:16px" id="go">Enter</button>
    </div>`;
  const go = async () => {
    const v = $('#pin').value.replace(/\D/g, '');
    if (v.length !== 6) return toast('A PIN is 6 digits', 'bad');
    const btn = $('#go');
    btn.disabled = true; btn.textContent = 'Checking';
    try {
      // check the code is a real game before asking a child to type their name
      await api('/games/' + v);
    } catch {
      btn.disabled = false; btn.textContent = 'Enter';
      $('#pin').value = ''; $('#pin').focus();
      return toast('No game with that PIN. Check the board.', 'bad');
    }
    pin = v; history.replaceState(null, '', 'play.html?pin=' + pin);
    me = store.get('player:' + pin) || null;
    start();
  };
  paintMark();
  $('#go').onclick = go;
  $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#pin').focus();
}

function askName() {
  /* Building your own blook.
   *
   * Five things to choose: the colour and the silhouette, which are what tell
   * two players apart across a room, then the eyes, the mouth and the markings,
   * which are nobody's business but yours. It all packs into one number, so the
   * whole game still passes a character around as a single value.
   */
  const saved = Number(store.get('avatar'));
  const COUNTS = { colour: Sprite.COLOURS, shape: Sprite.SHAPES, eyes: Sprite.EYES,
                   mouth: Sprite.MOUTHS, pattern: Sprite.PATTERNS };

  /* A blook made only of parts this phone actually owns. Used for the one a
     child is shown before they touch anything and for "surprise me", so neither
     can hand over something that has not been earned. */
  const ownedPart = (key, n) => {
    const open = [];
    for (let i = 0; i < n; i++) {
      const held = window.NovaLaunch && !NovaLaunch.out();
      if (held || !window.NovaProgress || NovaProgress.partState(key, i, COUNTS).owned) open.push(i);
    }
    return open.length ? open[Math.floor(Math.random() * open.length)] : 0;
  };
  const randomOwned = () => ({
    colour: ownedPart('colour', Sprite.COLOURS), shape: ownedPart('shape', Sprite.SHAPES),
    eyes: ownedPart('eyes', Sprite.EYES), mouth: ownedPart('mouth', Sprite.MOUTHS),
    pattern: ownedPart('pattern', Sprite.PATTERNS)
  });

  let part = Number.isFinite(saved) && saved > 0 ? Sprite.partsOf(saved) : randomOwned();
  const chosen = () => Sprite.pack(part);

  const TABS = [
    { key: 'colour',  label: 'Colour',  n: Sprite.COLOURS },
    { key: 'shape',   label: 'Shape',   n: Sprite.SHAPES },
    { key: 'eyes',    label: 'Eyes',    n: Sprite.EYES },
    { key: 'mouth',   label: 'Mouth',   n: Sprite.MOUTHS },
    { key: 'pattern', label: 'Markings', n: Sprite.PATTERNS }
  ];
  let tab = 0;

  $('#app').innerHTML = `
    <div class="card pad fade-up" style="margin-top:4vh">
      <span class="chip">PIN ${esc(pin)}</span>
      <h1 style="font-size:1.7rem;margin:14px 0 4px">What is your name?</h1>
      <p class="muted tiny">Everyone sees this on the big screen.</p>
      <div class="field" style="margin-top:16px">
        <input class="input" id="nm" maxlength="16" placeholder="e.g. Sam" value="${esc(store.get('studentName') || '')}"></div>

      <div class="wallet" id="wallet" hidden></div>

      <div class="picker">
        <div class="preview" id="pv"></div>
        <div class="row" style="justify-content:center;gap:8px;margin:2px 0 12px">
          <button class="btn ghost sm" type="button" id="surprise">Surprise me</button>
        </div>
        <div class="tabs" id="tabs"></div>
        <div class="choices" id="choices"></div>
      </div>

      <button class="btn primary lg block" style="margin-top:18px" id="join">Join the game</button>
      <p class="tiny faint" style="margin-top:10px;text-align:center">Wrong PIN? <a href="play.html" style="text-decoration:underline">Change it</a></p>
    </div>`;

  const pv = $('#pv'), tabsBox = $('#tabs'), choices = $('#choices');
  const all = (sel) => Array.from(document.querySelectorAll(sel));

  /* The level and the purse, drawn from this phone's own progress. Nothing about
     it leaves the device — it is what this browser has earned, and the screen
     says so rather than implying it follows the child around. */
  function paintWallet() {
    const box = $('#wallet');
    if (!box || !window.NovaProgress) return;
    if (window.NovaLaunch && !NovaLaunch.out()) return;   // the update is not open yet
    const state = NovaProgress.read();
    const lv = NovaProgress.levelFor(state.lifetime);
    box.hidden = false;
    box.innerHTML = '';
    box.append(
      el('div', { class: 'lvl' }, String(lv.level)),
      el('div', { class: 'mid' },
        el('div', { class: 'cap' }, lv.top ? 'Top level' : `${lv.toNext} coins to level ${lv.level + 1}`),
        el('div', { class: 'bar' }, el('i', { style: `width:${lv.need ? Math.round(lv.into / lv.need * 100) : 100}%` }))),
      el('div', { class: 'coins' },
        el('span', { class: 'c', html: Sprite.icon('coin', 20, '#FFC53D') }),
        String(state.coins)));
    box.title = 'Kept on this phone. Play to earn coins and unlock more blooks.';
  }

  /* Each swatch shows the blook you would get by changing only that one thing,
   * so a child can see the choice rather than guess at it. */
  const paint = () => {
    pv.innerHTML = Sprite.face(chosen(), 118);
    pv.classList.remove('bump'); void pv.offsetWidth; pv.classList.add('bump');
    all('.tab').forEach((b, i) => b.classList.toggle('on', i === tab));

    const { key, n } = TABS[tab];
    choices.innerHTML = '';
    choices.className = 'choices' + (key === 'colour' ? ' swatches' : '');
    // before the update opens, every blook is simply available, exactly as it
    // was yesterday — nothing is teased and nothing is taken away
    const prog = (window.NovaLaunch && !NovaLaunch.out()) ? null : window.NovaProgress;
    for (let i = 0; i < n; i++) {
      const info = prog ? prog.partState(key, i, COUNTS) : { owned: true };
      const b = el('button', { class: (key === 'colour' ? 'swatch' : 'choice')
                                      + (part[key] === i ? ' on' : '')
                                      + (info.owned ? '' : ' locked'),
                               type: 'button',
                               title: info.owned ? TABS[tab].label + ' ' + (i + 1)
                                    : `${info.tierName} · ${info.cost} coins`
                                      + (info.levelReached ? '' : ` · level ${info.needsLevel}`) });
      if (key === 'colour') b.style.background = Sprite.palette[i];
      else if (key === 'shape') b.innerHTML = Sprite.crest(i, 46, Sprite.palette[part.colour]);
      else b.innerHTML = Sprite.face(Sprite.pack(Object.assign({}, part, { [key]: i })), 52);

      if (!info.owned) {
        // a locked part shows what it costs, or what level opens it — never just
        // a padlock, because "no" without a reason is the most annoying thing a
        // game can say
        b.append(el('span', { class: 'price' + (info.canBuy ? '' : ' no') },
          info.levelReached ? String(info.cost) : 'Lv ' + info.needsLevel));
      }

      b.onclick = () => {
        if (info.owned) { part[key] = i; paint(); return; }
        const bought = prog.buy(key, i, COUNTS);
        if (!bought.ok) return toast(bought.why, 'bad');
        toast(`Unlocked for ${info.cost} coins`, 'good');
        part[key] = i;
        paintWallet();
        paint();
      };
      choices.append(b);
    }
  };

  TABS.forEach((t, i) => {
    const b = el('button', { class: 'tab', type: 'button', onclick: () => { tab = i; paint(); } }, t.label);
    tabsBox.append(b);
  });
  $('#surprise').onclick = () => { part = randomOwned(); paint(); };
  paintWallet();
  paint();

  const join = async () => {
    const name = ($('#nm').value || '').trim();
    if (!name) return toast('Type your name first', 'bad');
    store.set('studentName', name);
    store.set('avatar', String(chosen()));
    if (window.NovaProgress) NovaProgress.remember(chosen());
    try {
      const res = await api(`/games/${pin}/join`, { method: 'POST', body: { name, avatar: chosen() } });
      me = res.player;
      // the game keeps two players from looking alike, so say so rather than
      // quietly handing back a different blook
      if (Number(me.avatar) !== chosen()) toast('Someone had that colour and shape. You got the next shape.');
      store.set('player:' + pin, me);
      connect();
    } catch (err) { toast(err.message, 'bad'); }
  };
  $('#join').onclick = join;
  $('#nm').onkeydown = e => { if (e.key === 'Enter') join(); };
  setTimeout(() => $('#nm').focus(), 80);
}

/* ── realtime ──────────────────────────────────── */
/* Phones drop the network all the time: the screen locks, the tab goes to the
 * back, the wifi hands over to 4G. A failed request means "ask again", never
 * "the game is over" — only the server saying 404 means that. Getting this
 * wrong is what made closing the tab look like it finished the game. */
function gone() {
  store.del('player:' + pin);
  $('#app').innerHTML = `<div class="card pad empty" style="margin-top:14vh"><span class="em">${Sprite.icon('ghost', 44)}</span>
    That game is not running any more.<br><a class="btn sm" style="margin-top:14px" href="play.html">Try another PIN</a></div>`;
}

function waiting() {
  if (game) return;                       // already playing — say nothing, just retry
  $('#app').innerHTML = `<div class="card pad empty" style="margin-top:14vh"><span class="em">${Sprite.icon('ghost', 44)}</span>
    Getting you back into the game…</div>`;
}

let reconnects = 0;
function refresh() {
  /* Asking and drawing are kept apart on purpose. A failed request is a network
     problem and is worth retrying quietly; a failure while drawing is a bug in
     this page, and swallowing it as "bad wifi" means the screen sits there
     frozen with nothing in the console — which is exactly how a missing variable
     once hid for an afternoon. Drawing throws out loud. */
  return api(`/games/${pin}`).then(
    state => { reconnects = 0; return state; },
    err => {
      if (err && err.status === 404) { gone(); return null; }   // it really has ended
      reconnects += 1;
      waiting();
      setTimeout(refresh, Math.min(8000, 600 * reconnects));
      return null;
    }
  ).then(state => { if (state) apply(state); });
}

function connect() {
  refresh();
  stream(`/games/${pin}/events`, (msg) => { if (msg.data && msg.data.pin) apply(msg.data); }, `/games/${pin}`);
  // coming back from another app: don't wait for the next poll, catch up now
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  window.addEventListener('online', refresh);
}

function apply(state) {
  game = state;
  // the robot is chasing the room, so every phone has to know where the room is
  if (runner && state.mode === 'robot') runner.setRoom(roomFromGame());
  drift = state.serverNow - Date.now();
  const mine = state.players.find(p => p.id === me?.id);
  if (mine) me = { ...me, ...mine };
  else if (state.state !== 'lobby') { /* removed */ }
  // our own answer reaches the host a moment before the host scores it: until then
  // the state still says answered:false, and believing it would flash the question back
  if (state.state === 'question' && answeredIndex === state.index && me) me.answered = true;

  // one question is counted once, when its answer comes up
  if (state.state === 'reveal' && mine && tally.counted !== state.index) {
    tally.counted = state.index;
    if (mine.correct !== null && mine.correct !== undefined) {
      tally.answered += 1;
      if (mine.correct) tally.right += 1;
    }
    tally.bestRun = Math.max(tally.bestRun, mine.streak || 0, mine.best || 0);
  }
  document.body.classList.toggle('laser', state.mode === 'laser');
  const key = state.state + ':' + state.index + ':' + (me?.answered ? 'a' : 'w');
  const fresh = key !== lastKey;
  lastKey = key;
  if (fresh) render(true); else patch();
}

/* Between two states nothing structural changes — only numbers do. Updating them in
 * place keeps the cards, their entry animations and the answer buttons alive; rebuilding
 * the screen every poll is what made the game look like it was stuttering. */
function patch() {
  if (!me) return;
  const hudNode = document.querySelector('#app .hud');
  if (hudNode) hudNode.replaceWith(hud());
  const players = document.getElementById('lobby-count');
  if (players) players.textContent = game.players.length + ' player' + (game.players.length === 1 ? '' : 's') + ' waiting';
  const counts = document.querySelectorAll('[data-team-count]');
  counts.forEach(node => {
    const side = node.getAttribute('data-team-count');
    node.textContent = game.players.filter(p => p.team === side).length + ' players';
  });
}

function hud() {
  const node = el('div', { class: 'hud' });
  node.append(el('div', { class: 'who' }, el('span', { class: 'mini-face', html: drawFace(me, 30) }), me.name));
  if (game.mode === 'laser') {
    node.append(el('span', { class: 'chip ' + (me.team === 'red' ? '' : 'live'),
      style: `border-color:${me.team === 'red' ? 'rgba(255,77,94,.5)' : 'rgba(79,107,255,.5)'}` },
      me.team === 'red' ? 'Crimson' : 'Cobalt'));
    node.append(el('div', { class: 'stat' }, el('b', {}, me.down ? 'DOWN' : me.hp + ' HP'), el('span', {}, 'shield')));
  } else {
    const unit = { tower: ['blocks', String(me.blocks || 0)],
                   boss: ['damage', String(me.score)],
                   volcano: ['up the wall', String(me.height || 0)] }[game.mode]
                 || ['points', String(me.score)];
    node.append(el('div', { class: 'stat' }, el('b', {}, unit[1]), el('span', {}, unit[0])));
  }
  if (me.streak >= 2) node.append(el('span', { class: 'chip warn' },
    el('span', { class: 'mini-face', html: Sprite.icon('flame', 14) }), String(me.streak)));
  return node;
}

function render(fresh) {
  if (!me) return;
  const app = $('#app');
  app.innerHTML = '';
  app.append(hud());

  if (game.state === 'lobby') return app.append(lobbyCard());
  if (game.state === 'arena') return app.append(arenaCard());
  if (game.state === 'strike') return app.append(strikeCard());
  /* The run is kept, not rebuilt.
   *
   * Every other screen is thrown away and redrawn when anything changes, which
   * is fine for a screen made of text. This one holds a canvas with a chase
   * running on it: rebuilding it handed the engine a canvas that was no longer
   * in the page, so it carried on drawing where nobody could see, the new
   * canvas stayed black, and the question panel came back empty. The game went
   * blank the first time somebody else joined. */
  if (game.state === 'running') {
    if (!runCardNode) runCardNode = runCard();
    return app.append(runCardNode);
  }
  runCardNode = null;
  if (arena) { arena.stop(); arena = null; }

  /* A block in hand comes before anything else on the screen.
   *
   * It first went in the gap after answering, which meant the reveal card won
   * the moment the teacher moved on and a child was left holding a block they
   * could not place. Nobody should ever be sat on one: if you have earned it,
   * the screen you are looking at is the one you drop it from. */
  const holding = game.mode === 'tower' && (me.ready || 0) > 0
                  && game.state !== 'over' && game.state !== 'lobby';
  if (!holding && dropper) {
    dropper.stop(); dropper = null; dropBusy = false; dropCardNode = null;
  }
  /* Kept, not rebuilt — the same trap the run card fell into. render() runs on
     every poll; building a fresh card each time hands the engine a canvas that
     is no longer in the page, so it carries on drawing where nobody can see it
     and the new canvas stays black. */
  if (holding) {
    if (!dropCardNode) dropCardNode = dropCard();
    return app.append(dropCardNode);
  }
  if (game.state !== 'strike' && strike) { strike.stop(); strike = null; strikeTotal = 0; }
  if (game.state !== 'running' && runner) {
    runner.stop(); runner = null; runStarting = false; runCardNode = null;
  }
  if (game.state === 'over') return app.append(overCard());
  if (game.state === 'reveal') return app.append(revealCard());
  app.append(questionCard(fresh));
  runTimer();   // only reached on a structural change, so the countdown is not restarted
}

function lobbyCard() {
  const card = el('div', { class: 'play' });
  const panel = el('div', { class: 'big wait' });
  panel.innerHTML = `
    <div class="lobby-art">${Sprite.scene(game.mode, 300)}</div>
    <div class="you">${drawFace(me, 120)}</div>
    <h2>You are in</h2>
    <p class="sub">${esc(game.quizTitle)}</p>
    <p class="sub" style="margin-top:14px">${esc((game.modeInfo && game.modeInfo.blurb) || '')}</p>
    <p class="sub dim" id="lobby-count">${game.players.length} player${game.players.length === 1 ? '' : 's'} waiting</p>`;
  card.append(panel);

  // both team games let a child choose a side before the whistle
  if (game.mode === 'laser') {
    const pick = el('div', { class: 'team-pick', style: 'flex:none' });
    ['red', 'blue'].forEach(side => {
      const count = game.players.filter(p => p.team === side).length;
      pick.append(el('div', { class: `team-btn ${side}` + (me.team === side ? ' on' : ''), onclick: async () => {
        if (me.team === side) return;
        try { await api(`/games/${pin}/team`, { method: 'POST', body: { playerId: me.id } }); }
        catch (err) { toast(err.message, 'bad'); }
      } }, (side === 'red' ? 'Crimson' : 'Cobalt'),
         el('div', { class: 'tiny faint', 'data-team-count': side }, count + ' players')));
    });
    card.append(el('p', { class: 'label', style: 'margin-top:14px;flex:none' }, 'Pick your team'), pick);
  }
  return card;
}

/* Laser Tag: one arena, and your own energy bar decides when you answer.
 *
 * Play until the bar empties or somebody tags you, answer a question to get back
 * in with a full bar, and carry on. Ten points for an alien, a hundred for another
 * player. The joystick walks and aims at once; a keyboard uses WASD and the mouse.
 */
let arena = null, arenaQ = 0, arenaAsking = false;

/* Monster Run, on the phone.
 *
 * The chase on top and the question underneath, both on screen at once, so a
 * child never stops running to read. Nobody waits for anybody: this child is on
 * their own question and the class is spread across the whole quiz, which is
 * the point — it is a race, and a race where everybody moves together is a
 * queue.
 */
function runCard() {
  const card = el('div', { class: 'play arena-wrap' });
  card.append(el('div', { class: 'qhead' },
    el('span', { class: 'chip', id: 'r-dist' }, '0 boosts'),
    el('span', { class: 'chip', id: 'r-need' }, '3 right in a row to charge a boost')));
  /* No chase on the phone. It used to run here, fighting the question for a
     screen the size of a hand, while the board showed a progress bar over a
     list of names. The robot belongs on the big screen where the whole class
     can look up at it; the phone is the question, how close the next boost is,
     and the button that spends it. */
  card.append(el('div', { class: 'boostmeter' },
    el('i', { id: 'r-charge' }),
    el('span', { id: 'r-chargetxt' }, '')));
  card.append(el('button', { class: 'boostbtn', id: 'r-boost', type: 'button', disabled: true },
                'ANSWER TO CHARGE'));
  card.append(el('div', { class: 'runq', id: 'runq' }));
  setTimeout(startRun, 0);
  return card;
}

function startRun() {
  /* Set before anything can yield. startRun is queued from render(), and a poll
   * arriving in between could queue a second one before the first had assigned
   * runner — two of these on one phone, both reporting. */
  if (runner || runStarting) return;
  runStarting = true;
  runQ = 0;
  runner = NovaRun.start({
    canvas: null,                        // the chase is on the board, not here
    world: game.map || 'station',
    colour: Sprite.colourFor ? Sprite.colourFor(me.avatar || 0) : '#FFC53D',
    onState: paintRunHud,
    /* Every boost goes into the room's pot. It is sent one at a time, counted,
       so a phone that reconnects and repeats itself cannot shove the whole
       class through the door on its own. */
    onBoost: (seq) => {
      api(`/games/${pin}/boost`, { method: 'POST', body: { playerId: me.id, seq } })
        .then(out => { if (out && out.view) apply(out.view); })
        .catch(() => {});
    }
  });
  runStarting = false;
  runner.setRoom(roomFromGame());
  askRunQuestion();
  wireBoost();
}

/** What the room looks like right now, handed to the chase so every phone draws
 *  the robot in the same place. */
function roomFromGame() {
  return { escape: game.escape || 0, target: game.escapeTarget || 100,
           lives: game.lives === undefined ? 3 : game.lives, round: game.round || 1 };
}

function paintRunHud(st) {
  const n = document.getElementById('r-need');
  if (n) {
    n.textContent = st.charged > 0
      ? (st.charged === 1 ? 'Boost ready — hold it' : st.charged + ' boosts ready')
      : st.need === 1 ? 'One more to charge a boost'
      : `${st.need} right in a row to charge a boost`;
    n.classList.toggle('live', st.charged > 0);
  }
  const b = document.getElementById('r-boost');
  if (b) {
    b.disabled = st.charged <= 0;
    b.textContent = st.charged > 0 ? 'HOLD TO BOOST' : 'ANSWER TO CHARGE';
  }
  const d = document.getElementById('r-dist');
  if (d) d.textContent = st.spent + (st.spent === 1 ? ' boost' : ' boosts');

  /* How close the next boost is, as a bar. Three right answers in a row is the
     only thing on this screen a child is working towards, and "2 right in a row
     to charge a boost" is a sentence, not a feeling. */
  const c = document.getElementById('r-charge');
  if (c) {
    const done = st.charged > 0 ? 1 : (3 - st.need) / 3;
    c.style.width = Math.round(done * 100) + '%';
    c.classList.toggle('full', st.charged > 0);
  }
  const ct = document.getElementById('r-chargetxt');
  if (ct) {
    ct.textContent = st.charged > 0 ? 'Boost charged'
      : (3 - st.need) + ' of 3 towards a boost';
  }
}

/* Hold, not tap. Charging a boost by answering and then spending it with a
 * deliberate press is the only part of this mode that is not reading, and
 * firing it automatically on the third right answer would take that away. */
function wireBoost() {
  const btn = document.getElementById('r-boost');
  if (!btn) return;
  const down = (e) => { e.preventDefault(); if (runner && runner.holdStart() && navigator.vibrate) navigator.vibrate(12); };
  const up = (e) => { e.preventDefault(); if (runner && runner.holdEnd() && navigator.vibrate) navigator.vibrate([20, 40, 20]); };
  btn.addEventListener('touchstart', down, { passive: false });
  btn.addEventListener('touchend', up, { passive: false });
  btn.addEventListener('touchcancel', up, { passive: false });
  btn.addEventListener('mousedown', down);
  btn.addEventListener('mouseup', up);
  btn.addEventListener('mouseleave', up);
}

/* The next question, in the panel under the chase. There is always one waiting:
 * a child who has just answered should be able to answer again immediately,
 * because the monster did not stop while they read. */
function askRunQuestion() {
  const host = document.getElementById('runq');
  if (!host) return;
  const set = (game.quiz && game.quiz.length) ? game.quiz : [];
  if (!set.length) { host.textContent = 'Waiting for the quiz…'; return; }
  const q = set[runQ % set.length];
  const asked = runQ;
  runQ += 1;

  host.innerHTML = '';
  host.append(el('p', { class: 'runq-text' }, q.text || 'Question'));
  const opts = el('div', { class: 'opts' + ((q.choices || []).length <= 2 ? ' one' : '') });
  (q.choices || []).forEach((c, i) => {
    const btn = el('button', { class: `opt-btn a${i % 6}` });
    btn.innerHTML = `${SHAPES[i % 6]}<span class="lbl">${esc(c.text || '')}</span>`;
    btn.onclick = () => {
      if (btn.disabled) return;
      opts.querySelectorAll('button').forEach(b => { b.disabled = true; });
      const right = !!c.correct;
      btn.classList.add(right ? 'right' : 'wrong');
      if (navigator.vibrate) navigator.vibrate(right ? [16, 36, 16] : 70);
      // the question's own number, so a double-tap cannot answer it twice
      if (runner) runner.answered(right, asked);
      setTimeout(askRunQuestion, right ? 340 : 620);
    };
    opts.append(btn);
  });
  host.append(opts);
}

/* Ten seconds with a sword.
 *
 * Two buttons and nothing else. A thumbstick is a menu you operate badly, and
 * ten seconds is not long enough to learn one — so the player is always facing
 * the boss and the only questions are when to swing and when to roll. Both
 * buttons are enormous on purpose: a child is looking at the boss, not at their
 * own hands, and should not have to aim at a control. */
function strikeCard() {
  const card = el('div', { class: 'play arena-wrap' });
  const blade = (NovaStrike.BLADES[me.blade] || NovaStrike.BLADES.stick);
  card.append(el('div', { class: 'qhead' },
    el('span', { class: 'chip', id: 's-dmg' }, '0 damage'),
    el('span', { class: 'chip live', style: `border-color:${blade.colour}` }, blade.label)));

  const shell = el('div', { class: 'arena-shell' });
  shell.append(el('canvas', { class: 'arena-canvas', id: 'strike' }));
  card.append(shell);

  card.append(bladeCard());

  const pad = el('div', { class: 'swordpad' });
  pad.innerHTML = `<button class="dodge" id="dodge">DODGE</button>
                   <button class="swing" id="swing">SWING</button>`;
  card.append(pad);
  setTimeout(startStrike, 0);
  return card;
}

/* Your weapon, drawn by the same code that draws it in your hand out in the
   ring — so the thing on the card and the thing you are swinging are the same
   object, not a picture of one. */
function bladeCard() {
  const tier = me.blade || 'stick';
  const box = el('div', { class: 'blade-card' });
  const canvas = el('canvas', { width: 264, height: 92 });
  const shape = NovaStrike.shapeFor(me.avatar);
  const name = NovaStrike.weaponName(me.avatar, tier);
  const tierName = (NovaStrike.BLADES[tier] || NovaStrike.BLADES.stick).label;
  box.append(canvas, el('span', { class: 'who' },
    el('b', {}, name),
    el('span', {}, tierName + ' · ' + (NovaStrike.BLADES[tier] || {}).damage + ' a hit')));
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 264, 92);
  ctx.save();
  ctx.translate(52, 46);
  ctx.rotate(-0.12);
  NovaStrike.drawWeapon(ctx, 196, shape, tier);
  ctx.restore();
  return box;
}

function startStrike() {
  const canvas = document.getElementById('strike');
  if (!canvas || strike) return;
  const others = (game.players || []).filter(p => p.id !== me.id)
    .map(p => ({ id: p.id, name: p.name, avatar: p.avatar, blade: p.blade || 'stick' }));
  strike = NovaStrike.start({
    canvas, me: { id: me.id, name: me.name, avatar: me.avatar },
    blade: me.blade || 'stick',
    boss: game.boss || null,
    seed: game.strikeSeed || 1,
    send: (event, payload) => Nova.arenaSend && Nova.arenaSend(pin, event, payload),
    onHit: (dealt) => {
      strikeTotal += dealt;
      const n = document.getElementById('s-dmg');
      if (n) n.textContent = strikeTotal + ' damage';
    },
    onDone: (out) => {
      // one report at the end rather than one per swing: a phone on school wifi
      // should not be sending thirty messages in ten seconds
      api(`/games/${pin}/strike`, { method: 'POST',
        body: { playerId: me.id, damage: out.damage, hits: out.hits } }).catch(() => {});
    }
  });
  others.forEach(p => strike.add(p));
  if (Nova.arenaListen) Nova.arenaListen(pin, (e, p) => strike && strike.heard(e, p));
  wireSword();
}

function wireSword() {
  const swing = document.getElementById('swing');
  const dodge = document.getElementById('dodge');
  if (!swing || !dodge) return;
  const hit = (fn) => (e) => { e.preventDefault(); if (strike) fn(); if (navigator.vibrate) navigator.vibrate(12); };
  swing.addEventListener('touchstart', hit(() => strike.swing()), { passive: false });
  swing.addEventListener('mousedown', hit(() => strike.swing()));
  dodge.addEventListener('touchstart', hit(() => strike.dodge()), { passive: false });
  dodge.addEventListener('mousedown', hit(() => strike.dodge()));
  // a keyboard, for anybody on a laptop
  document.addEventListener('keydown', (e) => {
    if (!strike) return;
    if (e.code === 'Space' || e.key === 'j') { e.preventDefault(); strike.swing(); }
    if (e.key === 'k' || e.key === 'Shift') strike.dodge();
  });
}

function arenaCard() {
  const card = el('div', { class: 'play arena-wrap' });
  card.append(el('div', { class: 'qhead' },
    el('span', { class: 'chip', id: 'a-score' }, '0'),
    el('span', { class: 'chip', id: 'a-power' }, 'no power-up'),
    el('span', { class: 'chip', id: 'a-alive' }, 'In play')));

  const shell = el('div', { class: 'arena-shell' });
  const canvas = el('canvas', { class: 'arena-canvas', id: 'arena' });
  const bar = el('div', { class: 'energy' }, el('i', { id: 'a-energy' }));
  /* The superpower slot sits on the arena itself rather than in the row of
     chips above it, because that is where your eyes already are. */
  const slot = el('div', { class: 'power-slot', id: 'a-slot' });
  slot.innerHTML = `<span class="mark" id="a-mark"></span>
    <span class="txt"><b id="a-pname"></b>
      <span class="clock"><i id="a-pclock"></i></span></span>`;
  const shout = el('div', { class: 'power-shout', id: 'a-shout' });
  shell.append(canvas, slot, shout, bar);
  card.append(shell);

  const pad = el('div', { class: 'gamepad' });
  pad.innerHTML = `<div class="stick" id="stick"><span class="knob" id="knob"></span>
      <span class="padlabel">MOVE</span></div>
    <div class="stick aimstick" id="aim"><span class="knob" id="aimknob"></span>
      <span class="padlabel">SHOOT</span></div>`;
  card.append(pad);
  setTimeout(startArena, 0);
  return card;
}

function startArena() {
  const canvas = document.getElementById('arena');
  if (!canvas || arena) return;
  arena = NovaArena.start({
    canvas, me, map: game.map || 'arena',
    send: (event, payload) => Nova.arenaSend && Nova.arenaSend(pin, event, payload),
    onScore: (score) => { const n = document.getElementById('a-score'); if (n) n.textContent = score; },
    onSave: (score) => api(`/games/${pin}/score`, { method: 'POST', body: { playerId: me.id, score } })
                         .catch(() => {}),
    onQuestion: () => askArenaQuestion(),
    onPower: (label, colour) => shoutPower(label, colour)
  });
  if (Nova.arenaListen) Nova.arenaListen(pin, (event, payload) => arena && arena.heard(event, payload));
  wireStick();
  paintArenaHud();
}

/* The small drawing on a superpower's chip. The same six marks the orbs in the
   arena carry, so the thing you ran for and the thing you are holding look like
   the same thing. */
const POWER_MARK = {
  rapid:  '<path d="M4 4l4 4-4 4M10 4l4 4-4 4M16 4l4 4-4 4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  triple: '<g fill="#fff"><circle cx="5" cy="12" r="2.6"/><circle cx="12" cy="12" r="2.6"/><circle cx="19" cy="12" r="2.6"/></g>',
  spread: '<g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 20V6M12 20L5 8M12 20l7-12"/></g>',
  speed:  '<path d="M14 2L5 13h5l-2 9 9-11h-5l2-9z" fill="#fff"/>',
  shield: '<path d="M12 3l8 3.6v5.4c0 4.6-3.4 8.2-8 9.6-4.6-1.4-8-5-8-9.6V6.6z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>',
  mystery:'<path d="M8.6 8.6a3.4 3.4 0 1 1 4.4 3.3c-.9.3-1 .9-1 1.7v.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="18.4" r="1.6" fill="#fff"/>'
};
const POWER_COLOUR = { rapid: '#FFC53D', triple: '#FF7A45', spread: '#E8467C',
                       speed: '#2BA8FF', shield: '#12BE8E', mystery: '#7C4DFF' };

function shoutPower(label, colour) {
  const n = document.getElementById('a-shout');
  if (!n) return;
  n.textContent = label;
  n.style.color = colour || '#FFC53D';
  n.classList.remove('go');
  void n.offsetWidth;                                // restart the animation
  n.classList.add('go');
}

function paintArenaHud() {
  if (!arena) return;
  const bar = document.getElementById('a-energy');
  if (!bar) return;                                  // the screen moved on
  bar.style.width = Math.max(0, arena.energy) + '%';
  bar.classList.toggle('low', arena.energy < 28);

  const power = document.getElementById('a-power');
  if (power) { power.textContent = arena.power || 'no power-up'; power.classList.toggle('live', !!arena.power); }

  /* The slot: the mark, the name, and a bar that empties. A force field has no
     clock — it lasts until something hits it — so its bar stays full. */
  const slot = document.getElementById('a-slot');
  if (slot) {
    const kind = arena.powerKind;
    slot.classList.toggle('on', !!kind);
    if (kind && slot.dataset.kind !== kind) {
      slot.dataset.kind = kind;
      const colour = POWER_COLOUR[kind] || '#FFC53D';
      const mark = document.getElementById('a-mark');
      if (mark) {
        mark.style.background = colour;
        mark.innerHTML = '<svg viewBox="0 0 24 24">' + (POWER_MARK[kind] || '') + '</svg>';
      }
      const name = document.getElementById('a-pname');
      if (name) name.textContent = arena.power;
      const clock = document.getElementById('a-pclock');
      if (clock) clock.style.background = colour;
    }
    if (!kind) slot.dataset.kind = '';
    const clock = document.getElementById('a-pclock');
    if (clock && kind) clock.style.width = Math.round(arena.powerLeft * 100) + '%';
  }

  const alive = document.getElementById('a-alive');
  if (alive) alive.textContent = arena.alive ? 'In play' : 'Out';
  requestAnimationFrame(paintArenaHud);
}

/* Two sticks: left walks, right aims and shoots.
 *
 * One stick that both walked and aimed meant you could never back away from
 * somebody while still shooting at them, which is most of what a shooting game
 * is. Blooket's arena uses two on a phone and so does every twin-stick game
 * since the arcades; the fire button is gone because the right stick is the
 * fire button.
 */
function wireStick() {
  const pads = [
    { stick: document.getElementById('stick'), knob: document.getElementById('knob'),
      send: (x, y) => arena && arena.stick(x, y), release: () => arena && arena.stick(0, 0) },
    { stick: document.getElementById('aim'), knob: document.getElementById('aimknob'),
      send: (x, y) => arena && arena.aim(x, y), release: () => {} }
  ];
  pads.forEach(pad => {
    const { stick, knob } = pad;
    if (!stick || !knob) return;
    let firing = null;
    const grip = (e) => {
      const t = e.touches ? e.touches[0] : e;
      const box = stick.getBoundingClientRect();
      const dx = (t.clientX - (box.left + box.width / 2)) / (box.width / 2);
      const dy = (t.clientY - (box.top + box.height / 2)) / (box.height / 2);
      const len = Math.min(1, Math.hypot(dx, dy));
      const ang = Math.atan2(dy, dx);
      const nx = Math.cos(ang) * len, ny = Math.sin(ang) * len;
      pad.send(nx, ny);
      // holding the aim stick keeps shooting rather than firing once
      if (pad.knob.id === 'aimknob' && len > 0.24 && !firing) {
        firing = setInterval(() => pad.send(nx, ny), 90);
      }
      knob.style.transform = `translate(${nx * 26}px,${ny * 26}px)`;
      e.preventDefault();
    };
    const release = () => {
      clearInterval(firing); firing = null;
      pad.release();
      knob.style.transform = 'none';
    };
    ['touchstart', 'touchmove'].forEach(ev => stick.addEventListener(ev, grip, { passive: false }));
    ['touchend', 'touchcancel'].forEach(ev => stick.addEventListener(ev, release));
    stick.addEventListener('mousedown', (e) => {
      grip(e);
      const move = (m) => grip(m);
      const up = () => { release(); window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
      window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
    });
  });
}

/* Out of energy, or tagged: one question buys the way back in. */
function askArenaQuestion() {
  if (arenaAsking) return;
  arenaAsking = true;
  const set = (game.quiz && game.quiz.length) ? game.quiz : [];
  if (!set.length) { arenaAsking = false; if (arena) arena.revive(); return; }
  const q = set[arenaQ % set.length];
  arenaQ += 1;

  const close = modal(`
    <p class="label" style="margin-bottom:6px">Answer to get back in</p>
    <h2 style="margin-bottom:16px">${esc(q.text || 'Question')}</h2>
    <div class="opts" id="q-opts" style="min-height:180px"></div>`, {
    onMount(box) {
      const wrap = box.querySelector('#q-opts');
      (q.choices || []).forEach((c, i) => {
        const btn = el('button', { class: `opt-btn a${i % 6}`, onclick: () => {
          const right = !!c.correct;
          btn.classList.add(right ? 'right' : 'wrong');
          if (navigator.vibrate) navigator.vibrate(right ? [18, 40, 18] : 80);
          setTimeout(() => {
            if (right) {
              close();
              arenaAsking = false;
              if (arena) arena.revive();
            } else {
              // wrong keeps you out: try the next one
              close();
              arenaAsking = false;
              askArenaQuestion();
            }
          }, right ? 420 : 760);
        } });
        const text = c.text || '';
      btn.innerHTML = `${SHAPES[i % 6]}<span class="lbl${text.length > 16 ? ' long' : ''}">${esc(text)}</span>`;
        wrap.append(btn);
      });
    }
  });
}

/* The move — the thing that turns this from a quiz into a game.
 *
 * One component for all fourteen modes, because the rules describe them: what
 * the moves are, what they say, and whether one needs pointing at somebody. A
 * mode added later gets its picker for nothing, and none of them can drift out
 * of step with what the scorer actually does.
 *
 * It sits under the question and above the answers, chosen while the clock is
 * running, so it costs no class time at all: the seconds a child spends
 * deciding whether to rob Ana or guard their own gold are seconds they were
 * already spending reading the question.
 */
function movePicker() {
  const moves = (game.moves || []);
  if (!moves.length) return el('span', {});
  const here = moves.some(m => m.id === me.move) ? me.move : moves[0].id;
  const box = el('div', {});
  const row = el('div', { class: 'moves' + (moves.length === 2 ? ' two' : '') });
  const aimBox = el('div', {});

  const send = (id, on) => {
    api(`/games/${pin}/move`, { method: 'POST', body: { playerId: me.id, move: id, on: on || '' } })
      .then(out => {
        if (out && out.ok === false) { toast(out.why || 'Cannot do that.', 'bad'); return; }
        if (out && out.view) apply(out.view);
      })
      .catch(err => toast(err.message, 'bad'));
  };

  /* Some moves need pointing at somebody, or at a card. Showing that only once
   * the move is picked keeps the row short — a phone screen has no space for
   * every possible target of every possible move at once. */
  function drawAim(spec) {
    aimBox.innerHTML = '';
    if (!spec || !spec.needs) return;
    const aim = el('div', { class: 'aim' });
    if (spec.needs === 'player') {
      const others = (game.players || []).filter(p => p.id !== me.id);
      if (!others.length) {
        aimBox.append(el('span', { class: 'cap' }, 'Nobody else to aim at yet'));
        return;
      }
      others.forEach(p => {
        const btn = el('button', { type: 'button', class: me.on === p.id ? 'on' : '' },
          el('span', { html: Sprite.face(p.avatar || 0, 18) }), el('span', {}, p.name));
        btn.onclick = () => {
          aim.querySelectorAll('button').forEach(n => n.classList.remove('on'));
          btn.classList.add('on');
          me.on = p.id;
          send(spec.id, p.id);
        };
        aim.append(btn);
      });
    } else if (spec.needs === 'card') {
      const mine = me.cards || [];
      const want = NovaRules.CARD_SET.filter(c => !mine.includes(c));
      (want.length ? want : NovaRules.CARD_SET).forEach(c => {
        const btn = el('button', { type: 'button', class: me.on === c ? 'on' : '' },
          el('span', { html: Sprite.icon(c, 18, 'currentColor') }), el('span', {}, c));
        btn.onclick = () => {
          aim.querySelectorAll('button').forEach(n => n.classList.remove('on'));
          btn.classList.add('on');
          me.on = c;
          send(spec.id, c);
        };
        aim.append(btn);
      });
    }
    aimBox.append(el('span', { class: 'cap' },
      spec.needs === 'player' ? 'At who?' : 'Which card?'), aim);
  }

  moves.forEach(spec => {
    const btn = el('button', { class: 'move' + (spec.id === here ? ' on' : ''), type: 'button' },
      el('b', {}, spec.label), el('span', {}, spec.note));
    btn.onclick = () => {
      row.querySelectorAll('.move').forEach(n => n.classList.remove('on'));
      btn.classList.add('on');
      me.move = spec.id;
      drawAim(spec);
      // a move that needs a target waits for one rather than being sent half-made
      if (!spec.needs) send(spec.id, '');
      else if (me.on) send(spec.id, me.on);
    };
    row.append(btn);
  });

  box.append(el('span', { class: 'cap' }, game.moveAsk || 'How are you playing this one?'),
             row, aimBox);
  const chosen = moves.find(m => m.id === here);
  if (chosen && chosen.needs) drawAim(chosen);
  return box;
}

/* Your own side of whatever game is being played, under the question.
 *
 * The board shows the whole class; this shows only you, because a child looking
 * down at their phone should still be able to tell how they are doing without
 * looking up. Each mode fills it with its own thing. */
function stagePanel() {
  const box = el('div', { class: 'stagebox', id: 'stagebox' });
  const rank = game.players.findIndex(p => p.id === me.id) + 1;
  const answered = game.players.filter(p => p.answered).length;

  if (game.mode === 'tower') {
    /* Your team's floor, and where the gap in it is. The tower itself is on the
       board — this is the bit you need in your hand while you answer: whose
       side you are on, how high they are, and how many blocks you are holding. */
    const T = (NovaTower.TEAM[me.team] || NovaTower.TEAM.red);
    const mine = (game.towers && game.towers[me.team] && game.towers[me.team].blocks) || [];
    const slots = game.towerSlots || 4;
    const floors = Math.floor(mine.length / slots);
    const row = el('div', { class: 'ministack' });
    for (let i = 0; i < slots; i++) {
      row.append(el('i', { style: `--c:${i < mine.length % slots ? T.face : 'rgba(255,255,255,.14)'}` }));
    }
    box.append(el('span', { class: 'cap' }, `${T.name} · floor ${floors + 1}`),
               row,
               el('span', { class: 'big-num' }, String(me.ready || 0)),
               el('span', { class: 'cap' },
                  (me.ready || 0) ? 'blocks in hand' : 'answer to earn a block'));
  } else if (game.mode === 'volcano') {
    const gap = Math.round((me.height || 0) - (game.lava || 0));
    box.append(el('span', { class: 'cap' },
                 me.safe ? (gap > 40 ? 'Well clear of it' : 'The lava is close')
                         : 'The lava has you — climb!'),
      el('div', { class: 'rowline' },
        el('span', { class: 'mini-face', html: Sprite.icon('flame', 40, me.safe ? '#FF7A45' : '#F4364C') }),
        el('span', { class: 'big-num' }, String(Math.round(me.height || 0)))),
      el('div', { class: 'minitrack' },
        el('i', { style: `width:${Math.max(3, Math.min(100, 50 + gap / 2))}%;` +
                         `background:${me.safe ? 'linear-gradient(90deg,#12BE8E,#FFC53D)' : '#F4364C'}` })),
      el('span', { class: 'cap' }, me.safe ? `${gap} above the lava` : `${-gap} under it`));
  } else if (game.mode === 'boss' && game.boss) {
    box.append(el('span', { class: 'cap' }, game.boss.name),
      el('span', { class: 'mini-face', html: Sprite.icon('dragon', 58, '#9B7BFF') }),
      el('div', { class: 'answeredbar' },
         el('i', { style: `width:${Math.max(0, game.boss.hp / game.boss.max * 100)}%;background:linear-gradient(90deg,#F4364C,#FF7A45)` })),
      el('span', { class: 'cap' }, `${game.boss.hp} HP left`));
  } else {
    box.append(el('span', { class: 'mini-face', html: drawFace(me, 74) }),
      el('span', { class: 'big-num' }, rank ? '#' + rank : '—'),
      el('span', { class: 'cap' }, `of ${game.players.length} playing`));
  }

  // what the game is being played for, if it is not simply every question
  const goal = game.goal || { kind: 'questions' };
  if (goal.kind === 'points') {
    box.append(el('span', { class: 'cap', style: 'margin-top:6px' },
      `${Math.max(0, goal.value - (me.score || 0))} points to ${goal.value}`));
  } else if (goal.kind === 'time' && game.startedAt) {
    const left = Math.max(0, game.startedAt + goal.value * 60000 - (Date.now() + drift));
    const m = Math.floor(left / 60000), sec = Math.floor(left % 60000 / 1000);
    box.append(el('span', { class: 'cap', style: 'margin-top:6px' },
      `${m}:${String(sec).padStart(2, '0')} left in the game`));
  }

  // everybody's game shows how much of the class is still thinking
  box.append(el('div', { class: 'answeredbar', style: 'margin-top:6px' },
      el('i', { style: `width:${game.players.length ? answered / game.players.length * 100 : 0}%` })),
    el('span', { class: 'cap' }, `${answered} of ${game.players.length} answered`));
  return box;
}

/* One block, dropped.
 *
 * It slides from one side to the other and you tap. Where it is when you tap is
 * where it lands, and that offset is sent to the game and drawn on the board —
 * so a hurried drop is crooked on the projector for the rest of the lesson, and
 * a square one earns the team a second block.
 *
 * The swing gets faster as the tower grows, because a mechanic that never gets
 * harder has stopped being a mechanic by question six.
 */
function dropCard() {
  const card = el('div', { class: 'play arena-wrap' });
  const team = me.team || 'red';
  const T = (NovaTower.TEAM[team] || NovaTower.TEAM.red);
  card.append(el('div', { class: 'qhead' },
    el('span', { class: 'chip', style: `border-color:${T.face}` }, T.name),
    el('span', { class: 'chip live', id: 'd-left' },
       (me.ready || 0) + ((me.ready || 0) === 1 ? ' block to place' : ' blocks to place'))));

  const shell = el('div', { class: 'arena-shell' });
  shell.append(el('canvas', { class: 'arena-canvas', id: 'drop' }));
  card.append(shell);
  card.append(el('button', { class: 'boostbtn', id: 'd-go', type: 'button' }, 'DROP IT'));
  card.append(el('p', { class: 'tiny faint', style: 'text-align:center;margin-top:2px' },
    'Land it square in the gap and your team gets two'));
  setTimeout(startDrop, 0);
  return card;
}

let dropper = null, dropSeq = 0, dropBusy = false, dropCardNode = null;

function startDrop() {
  const canvas = document.getElementById('drop');
  if (!canvas || dropper) return;
  const mine = (game.towers && game.towers[me.team]) || null;
  const floors = mine ? Math.floor((mine.blocks || []).length / (game.towerSlots || 4)) : 0;
  dropper = NovaTower.placer({ canvas, team: me.team || 'red',
                               speed: 1 + Math.min(1.4, floors * 0.08) });
  const go = document.getElementById('d-go');
  if (!go) return;
  go.onclick = () => {
    if (dropBusy) return;
    const offset = dropper.drop();
    if (offset === null) return;
    dropBusy = true;
    if (navigator.vibrate) navigator.vibrate(Math.abs(offset) < 0.1 ? [20, 40, 20] : 15);
    go.textContent = Math.abs(offset) < 0.1 ? 'SQUARE — TWO BLOCKS' : 'PLACED';
    go.disabled = true;
    dropSeq += 1;
    api(`/games/${pin}/place`, { method: 'POST',
        body: { playerId: me.id, offset, seq: dropSeq } })
      .then(out => { if (out && out.view) apply(out.view); })
      .catch(() => {})
      .then(() => {
        // the engine is torn down and rebuilt for the next block in hand
        setTimeout(() => {
          if (dropper) { dropper.stop(); dropper = null; }
          dropBusy = false; dropCardNode = null;
          render();
        }, 620);
      });
  };
}

function questionCard(fresh) {
  const q = game.question;
  const card = el('div', { class: 'play' });

  if (me.answered) {
    const shape = SHAPES[(picked && (q.choices || []).findIndex(c => c.id === picked)) % 6] || '';
    card.append(el('div', { class: 'big wait' },
      el('div', { class: 'mark', html: shape ? shape.replace('class="shape"', 'class="shape" style="width:74px;height:74px;fill:#fff"') : '⏳' }),
      el('h2', {}, 'Answer sent'),
      el('p', { class: 'sub' }, 'Eyes on the board')));
    return card;
  }

  card.append(el('div', { class: 'qhead' },
    el('span', { class: 'left', id: 'ptimer' }, ''),
    el('span', {}, `Question ${game.index + 1} of ${game.total}`)));
  card.append(el('div', { class: 'timerbar' }, el('i', { id: 'ptimerbar' })));
  card.append(el('div', { class: 'qcard' }, el('h2', { class: 'qtext' }, q.text || 'Question')));
  card.append(stagePanel());
  card.append(movePicker());
  if (game.mode === 'laser' && me.down)
    card.append(el('p', { class: 'tiny', style: 'color:var(--amber)' },
      'You are down. A right answer heals a teammate.'));

  if (q.type === 'short') {
    const input = el('input', { class: 'input', style: 'font-size:1.15rem;padding:16px', placeholder: 'Type your answer' });
    const send = el('button', { class: 'btn primary lg block', style: 'margin-top:12px',
      onclick: () => answer(input.value.trim()) }, 'Send');
    input.onkeydown = e => { if (e.key === 'Enter') answer(input.value.trim()); };
    card.append(input, send);
    setTimeout(() => input.focus(), 80);
  } else {
    const isMulti = q.type === 'multi';
    const chosen = new Set();
    const wrap = el('div', { class: 'opts' + (q.choices.length <= 2 ? ' one' : '') });
    q.choices.forEach((c, i) => {
      const btn = el('button', { class: `opt-btn a${i % 6}`, style: `animation-delay:${i * 50}ms`, onclick: () => {
        if (isMulti) {
          chosen.has(c.id) ? chosen.delete(c.id) : chosen.add(c.id);
          btn.classList.toggle('chosen', chosen.has(c.id));
        } else answer(c.id);
      } });
      const text = c.text || '';
      btn.innerHTML = `${SHAPES[i % 6]}<span class="lbl${text.length > 16 ? ' long' : ''}">${esc(text)}</span>`;
      wrap.append(btn);
    });
    card.append(wrap);
    if (isMulti) card.append(el('button', { class: 'btn primary lg block',
      onclick: () => answer(Array.from(chosen)) }, 'Send my answers'));
  }
  return card;
}

async function answer(value) {
  if (!value || (Array.isArray(value) && !value.length)) return toast('Pick an answer first', 'bad');
  picked = value;
  try {
    const res = await api(`/games/${pin}/answer`, { method: 'POST', body: { playerId: me.id, answer: value } });
    answeredIndex = game.index;
    me.answered = true; me.correct = res.correct; me.score = res.score; me.hp = res.hp; me.streak = res.streak;
    if (navigator.vibrate) navigator.vibrate(res.correct ? [22, 40, 22] : 90);
    render(true);
  } catch (err) { toast(err.message, 'bad'); }
}

function revealCard() {
  const q = game.question;
  const ok = me.correct;
  const card = el('div', { class: 'play' });
  const g = me.lastGain || 0;

  if (me.correct === null || me.correct === undefined) {
    card.append(el('div', { class: 'big late' },
      el('div', { class: 'mark', html: Sprite.icon('clock', 78) }),
      el('h2', {}, 'Too slow'),
      el('p', { class: 'sub' }, 'Be quicker next round')));
  } else {
    const line = game.mode === 'laser' ? (me.down ? 'Teammate healed' : ok ? 'Laser fired' : 'Shield hit')
      : game.mode === 'tower'    ? (ok ? (me.move === 'brace' ? 'Braced — steady again'
                                                             : `+${g} block${g > 1 ? 's' : ''}`)
                                       : 'A block fell')
      : game.mode === 'boss'     ? (ok ? `${g} damage` : 'The boss hit back')
      : game.mode === 'volcano'  ? (ok ? `Climbed ${g}` : 'Slipped back')
      :                            (ok ? `+${g || 0}` : 'No points');
    card.append(el('div', { class: 'big ' + (ok ? 'good' : 'bad') },
      el('div', { class: 'mark', html: Sprite.icon(ok ? (me.streak >= 3 ? 'flame' : 'tick') : 'cross', 86) }),
      el('h2', {}, ok ? (me.streak >= 3 ? 'On fire' : 'Correct') : 'Not this time'),
      el('p', { class: 'gain' }, line),
      me.chest ? el('p', { class: 'sub' }, me.chest) : '',
      me.streak >= 2 ? el('p', { class: 'sub' }, `${me.streak} in a row`) : ''));
  }

  const right = q.type === 'short' ? q.answer : (q.choices || []).filter(c => c.correct).map(c => c.text).join(', ');
  const info = el('div', { class: 'card pad', style: 'margin-top:12px;flex:none' },
    el('p', { class: 'tiny faint' }, 'Answer'),
    el('p', { style: 'font-weight:800;font-size:1.15rem;margin-top:2px' }, right || ''));
  if (q.explanation) info.append(el('p', { class: 'tiny muted', style: 'margin-top:6px' }, q.explanation));
  card.append(info);

  if (game.mode === 'boss' && game.boss) {
    const b = game.boss;
    card.append(el('div', { class: 'card pad', style: 'margin-top:12px;flex:none;text-align:center' },
      el('p', { class: 'tiny faint' }, b.name),
      el('h2', { style: 'font-size:1.6rem' }, `${b.hp} HP left`),
      el('div', { style: 'height:12px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:8px' },
        el('i', { style: `display:block;height:100%;width:${Math.max(0, b.hp / b.max * 100)}%;background:linear-gradient(90deg,#F4364C,#FF9A3D)` })),
      el('p', { class: 'tiny muted', style: 'margin-top:10px' }, `Class health ${b.classHp}%`)));
  } else if (game.mode === 'laser') {
    const maxHp = (side) => Math.max(100, 100 * game.players.filter(p => p.team === side).length);
    const box = el('div', { class: 'card pad hpwrap', style: 'margin-top:14px' });
    ['red', 'blue'].forEach(side => {
      const t = game.teams[side];
      box.append(el('div', { class: 'spread', style: 'margin-top:8px' },
        el('span', { class: 'tiny' }, t.name + (side === me.team ? ' (you)' : '')),
        el('span', { class: 'tiny faint' }, Math.max(0, t.hp) + ' HP')));
      box.append(el('div', { class: 'bar' }, el('i', {
        style: `width:${Math.max(0, t.hp / maxHp(side) * 100)}%;background:${side === 'red' ? 'linear-gradient(90deg,#ff4d5e,#ff9b6a)' : 'linear-gradient(90deg,#4f6bff,#22d3ee)'}`
      })));
    });
    box.style.flex = 'none';
    card.append(box);
  } else {
    const rank = game.players.findIndex(p => p.id === me.id) + 1;
    card.append(el('div', { class: 'card pad', style: 'margin-top:12px;flex:none;text-align:center' },
      el('p', { class: 'tiny faint' }, 'Your position'),
      el('h2', { style: 'font-size:2rem' }, '#' + (rank || '–')),
      el('p', { class: 'tiny muted' }, me.score + ' points')));
  }
  card.append(el('p', { class: 'tiny faint', style: 'text-align:center;margin-top:14px' }, 'Look up at the board'));
  return card;
}

function overCard() {
  clearInterval(ticker);
  const rank = game.players.findIndex(p => p.id === me.id) + 1;

  /* Pay for the game, once. The result screen can be drawn again — a reconnect,
     a rotation — and a child should not earn the same game twice, so the payout
     is worked out on the first draw and remembered. */
  if (!paidOut && window.NovaProgress && !(window.NovaLaunch && !NovaLaunch.out())) {
    paidOut = NovaProgress.award({
      answered: tally.answered, right: tally.right,
      bestRun: tally.bestRun, score: me.score || 0, place: rank
    });
  }
  const card = el('div', { class: 'card pad fade-up', style: 'text-align:center;padding:36px 22px' });

  if (game.mode === 'laser') {
    const mine = game.teams[me.team];
    const foe = game.teams[me.team === 'red' ? 'blue' : 'red'];
    const won = mine.hp > foe.hp;
    const draw = mine.hp === foe.hp;
    card.append(el('div', { class: 'mini-face', html: Sprite.icon(draw ? 'handshake' : won ? 'trophy' : 'laser', 64) }),
      el('h1', { style: 'font-size:1.7rem;margin:8px 0 4px' }, draw ? 'Draw!' : won ? 'Your team wins!' : 'Your team fought hard'),
      el('p', { class: 'muted tiny' }, `${mine.name} ${Math.max(0, mine.hp)} HP · ${foe.name} ${Math.max(0, foe.hp)} HP`),
      el('div', { class: 'row', style: 'justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap' },
        el('span', { class: 'chip' }, me.score + ' damage dealt'),
        el('span', { class: 'chip' }, 'Best streak ' + (me.streak || 0))));
    if (won || draw) confetti(120);
  } else if (game.mode === 'boss' && game.boss) {
    const won = game.boss.hp === 0;
    card.append(el('div', { class: 'mini-face', html: Sprite.icon(won ? 'trophy' : 'dragon', 64) }),
      el('h1', { style: 'font-size:1.7rem;margin:8px 0 4px' }, won ? 'The boss is beaten!' : 'The boss survived'),
      el('p', { class: 'muted' }, `You dealt ${me.score} damage`));
    if (won) confetti(120);
  } else {
    const medal = rank <= 3 ? Sprite.icon('medal', 46,
        rank === 1 ? '#E8A400' : rank === 2 ? '#93A0BC' : '#B4713A') : Sprite.icon('flag', 46);
    // el() puts a plain string in as text; a drawn medal has to go in as markup,
    // or the child gets the source code of an SVG at 3.4rem
    card.append(el('div', { class: 'mini-face', style: 'line-height:0', html: medal }),
      el('h1', { style: 'font-size:1.7rem;margin:8px 0 4px' }, rank === 1 ? 'You won!' : `You finished #${rank}`),
      el('p', { class: 'muted' }, game.mode === 'tower' ? `${me.blocks || 0} blocks high`
        : game.mode === 'volcano' ? `${me.height || 0} up the wall`
        : me.score + ' points'));
    if (rank <= 3) confetti(120);
  }

  const lb = el('div', { class: 'card pad', style: 'margin-top:18px;text-align:left' },
    el('h3', { style: 'font-size:1rem;margin-bottom:10px' }, 'Final standings'));
  game.players.slice(0, 5).forEach((p, i) => lb.append(el('div', { class: 'spread', style: 'padding:7px 0' },
    el('span', { class: 'row-name' }, el('span', { class: 'mini-face', html: drawFace(p, 24) }),
       `#${i + 1} ${p.name}${p.id === me.id ? ' (you)' : ''}`),
    el('strong', {}, game.mode === 'tower' ? `${p.blocks || 0} blocks`
      : game.mode === 'volcano' ? `${p.height || 0}`
      : String(p.score)))));
  card.append(lb);
  if (paidOut) card.append(payoutCard(paidOut));
  card.append(el('a', { class: 'btn block', style: 'margin-top:18px;justify-content:center', href: 'play.html' }, 'Play another game'));
  return card;
}

/* What the game paid, itemised. A number that just appears is a number nobody
   trusts; showing which part of playing earned what is also the clearest way to
   say "answering is what pays", which is the behaviour we want. */
function payoutCard(paid) {
  const box = el('div', { class: 'payout' }, el('h4', {}, 'Coins earned'));
  const rows = [
    ['Questions answered', paid.parts.answering],
    ['Right answers', paid.parts.correct],
    ['Best run', paid.parts.streak],
    ['Points scored', paid.parts.score],
    ['Finishing', paid.parts.place]
  ];
  rows.forEach(([label, value]) => {
    if (!value) return;
    box.append(el('div', { class: 'line' }, el('span', {}, label), el('b', {}, '+' + value)));
  });
  box.append(el('div', { class: 'line sum' },
    el('span', {}, 'Total'),
    el('b', {}, '+' + paid.parts.total)));

  const lv = NovaProgress.levelFor(NovaProgress.read().lifetime);
  box.append(el('div', { class: 'line' },
    el('span', {}, `Level ${lv.level}`),
    el('b', {}, lv.top ? 'Top level' : `${lv.toNext} to level ${lv.level + 1}`)));
  box.append(el('p', { class: 'tiny faint', style: 'margin-top:8px' },
    `${NovaProgress.read().coins} coins to spend on your blook. Kept on this phone.`));

  const wrap = el('div', {});
  if (paid.levelUp) {
    NovaProgress.markSeen(paid.levelUp);
    wrap.append(el('div', { class: 'levelup' },
      `Level ${paid.levelUp}! New blook parts unlocked.`));
    confetti(90);
  }
  wrap.append(box);
  return wrap;
}

function runTimer() {
  clearInterval(ticker);
  const count = document.getElementById('ptimer');
  const bar = document.getElementById('ptimerbar');
  if (!count || game.state !== 'question' || !game.endsAt) return;
  const total = Math.max(1000, (game.question && game.question.time ? game.question.time * 1000 : 20000));
  const paint = () => {
    const left = Math.max(0, game.endsAt - (Date.now() + drift));
    count.textContent = Math.ceil(left / 1000);
    count.className = 'left' + (left < 5200 ? ' hurry' : '');
    if (bar) {
      bar.style.width = Math.max(0, Math.min(100, left / total * 100)) + '%';
      bar.className = left < 5200 ? 'hurry' : left < 10200 ? 'warn' : '';
    }
    if (left <= 0) clearInterval(ticker);
  };
  paint();
  ticker = setInterval(paint, 200);
}
</script>
