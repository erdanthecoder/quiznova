<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quoldek Studio</title>
<link href="fonts.css?v=40a238ef" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg?v=662a6df7">
<link rel="apple-touch-icon" href="logo.svg?v=662a6df7">
<meta name="theme-color" content="#7C4DFF">
<meta name="description" content="Quoldek is a teaching tool for classrooms and families: write or paste a quiz, put it on the board, and everyone answers on their own device. Made for lessons, revision and formative assessment.">
<meta name="application-name" content="Quoldek">
<meta name="apple-mobile-web-app-title" content="Quoldek">
<meta name="category" content="Education">
<meta name="classification" content="Education">
<meta name="subject" content="Education, classroom learning, formative assessment, quizzes">
<meta name="audience" content="Teachers, pupils, schools, families">
<meta name="rating" content="General">
<meta name="distribution" content="global">
<meta property="og:site_name" content="Quoldek">
<meta property="og:type" content="website">
<meta property="og:title" content="Quoldek — classroom quizzes">
<meta property="og:description" content="A teaching tool for classrooms: write or paste a quiz, put it on the board, and the class answers on their own devices.">
<link rel="stylesheet" href="nova.css?v=2e40604c">
<style>
.studio{display:grid;grid-template-columns:250px minmax(0,1fr) 380px;gap:22px;max-width:1560px;margin:0 auto;padding:22px;align-items:start}
.col{position:sticky;top:94px;max-height:calc(100vh - 116px);overflow:auto}

/* ── outline rail ─────────────────────────────── */
.outline{padding:16px}
.outline h4{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;padding:0 4px}
.o-item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer;
  transition:.15s var(--ease);border:2px solid transparent;font-weight:700}
.o-item:hover{background:var(--paper);border-color:var(--line-soft)}
.o-item.on{background:#EFEAFF;border-color:var(--grape)}
body.dark .o-item.on{background:rgba(108,76,241,.28)}
.o-num{width:24px;height:24px;flex:none;border-radius:8px;background:var(--paper);border:2px solid var(--line-soft);
  display:grid;place-items:center;font-size:.72rem;font-weight:900;color:var(--muted)}
.o-item.on .o-num{background:var(--grape);color:#fff;border-color:var(--grape)}
.o-text{font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.o-item.ghost{opacity:.55;font-style:italic}
.o-drag{cursor:grab;color:var(--faint);font-size:.8rem;opacity:0;transition:.15s}
.o-item:hover .o-drag{opacity:1}
.o-item.dragging{opacity:.4}
.o-item.drop-target{border-top:3px solid var(--sky)}

/* ── question cards ───────────────────────────── */
.qcard{position:relative;padding:24px;margin-bottom:18px;border-radius:var(--r-lg);
  background:var(--card);border:var(--line-w) solid var(--line);box-shadow:var(--pop-2);
  transition:.2s var(--ease);scroll-margin-top:110px}
.qcard.focus{box-shadow:var(--shadow-glow);transform:translateY(-2px)}
.qcard.flash{animation:flash 1.1s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 6px rgba(18,190,142,.55),var(--pop-2)}100%{box-shadow:var(--pop-2)}}
.qhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.qnum{width:34px;height:34px;flex:none;border-radius:11px;background:var(--grad-brand);color:#fff;
  display:grid;place-items:center;font-size:.88rem;font-weight:900;margin-top:2px;
  border:2.5px solid var(--line);box-shadow:0 2px 0 var(--line)}
.qtext{font-size:1.1rem;font-weight:700}
.qtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:2px solid var(--line-soft)}
.num-input{width:78px;padding:7px 11px;border-radius:10px;background:var(--paper);border:2px solid var(--line-soft);
  outline:none;font-size:.85rem;font-weight:800;color:var(--text)}
.num-input:focus{border-color:var(--grape)}

.choice{display:flex;gap:11px;align-items:center;padding:8px;border-radius:12px;transition:.15s;border:2px solid transparent}
.choice:hover{background:var(--paper)}
.choice.right{background:#D8FBF0;border-color:#12BE8E}
body.dark .choice.right{background:rgba(18,190,142,.2)}
.choice .mark{width:28px;height:28px;flex:none;border-radius:50%;border:2.5px solid var(--line-soft);
  display:grid;place-items:center;cursor:pointer;transition:.2s var(--bounce);font-size:14px;color:transparent;background:var(--card)}
.choice .mark:hover{border-color:var(--ink-faint)}
.choice.right .mark{border-color:#0B7A5C;background:#12BE8E;color:#fff}
.choice.square .mark{border-radius:9px}
.choice .kill{opacity:0;transition:.15s}
.choice:hover .kill{opacity:1}
.add-choice{display:flex;gap:11px;align-items:center;padding:8px;color:var(--faint);cursor:pointer;
  font-size:.9rem;border-radius:12px;font-weight:700}
.add-choice:hover{color:var(--text);background:var(--paper)}

/* ── AI panel ─────────────────────────────────── */
aside.ai{display:flex;flex-direction:column;height:calc(100vh - 116px);overflow:hidden;padding:0}
.ai-head{padding:16px 18px;border-bottom:2.5px solid var(--line);display:flex;gap:12px;align-items:center;
  background:var(--grad-brand);color:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0}
.ai-head .icon-btn{color:rgba(255,255,255,.85)}
.ai-head .faint,.ai-head .tiny{color:rgba(255,255,255,.88) !important}
.ai-head strong{color:#fff}
.ai-head .icon-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.ai-orb{width:40px;height:40px;border-radius:13px;background:#fff;color:var(--grape);display:grid;place-items:center;
  font-size:19px;border:2.5px solid var(--line);box-shadow:0 2px 0 var(--line);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07) rotate(-4deg)}}
.ai-log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.bubble{display:block;flex:none;padding:12px 15px;border-radius:16px;font-size:.9rem;line-height:1.5;max-width:94%;
  font-weight:600;animation:fadeUp .3s var(--bounce) both;border:2.5px solid var(--line)}
.bubble.me{align-self:flex-end;background:var(--grape);color:#fff;border-bottom-right-radius:5px}
.bubble.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.bubble.sys{align-self:center;font-size:.78rem;color:var(--faint);background:transparent;border:none;padding:2px;font-weight:700}
.ops{margin-top:10px;border:2.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.op{display:flex;gap:9px;padding:9px 12px;font-size:.83rem;border-bottom:2px solid var(--line-soft);align-items:flex-start}
.op:last-child{border-bottom:none}
.op-tag{font-size:.64rem;font-weight:900;letter-spacing:.06em;padding:3px 8px;border-radius:7px;flex:none;margin-top:1px;
  border:2px solid var(--line)}
.op-add .op-tag{background:#D8FBF0;color:#065F46}
.op-del .op-tag{background:#FFE1E6;color:#8B1020}
.op-edit .op-tag{background:#FFF0CC;color:#7A4F00}
.op-meta .op-tag{background:#E4EBFF;color:#1E3A8A}
.op-body{color:var(--muted);line-height:1.4;font-weight:600}
.ai-foot{padding:14px 16px;border-top:2.5px solid var(--line);background:var(--card);border-radius:0 0 var(--r-lg) var(--r-lg)}
.prompts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.prompt-chip{padding:6px 12px;border-radius:999px;background:var(--paper);border:2px solid var(--line-soft);
  font-size:.77rem;cursor:pointer;transition:.15s var(--ease);color:var(--muted);font-weight:700}
.prompt-chip:hover{background:#EFEAFF;color:var(--grape);border-color:var(--grape);transform:translateY(-1px)}
/* what the co-pilot already knows, offered rather than guessed at */
.knows{margin-bottom:10px;border-top:1px solid var(--line-soft);padding-top:9px}
.knows summary{font-size:.75rem;font-weight:800;color:var(--faint);cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:6px}
.knows summary::-webkit-details-marker{display:none}
.knows summary::before{content:'▸';font-size:.7rem}
.knows[open] summary::before{content:'▾'}
.knows .subj{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin:10px 0 5px}
.knows .row{display:flex;gap:5px;flex-wrap:wrap}
.knows .years{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 2px;align-items:center}
.knows .years b{font-size:.72rem;font-weight:800;color:var(--faint)}
.knows .yr{padding:4px 10px;border-radius:99px;border:2px solid var(--line-soft);background:var(--paper);
  font-size:.72rem;font-weight:800;cursor:pointer;color:var(--muted)}
.knows .yr.on{background:var(--grape);border-color:var(--grape);color:#fff}
.ai-input{display:flex;gap:8px;align-items:flex-end}
.ai-input textarea{flex:1;resize:none;max-height:120px;min-height:46px;padding:12px 14px;border-radius:14px;
  background:var(--paper);border:2.5px solid var(--line-soft);outline:none;font-size:.9rem;font-weight:600;color:var(--text)}
.ai-input textarea:focus{border-color:var(--grape);box-shadow:0 0 0 3px rgba(108,76,241,.18)}
.perm{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:.75rem;color:var(--faint);font-weight:800}
.perm .seg{flex:1}
.perm .seg button{padding:6px 8px;font-size:.77rem;white-space:nowrap;flex:1}
.thinking{display:flex;gap:5px;padding:10px 4px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--grape);animation:bounce 1.1s infinite}
.thinking i:nth-child(2){animation-delay:.16s}.thinking i:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-7px);opacity:1}}

/* ── presence ─────────────────────────────────── */
.faces{display:flex}
.face{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:900;
  border:2.5px solid var(--line);margin-left:-9px;color:#fff}
.face:first-child{margin-left:0}

/* ── responses ────────────────────────────────── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat{padding:20px;border-radius:var(--r-lg);background:var(--card);border:var(--line-w) solid var(--line);box-shadow:var(--pop-1)}
.stat b{display:block;font-size:2.1rem;font-weight:900;letter-spacing:-.04em}
.stat span{font-size:.74rem;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-weight:900}
.bar{height:12px;border-radius:999px;background:var(--paper);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--grad-mint);transition:width .6s var(--ease)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  padding:10px 12px;border-bottom:2.5px solid var(--line);font-weight:900}
td{padding:12px;border-bottom:2px solid var(--line-soft);font-weight:600}
tr:hover td{background:var(--paper)}

@media (max-width:1200px){
  .studio{grid-template-columns:minmax(0,1fr);padding:16px}
  .col{position:static;max-height:none}
  aside.ai{height:auto;max-height:640px}
  #rail{order:3}
}

/* live game picker */
.modegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
/* how the game ends: smaller cards than the games, because it is a smaller choice */
.endgrid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.endcard{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 15px;border-radius:var(--r-lg);
  border:var(--line-w) solid var(--line);background:var(--card);cursor:pointer;box-shadow:var(--pop-1);
  transition:transform .14s var(--ease),box-shadow .14s}
.endcard:hover{transform:translateY(-2px);box-shadow:var(--pop-2)}
.endcard:active{transform:translateY(1px)}
.endcard .endmark{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:var(--grad-brand);color:#fff;border:var(--line-w) solid var(--line)}
.endcard .body{display:flex;flex-direction:column;gap:1px;min-width:0}
.endcard strong{font-size:1rem}
.endcard .sub{font-size:.76rem;color:var(--faint);font-weight:600}
.setup{display:block}
.setup .sect{margin-bottom:16px}
.setup .sect > h4{font-size:.68rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin-bottom:9px}
.endcard.on{border-color:#6C4CF1;box-shadow:0 0 0 3px rgba(108,76,241,.22)}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{font:inherit;font-weight:700;font-size:.85rem;padding:9px 14px;border-radius:99px;cursor:pointer;
  border:var(--line-w) solid var(--line);background:var(--card);color:inherit;transition:.13s}
.seg button:hover{transform:translateY(-1px)}
.seg button.on{background:#6C4CF1;color:#fff;border-color:#6C4CF1}
.switches{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:9px}
.musicrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:var(--r-lg);
  border:var(--line-w) dashed var(--line);cursor:pointer}
.musicrow input{width:20px;height:20px;flex:none;accent-color:#6C4CF1}
.musicrow span{display:flex;flex-direction:column}
.musicrow .sub{font-size:.76rem;color:var(--faint);font-weight:600}
.modecard{display:flex;flex-direction:column;padding:0;overflow:hidden;cursor:pointer;
  border-radius:20px;border:var(--line-w) solid var(--line);background:var(--card);color:var(--ink);
  text-align:left;font:inherit;box-shadow:var(--pop-1);transition:transform .16s var(--ease),box-shadow .16s}
.modecard:hover{transform:translate(-3px,-3px);box-shadow:var(--pop-2)}
.modecard:active{transform:translate(1px,1px);box-shadow:var(--pop-1)}
.modecard .art{display:block;line-height:0;border-bottom:var(--line-w) solid var(--line)}
.modecard .art svg{width:100%;height:auto;display:block}
.modecard .body{display:block;padding:13px 15px 16px}
.modecard strong{display:block;font-size:1.06rem;margin-bottom:2px}
.modecard .sub{font-size:.83rem;color:var(--ink-soft);line-height:1.34}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="icon-btn" href="index.html" title="All quizzes">←</a>
    <div class="brand-mark hide-sm" id="brand-mark"></div>
    <input id="title" class="line-input" style="max-width:340px;font-weight:700;font-size:1.02rem" placeholder="Untitled quiz">
    <span id="save" class="chip">saved</span>
    <div class="grow"></div>
    <div class="faces" id="faces"></div>
    <div class="seg hide-sm" id="tabs">
      <button data-tab="build" class="on">Build</button>
      <button data-tab="responses">Responses</button>
      <button data-tab="settings">Settings</button>
    </div>
    <button class="btn sm" id="share"><span class="mini-face" data-icon="link" data-size="15"></span> Share</button>
    <button class="btn sm primary" id="present">▶ Play live</button>
  </div>
</header>

<main class="studio">
  <!-- outline -->
  <aside class="col panel outline" id="rail">
    <h4>Questions</h4>
    <div id="outline"></div>
    <button class="btn sm block" style="margin-top:12px" id="add-bottom">＋ Add question</button>
    <div class="divider"></div>
    <div class="tiny faint" style="padding:0 4px;line-height:1.6">
      Drag to reorder. Everything you type saves automatically and streams to anyone else with this quiz open.
    </div>
  </aside>

  <!-- main column -->
  <section>
    <div id="pane-build">
      <div class="card pad" style="margin-bottom:18px">
        <input id="desc" class="line-input" placeholder="Add a description for whoever is playing…">
      </div>
      <div id="questions"></div>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:6px">
        <button class="btn" data-add="mc">＋ Multiple choice</button>
        <button class="btn" data-add="tf">＋ True / False</button>
        <button class="btn" data-add="multi">＋ Multi-select</button>
        <button class="btn" data-add="short">＋ Short answer</button>
      </div>
    </div>

    <div id="pane-responses" class="hide"></div>

    <div id="pane-settings" class="hide">
      <div class="card pad">
        <h3 style="margin-bottom:18px">Quiz settings</h3>
        <div id="settings-list" class="stack" style="gap:2px"></div>
        <div class="divider"></div>
        <div class="row" style="gap:12px;flex-wrap:wrap">
          <div class="field" style="width:150px"><label class="label">Default seconds</label>
            <input class="input" type="number" id="s-time" min="5" max="180"></div>
          <div class="field" style="width:150px"><label class="label">Default points</label>
            <input class="input" type="number" id="s-points" min="10" max="2000" step="10"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- AI co-pilot -->
  <aside class="col panel ai">
    <div class="ai-head">
      <div class="ai-orb" data-icon="spark"></div>
      <div class="grow">
        <strong style="display:block;font-size:.98rem">Quiz co-pilot</strong>
        <span class="tiny faint" id="ai-mode">checking…</span>
      </div>
      <button class="icon-btn" id="ai-clear" title="Clear chat">⟳</button>
    </div>
    <div class="ai-log" id="ai-log"></div>
    <div class="ai-foot">
      <div class="perm">
        <span>Permission</span>
        <div class="seg" id="perm" style="border-radius:11px">
          <button data-p="ask" class="on">Ask me</button>
          <button data-p="auto">Auto-edit</button>
          <button data-p="read">Read-only</button>
        </div>
      </div>
      <div class="prompts" id="prompts"></div>
      <details class="knows" id="knows">
        <summary>What it can write questions about</summary>
        <div id="knows-body"><p class="tiny faint">Loading…</p></div>
      </details>
      <div class="ai-input">
        <textarea id="ai-text" rows="1" placeholder="Add 5 harder questions about fractions…"></textarea>
        <button class="btn primary" id="ai-send" style="height:44px;width:46px;padding:0" data-icon="send" data-size="18"></button>
      </div>
    </div>
  </aside>
</main>

<script src="sprites.js?v=756a85b1"></script>
<script src="launch.js?v=ac877a6b"></script>

<script src="nova.js?v=30a2cc36"></script>

<script src="realtime.js?v=75e1623c"></script>
<script src="arena.js?v=fb3b6182"></script>
<script src="paste.js?v=3032c005"></script>
<script src="rules.js?v=69bf1ad8"></script>
<script src="live.js?v=b7190675"></script>

<script src="account.js?v=00c10e3c"></script>
<script src="qr.js?v=b8307384"></script>
<script>
window.QUOLDEK_LOCAL = /^(localhost|127\.|0\.0\.0\.0|\[?::1)/.test(location.hostname);
window.QUOLDEK_JOIN = window.QUOLDEK_LOCAL
  ? location.href.replace(/[^/]*$/, '') + 'play.html?pin='
  : 'https://playquoldek.web.app/?pin=';
window.QUOLDEK_LIVE = window.QUOLDEK_LOCAL ? '' : 'livequoldek.web.app';
window.QUOLDEK_HOMEWORK = window.QUOLDEK_LOCAL
  ? location.href.replace(/[^/]*$/, '') + 'take.html?c='
  : 'https://hwquoldek.web.app/';
const { $, $$, api, el, esc, qs, toast, modal, stream, store, copy, classroomUrl, clientId } = Nova;

/* Interface icons are drawn, not typed: emoji change shape on every device. */
function paintIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(node => {
    if (node.firstElementChild) return;
    node.innerHTML = Sprite.icon(node.dataset.icon, Number(node.dataset.size) || 26);
  });
  const mark = root.querySelector ? root.querySelector('#brand-mark') : null;
  if (mark && !mark.firstElementChild) mark.innerHTML = Sprite.logo(42);
}
document.addEventListener('DOMContentLoaded', () => paintIcons());
paintIcons();

const quizId = qs('id');
if (!quizId) location.href = 'index.html';

let quiz = null;
let focused = null;          // question id being edited
let saveTimer = null;
let pendingOps = null;
let permission = store.get('permission', 'ask');
let myName = store.get('name') || '';
const myColour = ['#7c5cff','#22d3ee','#34e0a1','#ffc857','#ff5d8f'][Math.abs(clientId.charCodeAt(0) + clientId.charCodeAt(1)) % 5];

/* ── loading & saving ─────────────────────────── */
async function boot() {
  quiz = await api('/quizzes/' + quizId);
  $('#title').value = quiz.title;
  $('#desc').value = quiz.description || '';
  renderAll();
  listen();
  heartbeat();
  aiStatus();
  greet();
}

function markSaving() { const s = $('#save'); s.textContent = 'saving…'; s.className = 'chip'; }
function markSaved() { const s = $('#save'); s.textContent = 'saved'; s.className = 'chip live'; }

function save(immediate = false) {
  markSaving();
  clearTimeout(saveTimer);
  const run = async () => {
    try {
      const body = { clientId, title: quiz.title, description: quiz.description,
                     questions: quiz.questions, settings: quiz.settings };
      const fresh = await api('/quizzes/' + quizId, { method: 'PATCH', body });
      quiz.version = fresh.version;
      markSaved();
    } catch (err) { toast('Save failed: ' + err.message, 'bad'); }
  };
  if (immediate) run(); else saveTimer = setTimeout(run, 450);
}

/* ── realtime ─────────────────────────────────── */
function listen() {
  stream(`/quizzes/${quizId}/events`, (msg) => {
    if (msg.event === 'quiz:updated' && msg.data.by !== clientId) {
      const anchor = rememberFocus();
      quiz = msg.data.quiz;
      $('#title').value = quiz.title;
      $('#desc').value = quiz.description || '';
      renderAll();
      restoreFocus(anchor);
      if (msg.data.by === 'ai') {
        (msg.data.log || []).forEach(line => addBubble('sys', line));
      } else {
        toast('Updated by a collaborator');
      }
    }
    if (msg.event === 'presence') renderFaces(msg.data.people);
    if (msg.event === 'response:new' && currentTab === 'responses') loadResponses();
    if (msg.event === 'quiz:deleted') { toast('This quiz was deleted', 'bad'); setTimeout(() => location.href = 'index.html', 1200); }
  }, `/quizzes/${quizId}`);
}

function rememberFocus() {
  const node = document.activeElement;
  if (!node || !node.dataset || !node.dataset.path) return null;
  return { path: node.dataset.path, start: node.selectionStart, end: node.selectionEnd };
}
function restoreFocus(anchor) {
  if (!anchor) return;
  const node = document.querySelector(`[data-path="${CSS.escape(anchor.path)}"]`);
  if (!node) return;
  node.focus();
  try { node.setSelectionRange(anchor.start, anchor.end); } catch { /* not a text field */ }
}

async function heartbeat() {
  if (!myName) myName = 'Teacher';
  const beat = () => api('/quizzes/' + quizId + '/presence', {
    method: 'POST', body: { clientId, name: myName, colour: myColour }
  }).then(r => renderFaces(r.people)).catch(() => {});
  beat();
  setInterval(beat, 5000);
}

function renderFaces(people) {
  const host = $('#faces');
  host.innerHTML = '';
  people.slice(0, 5).forEach(p => {
    const f = el('div', { class: 'face', title: p.name, style: `background:${p.colour}` },
                 (p.name || '?').slice(0, 1).toUpperCase());
    if (p.clientId === clientId) f.style.outline = '2px solid rgba(255,255,255,.35)';
    host.append(f);

}

/* ── rendering the builder ────────────────────── */
const TYPE_LABEL = { mc: 'Multiple choice', tf: 'True / False', multi: 'Multi-select', short: 'Short answer' };

function renderAll() { renderOutline(); renderQuestions(); renderSettings(); }

function renderOutline() {
  const host = $('#outline');
  host.innerHTML = '';
  if (!quiz.questions.length) host.append(el('div', { class: 'tiny faint', style: 'padding:8px 4px' }, 'No questions yet.'));
  quiz.questions.forEach((q, i) => {
    const item = el('div', {
      class: 'o-item' + (q.id === focused ? ' on' : ''), draggable: 'true', 'data-id': q.id,
      onclick: () => { focused = q.id; renderAll(); document.getElementById('q-' + q.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });
    item.append(el('span', { class: 'o-drag' }, '⠿'),
                el('span', { class: 'o-num' }, i + 1),
                el('span', { class: 'o-text' + (q.text ? '' : ' ghost') }, q.text || 'Untitled question'));
    item.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', q.id); item.classList.add('dragging'); });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    item.addEventListener('dragover', (e) => { e.preventDefault(); item.classList.add('drop-target'); });
    item.addEventListener('dragleave', () => item.classList.remove('drop-target'));
    item.addEventListener('drop', (e) => {
      e.preventDefault(); item.classList.remove('drop-target');
      const dragged = e.dataTransfer.getData('text/plain');
      if (!dragged || dragged === q.id) return;
      const from = quiz.questions.findIndex(x => x.id === dragged);
      const to = quiz.questions.findIndex(x => x.id === q.id);
      const [moved] = quiz.questions.splice(from, 1);
      quiz.questions.splice(to, 0, moved);
      renderAll(); save();
    });
    host.append(item);
  });
}

function renderQuestions() {
  const host = $('#questions');
  host.innerHTML = '';
  if (!quiz.questions.length) {
    host.append(el('div', { class: 'card pad empty' },
      el('span', { class: 'em', html: Sprite.icon('bricks', 40) }),
      el('div', {}, 'No questions yet. Add one below, or ask the co-pilot to write the quiz.')));
    return;
  }
  quiz.questions.forEach((q, i) => host.append(questionCard(q, i)));
}

function questionCard(q, i) {
  const card = el('div', { class: 'qcard' + (q.id === focused ? ' focus' : ''), id: 'q-' + q.id,
                           onmousedown: () => { if (focused !== q.id) { focused = q.id; renderOutline(); $$('.qcard').forEach(c => c.classList.remove('focus')); card.classList.add('focus'); } } });

  const text = el('textarea', {
    class: 'line-input qtext', rows: 1, 'data-path': `${q.id}:text`,
    placeholder: 'Question ' + (i + 1), oninput: (e) => {
      q.text = e.target.value; autosize(e.target); renderOutline(); save();
    }
  });
  text.value = q.text || '';

  const typeSel = el('select', { class: 'select', style: 'width:172px;flex:none',
    onchange: (e) => { changeType(q, e.target.value); renderAll(); save(); } });
  Object.entries(TYPE_LABEL).forEach(([v, label]) =>
    typeSel.append(el('option', { value: v, ...(q.type === v ? { selected: 'selected' } : {}) }, label)));

  card.append(el('div', { class: 'qhead' },
    el('span', { class: 'qnum' }, i + 1),
    el('div', { class: 'grow' }, text),
    typeSel));

  setTimeout(() => autosize(text), 0);

  /* answers */
  const body = el('div', { class: 'stack', style: 'gap:2px' });
  if (q.type === 'short') {
    const ans = el('input', { class: 'input', 'data-path': `${q.id}:answer`,
      placeholder: 'Accepted answer(s), separated by | e.g. 12 | twelve',
      oninput: (e) => { q.answer = e.target.value; save(); } });
    ans.value = q.answer || '';
    body.append(el('div', { class: 'field' }, el('label', { class: 'label' }, 'Correct answer'), ans));
  } else {
    q.choices.forEach((c, ci) => {
      const row = el('div', { class: 'choice' + (c.correct ? ' right' : '') + (q.type === 'multi' ? ' square' : '') });
      row.append(el('button', {
        class: 'mark', title: 'Mark correct', html: Sprite.icon('tick', 15),
        onclick: () => {
          if (q.type === 'multi') c.correct = !c.correct;
          else q.choices.forEach(x => x.correct = (x === c));
          renderQuestions(); save();
        }
      }));
      const inp = el('input', {
        class: 'line-input grow', 'data-path': `${q.id}:c${c.id}`,
        placeholder: 'Option ' + (ci + 1), readonly: q.type === 'tf' ? 'readonly' : null,
        oninput: (e) => { c.text = e.target.value; save(); }
      });
      inp.value = c.text || '';
      row.append(inp);
      if (q.type !== 'tf') row.append(el('button', {
        class: 'icon-btn kill', title: 'Remove option', html: Sprite.icon('cross', 15),
        onclick: () => { q.choices = q.choices.filter(x => x !== c); renderQuestions(); save(); }
      }));
      body.append(row);
    });
    if (q.type !== 'tf' && q.choices.length < 6) {
      body.append(el('div', { class: 'add-choice', onclick: () => {
        q.choices.push({ id: Math.random().toString(36).slice(2, 8), text: '', correct: false });
        renderQuestions(); save();
      } }, el('span', { class: 'mark', style: 'width:26px;height:26px;border:2px dashed var(--line-strong);border-radius:50%' }), 'Add option'));
    }
  }
  card.append(body);

  const why = el('input', { class: 'line-input', 'data-path': `${q.id}:why`, style: 'margin-top:12px;font-size:.86rem',
    placeholder: 'Explanation shown after the answer (optional)',
    oninput: (e) => { q.explanation = e.target.value; save(); } });
  why.value = q.explanation || '';
  card.append(why);

  const points = el('input', { class: 'num-input', type: 'number', min: 10, step: 10, value: q.points,
    oninput: (e) => { q.points = +e.target.value || 100; save(); } });
  const secs = el('input', { class: 'num-input', type: 'number', min: 5, max: 180, value: q.time,
    oninput: (e) => { q.time = +e.target.value || 20; save(); } });

  card.append(el('div', { class: 'qtools' },
    el('span', { class: 'tiny faint' }, 'Points'), points,
    el('span', { class: 'tiny faint' }, 'Seconds'), secs,
    el('div', { class: 'grow' }),
    el('button', { class: 'btn sm ghost', title: 'Duplicate', onclick: () => {
      const copyQ = JSON.parse(JSON.stringify(q));
      copyQ.id = Math.random().toString(36).slice(2, 10);
      copyQ.choices = copyQ.choices.map(c => ({ ...c, id: Math.random().toString(36).slice(2, 8) }));
      quiz.questions.splice(i + 1, 0, copyQ); focused = copyQ.id; renderAll(); save();
    }, html: Sprite.icon('copy', 15) + ' Duplicate' }),
    el('button', { class: 'btn sm danger', onclick: () => {
      quiz.questions = quiz.questions.filter(x => x.id !== q.id); renderAll(); save();
    }, html: Sprite.icon('trash', 15) + ' Delete' })));

  return card;
}

function autosize(node) { node.style.height = 'auto'; node.style.height = node.scrollHeight + 'px'; }

function changeType(q, type) {
  q.type = type;
  const rid = () => Math.random().toString(36).slice(2, 8);
  if (type === 'tf') q.choices = [{ id: rid(), text: 'True', correct: true }, { id: rid(), text: 'False', correct: false }];
  else if (type === 'short') q.choices = [];
  else if (!q.choices.length) q.choices = [0, 1, 2, 3].map((n) => ({ id: rid(), text: '', correct: n === 0 }));
}

function addQuestion(type) {
  const rid = (n = 8) => Math.random().toString(36).slice(2, 2 + n);
  const q = { id: rid(10), type, text: '', points: quiz.settings.defaultPoints, time: quiz.settings.defaultTime,
              explanation: '', image: '', choices: [], answer: '' };
  changeType(q, type);
  quiz.questions.push(q);
  focused = q.id;
  renderAll(); save();
  document.getElementById('q-' + q.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.querySelector(`[data-path="${q.id}:text"]`)?.focus();
}

async function loadResponses() {
  const host = $('#pane-responses');
  const data = await api(`/quizzes/${quizId}/responses`);
  const rows = data.responses;
  const avg = rows.length ? Math.round(rows.reduce((s, r) => s + (r.total ? r.score / r.total : 0), 0) / rows.length * 100) : 0;
  const best = rows.length ? Math.max(...rows.map(r => r.total ? Math.round(r.score / r.total * 100) : 0)) : 0;

  host.innerHTML = '';
  host.append(el('div', { class: 'stat-row' },
    stat(rows.length, 'Responses'), stat(avg + '%', 'Average score'),
    stat(best + '%', 'Top score'), stat(quiz.questions.length, 'Questions')));

  const perQ = el('div', { class: 'card pad', style: 'margin-bottom:18px' },
    el('h3', { style: 'margin-bottom:16px;font-size:1.06rem' }, 'How each question went'));
  if (!data.stats.length) perQ.append(el('p', { class: 'faint tiny' }, 'No questions yet.'));
  data.stats.forEach((s, i) => {
    const pct = s.answered ? Math.round(s.correct / s.answered * 100) : 0;
    perQ.append(el('div', { style: 'margin-bottom:15px' },
      el('div', { class: 'spread', style: 'margin-bottom:6px' },
        el('span', { class: 'tiny' }, `${i + 1}. ${s.text || 'Untitled'}`),
        el('span', { class: 'tiny faint' }, `${s.correct}/${s.answered} correct · ${pct}%`)),
      el('div', { class: 'bar' }, el('i', { style: `width:${pct}%` }))));
  });
  host.append(perQ);

  const table = el('table');
  table.append(el('tr', {}, el('th', {}, 'Student'), el('th', {}, 'Score'), el('th', {}, 'Percent'),
                            el('th', {}, 'Time'), el('th', {}, 'When')));
  rows.slice().reverse().forEach(r => {
    const pct = r.total ? Math.round(r.score / r.total * 100) : 0;
    table.append(el('tr', {},
      el('td', {}, el('strong', {}, r.name)),
      el('td', {}, `${r.score} / ${r.total}`),
      el('td', {}, el('span', { class: 'chip ' + (pct >= 70 ? 'live' : pct >= 40 ? 'warn' : '') }, pct + '%')),
      el('td', { class: 'faint' }, Nova.fmtTime((r.seconds || 0) * 1000)),
      el('td', { class: 'faint tiny' }, Nova.ago(r.at))));
  });
  const wrapCard = el('div', { class: 'card pad' }, el('h3', { style: 'margin-bottom:12px;font-size:1.06rem' }, 'Every response'));
  if (!rows.length) wrapCard.append(el('div', { class: 'empty' }, el('span', { class: 'em', html: Sprite.icon('inbox', 40) }),
    'No responses yet. Share the link or run a live game.'));
  else wrapCard.append(table);
  host.append(wrapCard);
}

/* ── AI co-pilot ──────────────────────────────── */
const QUICK = ['Add 5 questions about this topic', 'Make the quiz harder',
               'Write explanations for every question', 'Add 3 true/false questions',
               'Fix the wording for Year 4 readers', 'Delete the last question'];

function renderPrompts() {
  const host = $('#prompts');
  host.innerHTML = '';
  QUICK.forEach(p => host.append(el('div', { class: 'prompt-chip', onclick: () => { $('#ai-text').value = p; askAI(); } }, p)));
  renderKnows();
}

/* Everything the co-pilot can already write questions about, listed rather than
 * guessed at.
 *
 * The question bank has known easy maths and spelling and the water cycle since
 * the day it was written, but the only way to find that out was to type
 * something and hope. A teacher should not have to guess what a tool knows: the
 * subjects are on the screen, one tap fills in the prompt, and the year group
 * beside them decides how hard the questions come out.
 */
let knowYear = 3;

function renderKnows() {
  const body = document.getElementById('knows-body');
  if (!body) return;
  const bank = window.QuizBank;
  if (!bank || !bank.TOPICS) {
    body.innerHTML = '<p class="tiny faint">Ask for any subject and it will have a go.</p>';
    return;
  }
  body.innerHTML = '';

  const years = el('div', { class: 'years' }, el('b', {}, 'Year'));
  [1, 2, 3, 4, 5, 6].forEach(n => {
    const btn = el('button', { class: 'yr' + (n === knowYear ? ' on' : ''), type: 'button',
      onclick: () => { knowYear = n; renderKnows(); } }, String(n));
    years.append(btn);
  });
  body.append(years);

  const named = new Set();
  const groups = [['Maths', 'maths'], ['English', 'english'],
                  ['Science', 'science'], ['The world', 'humanities']];
  for (const [title, key] of groups) {
    const ids = bank.SUBJECTS[key] || [];
    const topics = ids.map(id => bank.TOPICS.find(t => t.id === id)).filter(Boolean);
    if (!topics.length) continue;
    body.append(el('div', { class: 'subj' }, title));
    const row = el('div', { class: 'row' });
    topics.forEach(t => { named.add(t.id); row.append(topicChip(t)); });
    body.append(row);
  }

  // whatever the groups above did not mention, so nothing is hidden
  const rest = bank.TOPICS.filter(t => !named.has(t.id));
  if (rest.length) {
    body.append(el('div', { class: 'subj' }, 'And also'));
    const row = el('div', { class: 'row' });
    rest.forEach(t => row.append(topicChip(t)));
    body.append(row);
  }
}

function topicChip(topic) {
  return el('div', { class: 'prompt-chip', title: `Year ${knowYear} questions about ${topic.label}`,
    onclick: () => {
      $('#ai-text').value = `Write 8 questions about ${topic.label} for Year ${knowYear}`;
      askAI();
    } }, topic.label);
}

function addBubble(kind, html) {
  const node = el('div', { class: 'bubble ' + kind, html });
  $('#ai-log').append(node);
  $('#ai-log').scrollTop = $('#ai-log').scrollHeight;
  return node;
}

function greet() {
  addBubble('ai', `I can add, rewrite, reorder and delete questions in this quiz.<br>
    <strong>${permission === 'auto' ? 'Auto-edit' : permission === 'read' ? 'Read-only' : 'Ask me'}</strong> mode:
    ${permission === 'auto' ? 'changes are applied straight away.' : permission === 'read' ? 'nothing gets changed, only suggested.' : 'every change waits for your approval.'}`);
  renderPrompts();
}

async function aiStatus() {
  try {
    const s = await api('/ai/status');
    $('#ai-mode').textContent = s.live ? `Claude · ${s.model}` : 'Built-in question bank (no API key)';
  } catch { $('#ai-mode').textContent = 'offline'; }
}

$$('#perm button').forEach(btn => {
  btn.classList.toggle('on', btn.dataset.p === permission);
  btn.onclick = () => {
    permission = btn.dataset.p;
    store.set('permission', permission);
    $$('#perm button').forEach(b => b.classList.toggle('on', b === btn));
    addBubble('sys', permission === 'auto' ? 'Auto-edit on. Changes are applied straight away.'
            : permission === 'read' ? 'Read-only. The quiz will not be changed.'
            : 'Ask me. You approve every change.');
  };
});

const opClass = (op) => op.op === 'add_question' ? 'op-add' : op.op === 'delete_question' ? 'op-del'
                     : op.op === 'update_question' ? 'op-edit' : 'op-meta';
const opTag = (op) => ({ add_question: 'ADD', delete_question: 'DELETE', update_question: 'EDIT',
                         reorder: 'REORDER', update_quiz: 'SETTINGS' }[op.op] || op.op);

function describe(op) {
  if (op.op === 'add_question') {
    const q = op.question || {};
    const right = (q.choices || []).find(c => c.correct);
    return `${esc(q.text || 'New question')}${right ? ` <span style="color:var(--mint)">${esc(right.text)}</span>` : ''}`;
  }
  if (op.op === 'delete_question') {
    const q = quiz.questions.find(x => x.id === op.id);
    return esc(q ? (q.text || 'Untitled question') : 'a question');
  }
  if (op.op === 'update_question') {
    const q = quiz.questions.find(x => x.id === op.id);
    const keys = Object.keys(op.patch || {}).join(', ');
    return `${esc(q ? (q.text || 'Untitled') : 'question')} <span class="faint">(${esc(keys)})</span>`;
  }
  if (op.op === 'reorder') return 'Reorder the questions';
  return esc(JSON.stringify(op.patch || {}).slice(0, 120));
}

function showOps(bubble, ops) {
  const box = el('div', { class: 'ops' });
  ops.slice(0, 40).forEach(op => box.append(
    el('div', { class: 'op ' + opClass(op) },
      el('span', { class: 'op-tag' }, opTag(op)),
      el('span', { class: 'op-body', html: describe(op) }))));
  if (ops.length > 40) box.append(el('div', { class: 'op' }, el('span', { class: 'op-body' }, `+ ${ops.length - 40} more`)));
  bubble.append(box);

  const actions = el('div', { class: 'row', style: 'margin-top:10px;gap:8px' });
  actions.append(
    el('button', { class: 'btn sm mint grow', onclick: async () => {
      actions.remove();
      const res = await api(`/quizzes/${quizId}/ops`, { method: 'POST', body: { ops, clientId } });
      quiz = res.quiz;
      $('#title').value = quiz.title; $('#desc').value = quiz.description || '';
      renderAll(); markSaved();
      res.log.forEach(line => addBubble('sys', esc(line)));
      flashChanges(ops);
      toast('Applied ' + ops.length + ' change' + (ops.length === 1 ? '' : 's'), 'good');
      pendingOps = null;
    } }, 'Approve'),
    el('button', { class: 'btn sm ghost', onclick: () => { actions.remove(); addBubble('sys', 'Rejected'); pendingOps = null; } }, 'Reject'));
  bubble.append(actions);
}

function flashChanges(ops) {
  setTimeout(() => {
    ops.forEach(op => {
      const id = op.id || null;
      const node = id ? document.getElementById('q-' + id) : null;
      if (node) node.classList.add('flash');
    });
    if (ops.some(o => o.op === 'add_question')) {
      const last = $('#questions').lastElementChild;
      last?.classList.add('flash');
      last?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, 60);
}

async function askAI() {
  const box = $('#ai-text');
  const prompt = box.value.trim();
  if (!prompt) return;
  box.value = ''; box.style.height = 'auto';
  addBubble('me', esc(prompt));
  const thinking = addBubble('ai', '<div class="thinking"><i></i><i></i><i></i></div>');
  $('#ai-send').disabled = true;

  try {
    const res = await api('/ai', { method: 'POST', body: { quizId, prompt, permission } });
    thinking.innerHTML = esc(res.reply);
    if (res.source === 'offline') thinking.append(el('div', { class: 'tiny faint', style: 'margin-top:6px' }, 'answered by the built-in bank'));
    if (res.applied) {
      quiz = res.quiz;
      $('#title').value = quiz.title; $('#desc').value = quiz.description || '';
      renderAll(); markSaved();
      (res.log || []).forEach(line => addBubble('sys', esc(line)));
      flashChanges(res.ops || []);
    } else if ((res.ops || []).length) {
      pendingOps = res.ops;
      showOps(thinking, res.ops);
    } else if (res.note) {
      thinking.append(el('div', { class: 'tiny faint', style: 'margin-top:6px' }, res.note));
    }
  } catch (err) {
    thinking.innerHTML = esc(err.message);
  } finally {
    $('#ai-send').disabled = false;
    $('#ai-log').scrollTop = $('#ai-log').scrollHeight;
  }
}

$('#ai-send').onclick = askAI;
$('#ai-text').addEventListener('input', (e) => autosize(e.target));
$('#ai-text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askAI(); }
});
$('#ai-clear').onclick = () => { $('#ai-log').innerHTML = ''; greet(); };

/* ── header actions ───────────────────────────── */
$('#title').oninput = (e) => { quiz.title = e.target.value; save(); };
$('#desc').oninput = (e) => { quiz.description = e.target.value; save(); };
$('#add-bottom').onclick = () => addQuestion('mc');
$$('[data-add]').forEach(b => b.onclick = () => addQuestion(b.dataset.add));

$('#share').onclick = () => {
  modal(`
    <h2 style="margin-bottom:6px">Share it</h2>
    <p class="muted tiny" style="margin-bottom:18px">Good for homework. Answers appear in your Responses tab as they come in.</p>
    <div id="qrbox" style="display:flex;justify-content:center;margin-bottom:18px"></div>
    <div class="field"><label class="label">Homework link</label>
      <input class="input mono" id="lnk" value="Making a short link…" readonly></div>
    <div class="row" style="margin-top:18px;gap:10px">
      <button class="btn grow" id="cp">Copy</button>
      <a class="btn primary grow" style="justify-content:center" target="_blank" rel="noopener"
         id="classroom" href="#">Google Classroom</a>
    </div>`, { async onMount(box) {
      const link = await homeworkLink(quiz);
      box.querySelector('#lnk').value = link;
      box.querySelector('#cp').onclick = () => copy(link);
      box.querySelector('#classroom').href =
        classroomUrl(link, quiz.title, 'Complete this quiz on Quoldek.');
      const code = window.QR && QR.svg(link, { size: 150 });
      box.querySelector('#qrbox').innerHTML = code
        ? `<div style="background:#fff;padding:10px;border-radius:14px;line-height:0">${code}</div>`
        : `<p class="tiny faint" style="text-align:center;max-width:34ch">This link carries the whole quiz inside it, so it is too
           long for a QR code. Use Copy or the Classroom button below.</p>`;
    } });
};

$('#present').onclick = () => {
  if (!quiz.questions.length) return toast('Add a question first', 'bad');
/* Where a class actually types the address in. The deployed board sends them to
 * the short site; a board being run from a laptop keeps its own address, so a
 * game still works with no internet at all. */
/* Written out rather than hard-coded, because how many games there are depends
   on which updates have opened. Counted rather than named, so the next release
   does not need this line changed as well. */
const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight',
               'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen'];
function gameCount() {
  const all = window.NovaRules ? Object.keys(NovaRules.MODES) : [];
  const open = (window.NovaLaunch ? NovaLaunch.openModes(all) : all).length;
  return WORDS[open] || String(open);
}

const joinAddress = () => (window.QUOLDEK_JOIN
  ? window.QUOLDEK_JOIN.replace(/^https?:\/\//, '').replace(/\/?\?pin=.*$/, '')
  : location.host + '/play');

  modal(`
    <h2 style="margin-bottom:6px" id="pick-title">Pick how the class plays</h2>
    <p class="muted tiny" style="margin-bottom:18px" id="pick-sub">Same quiz, ${gameCount()} games. Everyone joins at <strong>${esc(joinAddress())}</strong> with the PIN.</p>
    <div class="modegrid" id="mode-list">
      <p class="tiny faint">Loading</p>
    </div>`, {
    wide: true,
    async onMount(box, close) {
      const list = box.querySelector('#mode-list');
      let modes = [];
      try { modes = (await api('/modes')).modes; } catch { /* offline */ }
      // anything from a release that has not opened yet is held back
      if (window.NovaLaunch) modes = NovaLaunch.openModes(modes);
      if (!modes.length) modes = [{ id: 'normal', icon: 'target', label: 'Normal',
                                    blurb: 'Fastest right answer scores the most', maps: [] }];
      showModes(modes);

      function showModes(all) {
        list.innerHTML = '';
        all.forEach(m => {
          const btn = el('button', { class: 'modecard', onclick: () => showMaps(m) });
          btn.append(el('span', { class: 'art', html: Sprite.scene(m.id, 320) }),
                     el('span', { class: 'body' },
                        el('strong', {}, m.label),
                        el('span', { class: 'sub' }, m.blurb)));
          btn.dataset.mode = m.id;
          list.append(btn);
        });
      }

      /* Second step: the map. It is the teacher's choice, so it gets its own
         screen rather than being buried as a dropdown on the mode card. */
      function showMaps(mode) {
        const maps = mode.maps && mode.maps.length ? mode.maps : [{ id: '', label: 'Default' }];
        box.querySelector('#pick-title').textContent = 'Pick the map';
        box.querySelector('#pick-sub').innerHTML = `${esc(mode.label)} · choose where the class plays`;
        list.innerHTML = '';
        maps.forEach(mp => {
          const btn = el('button', { class: 'modecard', 'data-map': mp.id,
            onclick: () => showSettings(mode, mp.id) });
          btn.append(el('span', { class: 'art map-' + mp.id, html: Sprite.scene(mode.id, 320) }),
                     el('span', { class: 'body' }, el('strong', {}, mp.label)));
          list.append(btn);
        });
        list.append(el('button', { class: 'btn ghost', style: 'grid-column:1/-1;margin-top:4px',
          onclick: () => {
            box.querySelector('#pick-title').textContent = 'Pick how everyone plays';
            box.querySelector('#pick-sub').innerHTML =
              `Same quiz, ${gameCount()} games. Everyone joins at <strong>${esc(joinAddress())}</strong> with the PIN.`;
            showModes(modes);
          } }, 'Back to the games'));
      }

      /* Third step: when it ends. Playing every question is what most people
         want, but a lesson with ten minutes left wants the clock to decide, and
         a race to a score is a different game entirely. */
      function showSettings(mode, map) {
        box.querySelector('#pick-title').textContent = 'Set the game up';
        box.querySelector('#pick-sub').textContent =
          `${mode.label} · everything here is for this game only, the quiz itself is not touched`;
        list.innerHTML = '';
        list.className = 'setup';

        /* What the teacher picks here rides on the game, not the quiz — so a fast
           five minutes before lunch does not permanently rewrite a quiz that is
           also set for homework. Everything defaults to what the quiz already says. */
        let goal = { kind: 'questions', value: 0 };
        const setup = { seconds: 0, points: 0, streaks: true, shuffle: false,
                        mix: false, lateJoin: true, doubleLast: false, music: true };

        const section = (title, body) => {
          const sec = el('div', { class: 'sect' }, el('h4', {}, title));
          sec.append(body);
          list.append(sec);
          return sec;
        };

        // ── how it ends
        const ends = el('div', { class: 'modegrid endgrid' });
        const endOptions = [
          { kind: 'questions', value: 0, title: 'All the questions', sub: 'It ends when the quiz runs out' },
          { kind: 'points', value: 500, title: 'First to 500', sub: 'A short race' },
          { kind: 'points', value: 1000, title: 'First to 1,000', sub: 'A longer race' },
          { kind: 'time', value: 5, title: '5 minutes', sub: 'Whoever is ahead wins' },
          { kind: 'time', value: 10, title: '10 minutes', sub: 'Most of a lesson' },
          { kind: 'time', value: 15, title: '15 minutes', sub: 'A full session' }
        ];
        endOptions.forEach(o => {
          const btn = el('button', { class: 'endcard', 'data-goal': o.kind + ':' + o.value,
            onclick: () => {
              goal = { kind: o.kind, value: o.value };
              ends.querySelectorAll('.endcard').forEach(b => b.classList.remove('on'));
              btn.classList.add('on');
            } });
          btn.append(el('span', { class: 'endmark',
                                  html: Sprite.icon(o.kind === 'time' ? 'clock' : o.kind === 'points' ? 'medal' : 'flag', 26) }),
                     el('span', { class: 'body' }, el('strong', {}, o.title), el('span', { class: 'sub' }, o.sub)));
          if (o.kind === 'questions') btn.classList.add('on');
          ends.append(btn);
        });
        section('How it ends', ends);

        /* A row of choices where one is always picked. `values` are what goes on
           the wire; `labels` are what a person reads. */
        const choose = (key, values, labels) => {
          const row = el('div', { class: 'seg' });
          values.forEach((v, i) => {
            const btn = el('button', { type: 'button', 'data-set': key + ':' + v,
              onclick: () => {
                setup[key] = v;
                row.querySelectorAll('button').forEach(b => b.classList.remove('on'));
                btn.classList.add('on');
              } }, labels[i]);
            if (setup[key] === v) btn.classList.add('on');
            row.append(btn);
          });
          return row;
        };

        section('Seconds a question',
          choose('seconds', [0, 10, 15, 20, 30, 45, 60],
                 ['As the quiz says', '10s', '15s', '20s', '30s', '45s', '60s']));
        section('Points a question',
          choose('points', [0, 50, 100, 200, 500],
                 ['As the quiz says', '50', '100', '200', '500']));

        // ── the switches
        const switches = el('div', { class: 'switches' });
        const toggles = [
          ['streaks', 'Streak bonus', 'Right answers in a row are worth more'],
          ['doubleLast', 'Double the last question', 'A chance to catch up at the end'],
          ['shuffle', 'Shuffle the questions', 'A different order every game'],
          ['mix', 'Shuffle the answers', 'Off for questions like "all of the above"'],
          ['lateJoin', 'Let people join late', 'Somebody arriving after the start can still play'],
          ['music', 'Music on the big screen', 'A quiet tune. Nothing on the phones.']
        ];
        toggles.forEach(([key, title, sub]) => {
          const row = el('label', { class: 'musicrow' });
          const input = el('input', { type: 'checkbox', id: 'set-' + key });
          input.checked = !!setup[key];
          input.onchange = () => { setup[key] = input.checked; };
          row.append(input, el('span', {}, el('strong', {}, title), el('span', { class: 'sub' }, sub)));
          switches.append(row);
        });
        section('And these', switches);

        const go = el('button', { class: 'btn primary lg block', id: 'start-game',
          onclick: () => launch(mode.id, map, goal, setup) }, 'Start the game');
        list.append(go);
        list.append(el('button', { class: 'btn ghost block', style: 'margin-top:8px',
          onclick: () => { list.className = 'modegrid'; showMaps(mode); } }, 'Back to the maps'));
      }

      async function launch(mode, map, goal, setup) {
        try {
          const game = await api('/games', { method: 'POST',
            body: { quizId, mode, map, goal, setup, music: setup.music !== false } });
          store.set('host:' + game.pin, game.hostToken);
          // The token also travels in the URL, not only in browser storage: a
          // browser with site data switched off saves nothing, and then the board
          // cannot tell it is the teacher and Start stays grey. A fragment is
          // never sent to a server.
          location.href = 'host.html?pin=' + game.pin + '#h=' + game.hostToken;
        } catch (err) { toast(err.message, 'bad'); }
      }
    }
  });
};

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(true); toast('Saved', 'good'); }
});

boot().catch(err => { document.body.innerHTML = `<div class="empty" style="padding-top:120px"><span class="em">${Sprite.icon('warn', 40)}</span>${esc(err.message)}<br><a class="btn sm" style="margin-top:16px" href="index.html">Back to quizzes</a></div>`; });

/* The homework link.
 *
 * It used to be the whole quiz packed into the address — hundreds of characters,
 * which nobody can read out and Google Classroom shows as a wall of nonsense.
 * The quiz now goes into the database and the link is the short address plus six
 * characters, so it fits on a board and survives being retyped.
 *
 * If there is no connection the long self-contained link is still handed over,
 * because a link that works offline beats a short one that does not exist.
 */
async function homeworkLink(quiz) {
  const fallback = (window.Nova && Nova.shareLink) ? Nova.shareLink(quiz.id)
                                                   : location.origin + '/take?id=' + quiz.id;
  if (!(window.NovaLive && NovaLive.configured && NovaLive.shareQuiz)) return fallback;
  try {
    const code = await NovaLive.shareQuiz(quiz);
    const host = window.QUOLDEK_HOMEWORK || (location.origin + '/take?c=');
    return host + code;
  } catch { return fallback; }
}
</script>
