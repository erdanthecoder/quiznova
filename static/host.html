<body class="dark">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/quiz"><div class="brand-mark" id="brand-mark"></div><div>Quoldek<small id="qt">live game</small></div></a>
    <div class="grow"></div>
    <span class="chip" id="conn"><span class="dot"></span> live</span>
    <span class="chip" id="count">0 players</span>
    <span class="chip" id="goal" hidden></span>
    <span class="chip mono" id="pinchip">------</span>
    <button class="btn sm" id="music" title="Music on the big screen"></button>
    <button class="btn sm danger" id="end">End game</button>
  </div>
</header>

<main class="stage" id="stage"></main>

<script src="/sprites.js"></script>
<script src="/music.js"></script>
<script src="/arena.js"></script>
<script src="/nova.js"></script>
<script src="/qr.js"></script>
<script>
const { $, api, el, esc, qs, toast, stream, store, confetti, SHAPES, copy, modal } = Nova;
const pin = qs('pin');
/* Being the teacher, across two addresses.
 *
 * The studio saves the host token in its own browser storage, and on the
 * deployed site the board lives at a different address — so the board could not
 * read it, decided it was a spectator, and left Start greyed out. Hosting a game
 * was impossible on the live site while every test passed, because the tests
 * copied the token across themselves: a hand-off the product never did.
 *
 * The studio now carries it in the URL fragment. A fragment is never sent to any
 * server and never appears in a log; the board takes it, stores it under its own
 * address so a refresh still works, and wipes it out of the address bar at once
 * so it is not left on screen or copied by mistake.
 */
function claimHost() {
  const fragment = String(location.hash || '');
  const found = fragment.match(/(?:^#|&)h=([A-Za-z0-9_-]{4,64})/);
  if (!found || !pin) return null;
  // remember it if this browser will remember anything, and carry on either way
  store.set('host:' + pin, found[1]);
  history.replaceState(null, '', location.pathname + location.search);
  return found[1];
}

// the URL first, because it is the one place that cannot silently fail
const hostToken = claimHost() || store.get('host:' + pin);
let game = null, drift = 0, ticker = null, lastState = '', lastHp = {};

/* Where students join. Kept as two small functions because the GitHub Pages build
 * rewrites them to folder-relative addresses — everything else stays identical. */
/* Where players join. Whatever is running this — the deployed site, the desktop
 * app, or a plain Flask copy on a laptop — sets QUOLDEK_JOIN to the address a
 * phone should be sent to, with the PIN going on the end. */
const joinUrl = () => (window.QUOLDEK_JOIN ? window.QUOLDEK_JOIN + pin
                                           : location.origin + '/play?pin=' + pin);
const joinLabel = () => joinUrl().replace(/^https?:\/\//, '').replace(/\/?\?pin=.*$/, '');

const mark = document.getElementById('brand-mark');
if (mark) mark.innerHTML = Sprite.logo(42);
if (!pin) location.href = '/quiz';
if (!hostToken) toast('You are watching this game. Only the teacher device can control it.', 'bad');

/* ── the music ─────────────────────────────────────
 *
 * It plays here and only here: on the screen the room is looking at. A browser
 * will not make a sound until somebody has clicked, so the first click anywhere
 * on the board is what actually starts it, and the button says what will happen
 * rather than pretending it is already playing.
 */
let musicWanted = true, musicUnlocked = false;
const musicBtn = document.getElementById('music');

function paintMusic() {
  if (!musicBtn) return;
  const on = musicWanted && musicUnlocked;
  musicBtn.innerHTML = Sprite.icon(musicWanted ? 'sound' : 'quiet', 16);
  musicBtn.title = !musicWanted ? 'Music is off — turn it on'
    : on ? 'Music is playing — turn it off'
         : 'Music starts as soon as you click the board';
  musicBtn.classList.toggle('quiet', !musicWanted);
}

/* Each part of a game has its own piece of music. The board says which part it
 * is in; the tune follows, easing from one to the next.
 *
 * Since 4.0 the question also has a tune per kind of game — a race gallops, a
 * heist sneaks, the lava chases — because the question is the moment the room is
 * actually in, and the same eight bars in all fourteen games is what turns a
 * soundtrack into a screensaver. */
function trackFor(state) {
  if (!state) return 'lobby';
  if (state.state === 'question') return NovaMusic.tuneFor(state.mode);
  if (state.state === 'reveal') return 'reveal';
  if (state.state === 'over') return 'podium';
  return 'lobby';
}

function musicNow() {
  if (!(musicWanted && musicUnlocked)) return;
  NovaMusic.play(trackFor(game));
}

function musicShould(play) {
  musicWanted = play;
  if (play && musicUnlocked) musicNow(); else NovaMusic.stop();
  try { localStorage.setItem('nova:music', play ? '1' : ''); } catch { /* private mode */ }
  paintMusic();
}

if (musicBtn) {
  // In the app, Settings decides how each board starts — the button beside the
  // PIN still turns it off for this game. On the web there is no settings
  // window, so the board remembers what was picked here last time.
  if (typeof window.QUOLDEK_MUSIC === 'boolean') musicWanted = window.QUOLDEK_MUSIC;
  else try { const saved = localStorage.getItem('nova:music'); if (saved !== null) musicWanted = !!saved; }
  catch { /* private mode */ }
  musicBtn.onclick = (e) => { e.stopPropagation(); musicUnlocked = true; musicShould(!musicWanted); };
  // the first click anywhere is the permission a browser is waiting for
  document.addEventListener('click', () => {
    if (musicUnlocked) return;
    musicUnlocked = true;
    if (musicWanted) musicNow();
    paintMusic();
  }, { once: true });
  paintMusic();
}

function connect() {
  stream(`/games/${pin}/events`, (msg) => {
    if (msg.data && msg.data.pin) apply(msg.data);
    else if (msg.event === 'hello' && msg.data?.error) fail();
  }, `/games/${pin}`);
}

function fail() {
  $('#stage').innerHTML = `<div class="card pad empty"><span class="em">${Sprite.icon('ghost', 48)}</span>
    That game is no longer running.<br><a class="btn sm" style="margin-top:16px" href="/quiz">Back to quizzes</a></div>`;
}

function apply(state) {
  const wasState = game && game.state;
  game = state;
  drift = state.serverNow - Date.now();
  $('#qt').textContent = state.quizTitle;
  $('#pinchip').textContent = state.pin;
  $('#count').textContent = state.players.length + ' player' + (state.players.length === 1 ? '' : 's');
  document.body.classList.toggle('laser', state.mode === 'laser');

  // the teacher's choice when the game was made, honoured once
  if (musicBtn && !musicSettled && state.music === false) { musicSettled = true; musicShould(false); }
  else if (musicBtn && !musicSettled) { musicSettled = true; paintMusic(); }

  // a flourish on the two moments the room reacts to anyway, and the music
  // moves to the piece that belongs to what is happening now
  if (wasState && wasState !== state.state) {
    if (state.state === 'question') sting('go');
    else if (state.state === 'over') sting('win');
    musicNow();
  } else if (!wasState) musicNow();

  // somebody new in the lobby is worth two notes
  if (state.state === 'lobby' && lastCount !== null && state.players.length > lastCount) sting('join');
  lastCount = state.players.length;

  paintGoal();

  const key = state.state + ':' + state.index;
  render(key !== lastState);
  lastState = key;
}
let musicSettled = false, lastCount = null;

/* What the game is being played for, where the room can see it. A time limit
 * counts itself down; a score shows how close the leader is. */
let goalTicker = null;
function paintGoal() {
  const chip = document.getElementById('goal');
  if (!chip || !game) return;
  const goal = game.goal || { kind: 'questions' };
  clearInterval(goalTicker);
  if (goal.kind === 'questions' || game.state === 'lobby' || game.state === 'over') {
    chip.hidden = true;
    return;
  }
  chip.hidden = false;
  if (goal.kind === 'points') {
    const best = game.players.length ? Math.max(...game.players.map(p => p.score || 0)) : 0;
    chip.textContent = `${best} / ${goal.value}`;
    chip.title = `First to ${goal.value} wins`;
    chip.classList.toggle('warn', best >= goal.value * 0.8);
    return;
  }
  const endsBy = (game.startedAt || 0) + goal.value * 60000;
  const paint = () => {
    const left = Math.max(0, endsBy - (Date.now() + drift));
    const m = Math.floor(left / 60000), sec = Math.floor(left % 60000 / 1000);
    chip.textContent = `${m}:${String(sec).padStart(2, '0')} left`;
    chip.classList.toggle('warn', left < 61000);
    if (left <= 0) clearInterval(goalTicker);
  };
  chip.title = `${goal.value} minutes, then whoever is ahead wins`;
  paint();
  goalTicker = setInterval(paint, 500);
}
const sting = (kind) => { if (musicUnlocked && musicWanted) NovaMusic.sting(kind); };

/* A poll every second used to throw the whole board away and build a new one.
 * Nothing could animate — a kart was created at its new position rather than
 * driving there, and every tower block replayed its drop — which is what made
 * the game look like it was stuttering. So we build the new board off-screen and
 * copy only the differences onto the live one: unchanged nodes are never touched,
 * and a changed style is a real change to an existing element, which is what CSS
 * transitions need to animate. Nodes marked data-static (the QR code, the
 * countdown ring) own themselves and are left alone entirely. */
function morph(cur, next) {
  if (cur.hasAttribute && cur.hasAttribute('data-static')) return;
  for (const a of Array.from(cur.attributes)) if (!next.hasAttribute(a.name)) cur.removeAttribute(a.name);
  for (const a of Array.from(next.attributes)) if (cur.getAttribute(a.name) !== a.value) cur.setAttribute(a.name, a.value);
  const cs = Array.from(cur.childNodes), ns = Array.from(next.childNodes);
  for (let i = 0; i < Math.max(cs.length, ns.length); i++) {
    const c = cs[i], x = ns[i];
    if (!x) { c.remove(); continue; }
    if (!c) { cur.append(x); continue; }
    if (c.nodeType === 3 && x.nodeType === 3) { if (c.nodeValue !== x.nodeValue) c.nodeValue = x.nodeValue; continue; }
    if (c.nodeType !== 1 || x.nodeType !== 1 || c.tagName !== x.tagName) { c.replaceWith(x); continue; }
    morph(c, x);
  }
}

/** Draw `build()` into `host`, morphing onto what is already there unless the
 *  screen genuinely changed (new question, new phase). */
function paint(host, build, fresh) {
  const before = seats();
  const next = build();
  if (fresh || !host.firstElementChild) { host.innerHTML = ''; host.append(next); slide(before); return true; }
  morph(host.firstElementChild, next);
  slide(before);
  return false;
}

/* When the scores change the table reorders, and a row that simply appears in its
 * new place tells nobody anything. So: note where every row is, let the update
 * happen, then start each row from where it used to be and let it travel. The
 * browser does the moving; we only hand it the distance. */
function seats() {
  const map = new Map();
  document.querySelectorAll('.lb-row[data-id]').forEach(node => {
    map.set(node.dataset.id, {
      top: node.getBoundingClientRect().top,
      score: node.querySelector('.score') ? node.querySelector('.score').textContent : null
    });
  });
  return map;
}

/* A score that jumps from 108 to 227 is just a different number. Counting it up
 * is how a child sees they gained something. */
function countUp(node, fromText, toText) {
  const from = parseFloat(String(fromText).replace(/[^0-9.-]/g, ''));
  const to = parseFloat(String(toText).replace(/[^0-9.-]/g, ''));
  if (!isFinite(from) || !isFinite(to) || from === to) return;
  const suffix = String(toText).replace(/^-?[\d.,]+/, '');
  const started = performance.now();
  const step = (now) => {
    const t = Math.min(1, (now - started) / 700);
    const eased = 1 - Math.pow(1 - t, 3);
    node.textContent = Math.round(from + (to - from) * eased) + suffix;
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function slide(before) {
  if (!before.size) return;
  document.querySelectorAll('.lb-row[data-id]').forEach(node => {
    const was = before.get(node.dataset.id);
    if (!was) return;
    const shift = was.top - node.getBoundingClientRect().top;
    if (Math.abs(shift) >= 2) {
      node.animate([{ transform: `translateY(${shift}px)` }, { transform: 'none' }],
                   { duration: 520, easing: 'cubic-bezier(.2,.9,.25,1)' });
    }
    const score = node.querySelector('.score');
    if (score && was.score !== null) countUp(score, was.score, score.textContent);
  });
}

function render(fresh) {
  const stage = $('#stage');
  if (game.state === 'lobby') { if (paint(stage, lobbyView, fresh)) bindLobby(); return; }
  if (game.state === 'over')  { if (paint(stage, overView, fresh)) { cancelAnimationFrame(ticker); announce(); } return; }
  if (game.state === 'arena') { if (paint(stage, arenaView, fresh)) watchArena(); return; }
  if (boardArena) { boardArena.stop(); boardArena = null; }
  if (!game.question) return;
  if (paint(stage, () => questionView(fresh), fresh)) { bindQuestion(); runTimer(); }
}

/* ── lobby ─────────────────────────────────────── */
function lobbyView() {
  const root = el('div', { class: 'lobby' });

  const bar = el('div', { class: 'joinbar' });
  bar.innerHTML = `
    <div class="lobby-art">${Sprite.scene(game.mode, 190)}</div>
    <div style="flex:1">
      <div class="lab">Playing</div>
      <div class="where">${esc((game.modeInfo && game.modeInfo.label) || 'Normal')}</div>
      <div class="lab" style="margin-top:10px">Join at</div>
      <div class="where" id="join-where">${esc(joinLabel())}</div>
    </div>
    <div style="text-align:center">
      <div class="lab">Game PIN</div>
      <div class="pinhuge">${esc(pin)}</div>
    </div>
    <div class="qrbox" id="qr" data-static></div>`;
  root.append(bar);

  /* The room, rather than a list of the room.
   *
   * A lobby is the only screen a class stares at for minutes at a time, and a
   * grid of name chips gives them nothing to look at while they wait. So the
   * blooks stand about on the same floor the game will be played on, in the
   * order they arrived, and a new one walks in rather than appearing. Beyond
   * two dozen the floor gets crowded and the list underneath does the work.
   */
  /* The room, and the register under it. A teacher scanning for who is still
   * missing wants the names in one line of sight; a class waiting for ten
   * minutes wants something to look at. Both, rather than a choice.
   *
   * These two go in whatever happens, even when they are empty. The update pass
   * morphs one render onto the last by walking children in order, so a lobby
   * that grows a fourth child the moment somebody joins hands every later child
   * the wrong partner — which is how the Start button came back unbound and a
   * teacher could press it all day. The shape stays the same; the contents move.
   */
  const room = el('div', { class: 'waiting' });
  const crowd = el('div', { class: 'crowd' + (game.players.length ? ' strip' : '') });
  const many = game.players.length > 24;

  if (!game.players.length) {
    crowd.append(el('div', { class: 'nobody' },
      el('div', { class: 'mini-face', html: Sprite.icon('wave', 44) }),
      el('div', { style: 'margin-top:8px' }, 'Waiting for the class to join'),
      el('div', { class: 'tiny faint', style: 'margin-top:4px' },
         'They type the PIN on their own device')));
  } else {
    if (!many) room.append(lobbyRoom());
    game.players.forEach(p => crowd.append(el('div', { class: 'face ' + (game.mode === 'laser' ? p.team : '') },
      el('span', { class: 'av', html: Sprite.face(p.avatar, many ? 40 : 24) }), p.name)));
    if (many) crowd.classList.remove('strip');
  }
  root.append(room, crowd);

  root.append(el('div', { class: 'lobbybar' },
    el('button', { class: 'btn primary lg', id: 'start' },
       el('span', { class: 'mini-face', html: Sprite.icon('play', 18) }), 'Start game'),
    el('button', { class: 'btn', id: 'cp' },
       el('span', { class: 'mini-face', html: Sprite.icon('copy', 16) }), 'Copy join link'),
    el('span', { class: 'mode-badge ' + (game.mode === 'laser' ? 'mode-laser' : 'mode-normal') },
       el('span', { class: 'mini-face', html: Sprite.icon((game.modeInfo && game.modeInfo.icon) || 'target', 18) }),
       (game.modeInfo && game.modeInfo.label) || 'Normal'),
    el('span', { class: 'muted' },
       `${game.players.length} player${game.players.length === 1 ? '' : 's'} · ${game.total} questions`),
    game.mode === 'laser'
      ? el('span', { class: 'tiny faint' }, 'Teams are balanced automatically. Players can swap before the start.')
      : ''));
  return root;
}

/* Everybody who has joined, standing on the floor they are about to play on.
 *
 * Placed in rows back to front so the ones who arrived first are nearest — which
 * means a child watching for their own name has somewhere to look, and the
 * newest arrival is always the one at the back. */
function lobbyRoom() {
  const people = game.players.slice(0, 24);
  const perRow = people.length <= 6 ? Math.max(1, people.length)
               : people.length <= 12 ? 6 : 8;
  const placed = people.map((p, i) => {
    const row = Math.floor(i / perRow);
    const inRow = i % perRow;
    const wide = Math.min(perRow, people.length - row * perRow);
    // odd rows step half a place across, so nobody is ever directly behind
    // somebody else and every name is readable
    const shift = row % 2 ? 0.5 : 0;
    return { p, i, row, x: 50 + (inRow - (wide - 1) / 2 + shift) * (74 / perRow), y: 9 + row * 27 };
  });
  /* Back row first. Everything on this floor is drawn on one plane, so what is
   * in front is decided by the order it is added — and a name tag from the row
   * behind landing over the face in front is exactly what a lobby must not do. */
  placed.sort((a, b) => b.row - a.row);

  return stage((world) => {
    placed.forEach(({ p, i, x, y }) => {
      const node = standing(p, x, y, p.name, game.mode === 'laser' ? ' ' + p.team : '');
      // arriving, not appearing: a new blook walks in rather than blinking on
      node.classList.add('arriving');
      node.style.animationDelay = Math.min(600, i * 45) + 'ms';
      world.append(node);
    });
  });
}

/* Bound once, when the lobby is first drawn: later polls only morph the roster,
 * so the buttons keep their handlers and the QR code is not redrawn every second. */
function bindLobby() {
  const url = joinUrl();
  $('#cp').onclick = () => copy(url);
  const startBtn = $('#start');
  if (startBtn) startBtn.onclick = async () => {
    if (!game.players.length) return toast('Wait for at least one player', 'bad');
    // Never a dead button. If this device is not the one that made the game it
    // says so in a sentence somebody can act on, rather than refusing to be
    // pressed and leaving a teacher guessing at a grey rectangle.
    if (!hostToken) {
      return toast('Start this game from the device that made it, or make a new one', 'bad');
    }
    try { await api(`/games/${pin}/start`, { method: 'POST', body: { hostToken } }); }
    catch (err) { toast(err.message, 'bad'); }
  };
  drawQR(url);
}

/* Real, dependency-free QR of the join link — students can scan or type the PIN. */
function drawQR(url) {
  const host = document.getElementById('qr');
  if (!host) return;
  const code = window.QR && QR.svg(url, { size: 140 });
  host.innerHTML = code || `<div style="width:140px;height:140px;display:grid;place-items:center;color:#0b1020;
    font-weight:800;font-size:.72rem;text-align:center;padding:8px">Type the PIN<br>
    <span style="font-size:1.15rem">${esc(pin)}</span></div>`;
  host.insertAdjacentHTML('beforeend',
    '<div style="color:#0b1020;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-align:center;margin-top:4px">SCAN TO JOIN</div>');
}

/* ── the Laser Tag arena, on the big screen ────── */
let boardArena = null;

function arenaView() {
  const root = el('div', { class: 'board' });
  const panel = el('div', { class: 'ask' });
  panel.innerHTML = `<h1>Laser Tag</h1>
    <div class="tally"><b>${game.players.length}</b><span>in the arena</span></div>`;
  root.append(panel);
  root.append(el('div', { class: 'arena-board' }, el('canvas', { id: 'board-arena' })));
  // the arena is the thing worth watching, so the table stays short
  const rest = el('div', { class: 'rest' });
  rest.append(leaderboard({ rows: 4, title: 'Top of the arena' }));
  root.append(rest);
  if (hostToken) root.append(el('div', { class: 'row', style: 'justify-content:center;flex:none' },
    el('button', { class: 'btn lg primary', id: 'advance' }, 'Finish and show the scores')));
  return root;
}

function watchArena() {
  const canvas = document.getElementById('board-arena');
  if (!canvas || boardArena) return;
  // the board is a spectator: it draws everyone and controls nobody
  boardArena = NovaArena.start({ canvas, watching: true, send: () => {} });
  if (Nova.arenaListen) Nova.arenaListen(pin, (event, payload) => boardArena && boardArena.heard(event, payload));
  const advance = document.getElementById('advance');
  if (advance) advance.onclick = () => api(`/games/${pin}/end`, { method: 'POST', body: { hostToken } })
    .catch(e => toast(e.message, 'bad'));
}

/* ── question ──────────────────────────────────── */
function questionView(fresh) {
  const q = game.question;
  const revealing = game.state === 'reveal';
  const answered = game.players.filter(p => p.answered).length;
  const root = el('div', { class: 'board' + (revealing ? ' result' : '') });

  const ask = el('div', { class: 'ask' });
  ask.innerHTML = `
    <div class="dial" id="timer" data-static>
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" stroke="rgba(22,16,54,.12)" stroke-width="9" fill="none"></circle>
        <circle cx="50" cy="50" r="44" stroke="#6C4CF1" stroke-width="9" fill="none" stroke-linecap="round"
                id="tring" stroke-dasharray="276.5" stroke-dashoffset="0"></circle>
      </svg>
      <div class="num" id="tnum">&ndash;</div>
    </div>
    <h1>${esc(q.text || 'Question')}</h1>
    <div class="tally"><b>${answered}/${game.players.length}</b><span>answered</span></div>`;
  root.append(ask);

  const grid = el('div', { class: 'grid4' });
  if (q.type === 'short') {
    grid.classList.add('one');
    const tile = el('div', { class: 'tile a2', style: '--c:var(--sun)' });
    tile.innerHTML = `<span class="lbl">${revealing ? 'Answer: ' + esc(q.answer || '') : 'Everyone is typing an answer'}</span>`;
    grid.append(tile);
  } else {
    const total = Object.values(game.counts || {}).reduce((a, b) => a + b, 0) || 1;
    q.choices.forEach((c, i) => {
      const count = (game.counts || {})[c.id] || 0;
      const pct = revealing ? (count / total * 100) : 0;
      const tile = el('div', { class: `tile a${i % 6}` + (revealing ? (c.correct ? ' hit' : ' miss') : ''),
                               style: `animation-delay:${i * 55}ms` });
      tile.innerHTML = `<span class="sh">${SHAPES[i % 6]}</span>
        <span class="lbl">${esc(c.text || '')}</span>
        ${revealing ? `<span class="tick">&#10004;</span><span class="n">${count}</span>` : ''}
        <span class="fill" style="width:${fresh ? 0 : pct}%"></span>`;
      grid.append(tile);
      if (revealing && fresh) requestAnimationFrame(() => tile.querySelector('.fill').style.width = pct + '%');
    });
  }
  root.append(grid);

  if (revealing && q.explanation) root.append(el('p', { class: 'why' }, q.explanation));

  // the arena and the table belong to the moment the scores move, not to the question
  const rest = el('div', { class: 'rest', id: 'extra' });
  if (revealing) extraInto(rest);
  root.append(rest);

  if (hostToken) root.append(el('div', { class: 'row', style: 'justify-content:center;flex:none' },
    el('button', { class: 'btn lg' + (revealing ? ' primary' : ''), id: 'advance' },
       revealing ? (game.index + 1 >= game.total ? 'Final scores' : 'Next question') : 'Show the answer')));
  return root;
}

function bindQuestion() {
  const advance = document.getElementById('advance');
  if (advance) advance.onclick = () => api(`/games/${pin}/next`, { method: 'POST', body: { hostToken } }).catch(e => toast(e.message, 'bad'));
}

/* The ring is redrawn every frame rather than five times a second: at a distance a
 * stepping ring is the most obvious thing on the screen. */
function runTimer() {
  cancelAnimationFrame(ticker); clearInterval(ticker);
  const num = document.getElementById('tnum');
  const ring = document.getElementById('tring');
  const dial = document.getElementById('timer');
  if (!num) return;
  if (game.state !== 'question' || !game.endsAt) {
    NovaMusic.tension(0);
    num.innerHTML = Sprite.icon('tick', 34, '#161036'); dial?.classList.remove('low');
    if (ring) ring.style.strokeDashoffset = 276.5;
    return;
  }
  const limit = (game.question.time || 20) * 1000;
  let fired = false;
  const frame = () => {
    const left = Math.max(0, game.endsAt - (Date.now() + drift));
    num.textContent = Math.ceil(left / 1000);
    NovaMusic.tension(1 - left / limit);
    dial?.classList.toggle('low', left < 5200);
    if (ring) ring.style.strokeDashoffset = 276.5 * (1 - left / limit);
    if (left <= 0) {
      if (!fired && hostToken) { fired = true; api(`/games/${pin}/tick`, { method: 'POST', body: { hostToken } }).catch(() => {}); }
      return;
    }
    ticker = requestAnimationFrame(frame);
  };
  frame();
}

/* ── leaderboard / arena under the question ────── */
function extraInto(host) {
  if (!host) return;
  const views = { laser: arena, kart: raceTrack, tower: skyline, treasure: treasureBoard,
                  boss: bossArena, snow: snowField, balloon: balloonField,
                  tug: tugField, heist: heistBoard, cards: cardTable,
                  volcano: volcanoWall, factory: factoryFloor, fishing: fishingLake };
  const view = views[game.mode];
  // laser and boss carry their own standings, so a table underneath would repeat them
  if (view) host.append(view());
  if (!view || (game.mode !== 'laser' && game.mode !== 'boss')) host.append(leaderboard());
}


/* A tilted floor with figures standing on it. Every arena is built from this,
 * so a map only has to change the floor and the whole game changes with it. */
function stage(fill) {
  const box = el('div', { class: 'stage3d' });
  const world = el('div', { class: 'world map-' + (game.map || '') });
  const floor = el('div', { class: 'floor' });
  world.append(floor);
  fill(world, floor);
  box.append(world);
  return box;
}

/** One figure standing on the floor at x% across and y% back. */
function standing(p, x, y, label, extra) {
  const node = el('div', { class: 'figure' + (extra || ''), 'data-id': p.id,
    style: `left:${x}%;bottom:${y}%;margin-left:-26px` });
  node.append(el('div', { class: 'shadow' }),
              el('div', { class: 'mini-face', html: Sprite.face(p.avatar, 58) }),
              el('div', { class: 'tag' }, label));
  return node;
}

const KART_COLOURS = ['#F4364C', '#4F6BFF', '#FFC53D', '#12BE8E', '#6C4CF1', '#2BA8FF'];

function raceTrack() {
  const longest = Math.max(game.trackLength || 1000, ...game.players.map(p => p.distance || 0));
  return stage((world, floor) => {
    floor.append(el('div', { class: 'finish', style: 'right:2%' }));
    [22, 44, 66, 88].forEach(t => floor.append(el('div', { class: 'line', style: `top:${t}%` })));
    game.players.slice(0, 10).forEach((p, i) => {
      const pct = Math.min(94, (p.distance || 0) / longest * 92) + 2;
      const lane = 6 + i * (78 / Math.max(1, Math.min(10, game.players.length)));
      world.append(standing(p, pct, lane, `${p.name} · ${p.distance || 0}m`,
                            i === 0 ? ' lead' : ''));
    });
    if (!game.players.length) world.append(el('p', { class: 'faint tiny' }, 'No racers yet.'));
  });
}

function skyline() {
  const tallest = Math.max(6, ...game.players.map(p => p.blocks || 0));
  return stage((world) => {
    game.players.slice(0, 10).forEach((p, i) => {
      const x = 8 + i * (84 / Math.max(1, Math.min(10, game.players.length)));
      const node = el('div', { class: 'figure' + (i === 0 ? ' lead' : ''), 'data-id': p.id,
        style: `left:${x}%;bottom:14%;margin-left:-17px` });
      const stack = el('div', { class: 'pillar',
        style: `height:${Math.max(4, (p.blocks || 0) / tallest * 150)}px;--c:${KART_COLOURS[i % 6]}` });
      node.append(el('div', { class: 'shadow' }), stack,
                  el('div', { class: 'tag' }, `${p.name} · ${p.blocks || 0}`));
      world.append(node);
    });
    if (!game.players.length) world.append(el('p', { class: 'faint tiny' }, 'No builders yet.'));
  });
}

/* One rope for the whole room. The marker is the only thing that moves, and it
   can go back the way it came, which is the point of the game. */
function tugField() {
  const rope = Math.max(-100, Math.min(100, game.rope || 0));
  const leading = rope < 0 ? 'red' : 'blue';
  return stage((world) => {
    // how much further each team has to drag it, which is the only number that matters
    const teams = game.teams || {};
    world.append(el('div', { class: 'tugplate red' },
                      `${(teams.red || {}).name || 'Crimson'} · ${Math.max(0, 100 + rope)} to go`),
                 el('div', { class: 'tugplate blue' },
                      `${(teams.blue || {}).name || 'Cobalt'} · ${Math.max(0, 100 - rope)} to go`));
    world.append(el('div', { class: 'tugend', style: 'left:6%' }),
                 el('div', { class: 'tugend', style: 'right:6%' }),
                 el('div', { class: 'tugmid' }),
                 el('div', { class: 'tugline' }));
    // -100 is all the way to the red end, +100 all the way to the blue
    world.append(el('div', { class: 'tugmark ' + (rope === 0 ? 'red' : leading),
                             style: `left:${50 + rope * 0.42}%` }));
    ['red', 'blue'].forEach((side) => {
      const mine = game.players.filter(p => p.team === side);
      mine.slice(0, 6).forEach((p, i) => {
        const from = side === 'red' ? 8 : 92;
        const way = side === 'red' ? 1 : -1;
        const node = el('div', { class: 'figure', 'data-id': p.id,
          style: `left:${from + way * i * 6}%;bottom:20%;margin-left:-17px` });
        node.append(el('div', { class: 'shadow' }),
                    el('div', { class: 'body', html: Sprite.face(p.avatar, 54) }),
                    el('div', { class: 'tag' }, p.name));
        world.append(node);
      });
    });
    if (!game.players.length) world.append(el('p', { class: 'faint tiny' }, 'Nobody on the rope yet.'));
  });
}

/* Piles of gold, and whatever the last chest did to somebody. The callout is the
   whole game: a robbery nobody sees is not worth playing for. */
function heistBoard() {
  const richest = Math.max(1, ...game.players.map(p => p.coins || 0));
  const box = el('div', { class: 'piles' });
  game.players.slice(0, 10).forEach((p, i) => {
    const pile = el('div', { class: 'pile', 'data-id': p.id });
    const heap = el('div', { class: 'heap' });
    const stacked = Math.max(0, Math.round((p.coins || 0) / richest * 9));
    for (let n = 0; n < stacked; n++) {
      heap.append(el('i', { class: 'coin', style: `--w:${52 - n * 3}px` }));
    }
    pile.append(el('span', { class: 'mini-face', html: Sprite.face(p.avatar, 34) }),
                heap,
                el('b', { class: 'amt' }, String(p.coins || 0)),
                el('span', { class: 'who' }, p.name),
                el('span', { class: 'say' }, p.chest || ''));
    box.append(pile);
  });
  if (!game.players.length) box.append(el('p', { class: 'faint tiny' }, 'No robbers yet.'));
  return box;
}

/* Everybody's set, with the gaps showing. A child can see at a glance how close
   they are and, more to the point, how close everybody else is. */
function cardTable() {
  const all = ['star', 'moon', 'leaf', 'flame', 'drop', 'bolt', 'gem', 'crown'];
  const box = el('div', { class: 'sets' });
  game.players.slice(0, 12).forEach((p) => {
    const row = el('div', { class: 'setrow', 'data-id': p.id });
    const hand = el('div', { class: 'hand' });
    const held = p.cards || [];
    all.forEach((c) => {
      const has = held.includes(c);
      hand.append(el('i', { class: 'swap' + (has ? '' : ' gap'),
                            html: has ? Sprite.icon(CARD_ICON[c], 18, CARD_COLOUR[c]) : '' }));
    });
    row.append(el('span', { class: 'nm' }, p.name), hand);
    if (p.spares) row.append(el('span', { class: 'spare' }, `${p.spares} spare`));
    box.append(row);
  });
  if (!game.players.length) box.append(el('p', { class: 'faint tiny' }, 'No collectors yet.'));
  return box;
}
const CARD_ICON = { star: 'star', moon: 'moon', leaf: 'leaf', flame: 'flame',
                    drop: 'drop', bolt: 'bolt', gem: 'gem', crown: 'crown' };
const CARD_COLOUR = { star: '#FFC53D', moon: '#8C7BB8', leaf: '#12BE8E', flame: '#FF7A45',
                      drop: '#2BA8FF', bolt: '#F4364C', gem: '#7C4DFF', crown: '#E5A02A' };

/* Volcano Climb. A wall seen from the side rather than a floor seen from above,
 * because the whole game is one axis — how high you are — and the lava is a line
 * across it that everybody can see coming.
 *
 * Everything is placed as a percentage of the highest climber, so the wall
 * rescales as the room climbs and the leader is always near the top. That means
 * the lava line appears to *chase*, which is what it is doing. */
function volcanoWall() {
  const highest = Math.max(40, game.lava || 0, ...game.players.map(p => p.height || 0));
  const up = (n) => Math.max(2, Math.min(92, (n || 0) / highest * 88 + 4));
  const wall = el('div', { class: 'wall3d' });
  wall.append(el('div', { class: 'rock' }),
              el('div', { class: 'lava', style: `height:${up(game.lava)}%` },
                 el('span', { class: 'lip' }),
                 el('span', { class: 'lvl' }, 'Lava · ' + Math.round(game.lava || 0))));

  game.players.slice(0, 14).forEach((p, i) => {
    const lane = 5 + (i % 7) * 13.5 + (i > 6 ? 6 : 0);
    wall.append(el('div', { class: 'climber' + (p.safe ? '' : ' caught') + (i === 0 ? ' lead' : ''),
      'data-id': p.id, style: `left:${lane}%;bottom:${up(p.height)}%` },
      el('span', { class: 'mini-face', html: Sprite.face(p.avatar, 46) }),
      el('span', { class: 'tag' }, `${p.name} · ${Math.round(p.height || 0)}`)));
  });
  if (!game.players.length) wall.append(el('p', { class: 'faint tiny' }, 'Nobody on the wall yet.'));
  return wall;
}

/* Factory. What matters here is not where anybody is standing but what they have
 * built, so this is a shop floor: a row of machines per player, and the payout
 * they made last round said out loud. */
function factoryFloor() {
  const box = el('div', { class: 'floorplan' });
  game.players.slice(0, 12).forEach((p, i) => {
    const line = el('div', { class: 'bay' + (i === 0 ? ' lead' : ''), 'data-id': p.id });
    const shed = el('div', { class: 'sheds' });
    for (let n = 0; n < Math.min(10, p.machines || 0); n++) {
      shed.append(el('i', { class: 'machine', style: `animation-delay:${n * 90}ms`,
                            html: Sprite.icon('bricks', 16, '#1B1233') }));
    }
    if (!p.machines) shed.append(el('span', { class: 'faint tiny' }, 'no machines yet'));
    line.append(
      el('span', { class: 'mini-face', html: Sprite.face(p.avatar, 40) }),
      el('span', { class: 'nm' }, p.name),
      shed,
      el('span', { class: 'takings' }, `${p.coins || 0}`,
         p.output ? el('em', {}, `+${p.output}/round`) : ''));
    box.append(line);
  });
  if (!game.players.length) box.append(el('p', { class: 'faint tiny' }, 'Nobody has opened a factory yet.'));
  return box;
}

/* Fishing Frenzy. Three bands of water running away from the camera — the
 * shallows nearest, the deep furthest — and everybody standing in the band they
 * cast into, so the room can see who is gambling. */
function fishingLake() {
  const BANDS = [['shallows', 'The shallows', 14], ['channel', 'The channel', 45], ['deep', 'The deep', 76]];
  return stage((world, floor) => {
    floor.classList.add('water');
    BANDS.forEach(([id, label, y]) => {
      floor.append(el('div', { class: 'band', style: `top:${100 - y - 12}%` },
        el('span', {}, label)));
    });
    game.players.slice(0, 14).forEach((p, i) => {
      const band = BANDS.find(b => b[0] === (p.target || 'shallows')) || BANDS[0];
      const x = 8 + (i % 7) * 12.5;
      world.append(standing(p, x, band[2] + (i > 6 ? 7 : 0),
        `${p.name} · ${p.weight || 0}`, i === 0 ? ' lead' : ''));
    });
    if (!game.players.length) world.append(el('p', { class: 'faint tiny' }, 'Nobody has cast a line yet.'));
  });
}

function treasureBoard() {
  const richest = Math.max(1, ...game.players.map(p => p.coins || 0));
  return stage((world) => {
    game.players.slice(0, 12).forEach((p, i) => {
      const x = 8 + (i % 6) * 16;
      const y = 12 + Math.floor(i / 6) * 34 + (p.coins || 0) / richest * 18;
      world.append(standing(p, x, y, `${p.name} · ${p.coins || 0}`, i === 0 ? ' lead' : ''));
    });
    if (!game.players.length) world.append(el('p', { class: 'faint tiny' }, 'No treasure hunters yet.'));
  });
}

/* Snowball Fight. The two forts are the whole story, so they are what the room
 * looks at: the throwers stand behind their own wall and the blocks come off the
 * other one. A block that has been knocked off is left as an empty socket rather
 * than removed, so a class can see how close they are without counting. */
/* How many blocks each fort had when the board was last drawn, so a fort that has
 * just been hit can be shown being hit rather than simply being smaller. */
let lastFort = {};

function snowField() {
  const teams = game.teams || {};
  const hitNow = {};
  ['red', 'blue'].forEach((side) => {
    const now = (teams[side] || {}).blocks;
    hitNow[side] = lastFort[side] !== undefined && now !== undefined && now < lastFort[side];
    if (now !== undefined) lastFort[side] = now;
  });
  const wrap = stage((world) => {
    ['red', 'blue'].forEach((side) => {
      const team = teams[side] || { blocks: 0, max: 0, name: side };
      const mine = game.players.filter(p => p.team === side);
      // the forts face each other across the middle, each team behind its own
      const wall = side === 'red' ? 30 : 70;
      const home = side === 'red' ? 12 : 88;
      const fort = el('div', { class: 'fort' + (team.blocks <= 0 ? ' fallen' : ''),
        'data-side': side, style: `left:${wall}%;bottom:52%;margin-left:-63px` });
      const rows = Math.max(1, Math.ceil((team.max || 1) / 3));
      for (let r = 0; r < rows; r++) {
        const row = el('div', { class: 'row' });
        for (let c = 0; c < 3; c++) {
          const nth = r * 3 + c;
          if (nth >= (team.max || 0)) continue;
          row.append(el('i', { class: 'brick' + (nth < team.blocks ? '' : ' gone'),
                               style: `--c:${side === 'red' ? '#F4364C' : '#4F6BFF'}` }));
        }
        fort.append(row);
      }
      fort.append(el('div', { class: 'plate' },
        team.blocks > 0 ? `${team.name} · ${team.blocks} left` : `${team.name} fort is down`));
      world.append(fort);

      mine.slice(0, 6).forEach((p, i) => {
        // the throwers stand behind their own wall, out towards their own side
        const spread = (i - (Math.min(mine.length, 6) - 1) / 2) * 11;
        world.append(standing(p, Math.max(4, Math.min(96, home + spread)), 10,
                              `${p.name} · ${p.hits || 0}`, i === 0 ? ' lead' : ''));
      });
    });
    // a snowball crosses the floor towards whichever fort just lost a block
    ['red', 'blue'].forEach((side) => {
      if (hitNow[side]) world.append(el('div', { class: 'snowball at-' + side }));
    });
    if (!game.players.length) world.append(el('p', { class: 'faint tiny' }, 'No throwers yet.'));
  });

  const bars = el('div', { class: 'card pad', style: 'margin-top:12px' });
  ['red', 'blue'].forEach((side) => {
    const team = teams[side] || { blocks: 0, max: 1, name: side, score: 0 };
    bars.append(el('div', { class: 'spread', style: 'margin-bottom:8px' },
      el('strong', {}, team.name),
      el('span', { class: 'tiny faint' }, `${team.blocks} of ${team.max || 0} blocks standing`)),
      el('div', { class: 'hpbar' },
        el('i', { style: `width:${team.max ? team.blocks / team.max * 100 : 0}%;` +
                         `background:${side === 'red' ? 'linear-gradient(90deg,#ff4d5e,#ff9b6a)'
                                                      : 'linear-gradient(90deg,#4f6bff,#22d3ee)'}` })));
  });
  const box = el('div', {});
  box.append(wrap, bars);
  return box;
}

/* Balloon Drop. Everyone is on the same floor and the balloons above their heads
 * are the score that matters: a child who has lost all three is greyed out where
 * they stand rather than taken off the board, because being knocked out in front
 * of the class is only bearable if you can still see yourself in the game. */
function balloonField() {
  return stage((world) => {
    const shown = game.players.slice(0, 12);
    shown.forEach((p, i) => {
      const x = 8 + (i % 6) * 16.5;
      const y = 14 + Math.floor(i / 6) * 34;
      const out = (p.balloons || 0) <= 0;
      const node = el('div', { class: 'figure' + (out ? ' knocked' : '') + (i === 0 && !out ? ' lead' : ''),
        'data-id': p.id, style: `left:${x}%;bottom:${y}%;margin-left:-26px` });
      const strip = el('div', { class: 'balloons' });
      for (let b = 0; b < 3; b++) {
        strip.append(el('i', { class: b < (p.balloons || 0) ? '' : 'popped',
                               style: `--c:${KART_COLOURS[(i + b) % 6]}` }));
      }
      node.append(el('div', { class: 'shadow' }), strip,
                  el('div', { class: 'mini-face', html: Sprite.face(p.avatar, 58) }),
                  el('div', { class: 'tag' }, out ? `${p.name} · out` : `${p.name} · ${p.score}`));
      world.append(node);
    });
    if (!shown.length) world.append(el('p', { class: 'faint tiny' }, 'Nobody has joined yet.'));
  });
}

function bossArena() {
  const boss = game.boss || { hp: 1, max: 1, name: 'The Boss', classHp: 100, classMax: 100 };
  const hurt = boss.hp < (lastBossHp ?? boss.hp);
  lastBossHp = boss.hp;

  const wrap = el('div', { class: 'boss-wrap' });
  wrap.append(stage((world) => {
    const beast = el('div', { class: 'figure boss-figure' + (hurt ? ' hurt' : ''),
      style: 'left:50%;bottom:72%;margin-left:-60px' });
    beast.append(el('div', { class: 'shadow', style: 'width:120px;height:14px' }),
                 el('div', { class: 'mini-face',
                             html: Sprite.icon(boss.hp > 0 ? 'dragon' : 'ghost', 120, '#7C4DFF') }),
                 el('div', { class: 'tag' }, `${boss.name} · ${boss.hp} HP`));
    world.append(beast);
    game.players.slice(0, 10).forEach((p, i) => {
      const x = 8 + i * (84 / Math.max(1, Math.min(10, game.players.length)));
      world.append(standing(p, x, 8, `${p.name} · ${p.score}`, i === 0 ? ' lead' : ''));
    });
  }));

  const bars = el('div', { class: 'card pad', style: 'margin-top:12px' });
  bars.append(el('div', { class: 'spread' },
      el('strong', {}, boss.hp > 0 ? boss.name : `${boss.name} is defeated`),
      el('span', { class: 'tiny faint' }, `${boss.hp} / ${boss.max} HP`)),
    el('div', { class: 'bar' }, el('i', { style: `width:${Math.max(0, boss.hp / boss.max * 100)}%` })),
    el('p', { class: 'tiny', style: 'margin-top:12px;font-weight:800' }, `Class health · ${boss.classHp}%`),
    el('div', { class: 'classbar' }, el('i', { style: `width:${boss.classHp}%` })));
  wrap.append(bars);
  return wrap;
}
let lastBossHp = null;

const unitFor = (p) => game.mode === 'kart' ? `${p.distance || 0}m`
  : game.mode === 'heist' ? `${p.coins || 0} gold`
  : game.mode === 'cards' ? `${(p.cards || []).length}/8 cards`
  : game.mode === 'tug' ? `pulled ${p.hits || 0}`
  : game.mode === 'tower' ? `${p.blocks || 0} blocks`
  : game.mode === 'treasure' ? `${p.coins || 0} coins`
  : game.mode === 'snow' ? `${p.hits || 0} blocks`
  : game.mode === 'balloon' ? `${p.score} · ${p.balloons || 0} left`
  : game.mode === 'volcano' ? `${Math.round(p.height || 0)} up` + (p.safe ? '' : ' · caught')
  : game.mode === 'factory' ? `${p.coins || 0} · ${p.machines || 0} machine${p.machines === 1 ? '' : 's'}`
  : game.mode === 'fishing' ? `${p.weight || 0} caught`
  : String(p.score);

/* Who climbed and who slipped. The comparison is against where everyone stood at
 * the previous question, captured once when that question's result first appeared:
 * comparing the current standings with themselves would always read "no change",
 * and re-capturing on every render would wipe the arrows a second after they showed. */
let prevRanks = {}, thisRanks = null, ranksFor = -1;
function rankBaseline() {
  if (game.state === 'reveal' && ranksFor !== game.index) {
    if (thisRanks) prevRanks = thisRanks;          // last question's finish is the new baseline
    thisRanks = {};
    game.players.forEach((p, i) => { thisRanks[p.id] = i; });
    ranksFor = game.index;
  }
  return prevRanks;
}

function leaderboard({ from = 0, title, rows = 8 } = {}) {
  const card = el('div', { class: 'card pad', style: 'margin-top:14px' },
    el('h3', { style: 'font-size:1.05rem;margin-bottom:14px' },
      title || (game.mode === 'boss' ? 'Damage dealt' : 'Leaderboard')));
  const lb = el('div', { class: 'lb' });
  const baseline = rankBaseline();
  game.players.slice(from, from + rows).forEach((p, offset) => {
    const i = from + offset;
    const was = baseline[p.id];
    const moved = was === undefined ? 0 : was - i;
    lb.append(el('div', { class: 'lb-row' + (i === 0 ? ' top' : ''), 'data-id': p.id },
      el('span', { class: 'rank' }, '#' + (i + 1)),
      el('span', { class: 'move ' + (moved > 0 ? 'up' : moved < 0 ? 'down' : 'same') },
         moved > 0 ? '▲' + moved : moved < 0 ? '▼' + (-moved) : '·'),
      el('span', { class: 'mini-face', html: Sprite.face(p.avatar, 30) }),
      el('span', {}, p.name),
      p.streak >= 3 ? el('span', { class: 'chip warn' },
         el('span', { class: 'mini-face', html: Sprite.icon('flame', 14) }), String(p.streak)) : '',
      p.answered && game.state === 'question' ? el('span', { class: 'chip live' }, 'in') : '',
      el('span', { class: 'score' }, unitFor(p))));
  });
  if (game.players.length <= from) lb.append(el('p', { class: 'faint tiny' }, 'Nobody else.'));
  card.append(lb);
  return card;
}

function arena() {
  const wrap = el('div', {});
  const sides = { red: game.players.filter(p => p.team === 'red'),
                  blue: game.players.filter(p => p.team === 'blue') };
  const maxHp = (side) => Math.max(100, 100 * sides[side].length);

  wrap.append(stage((world, floor) => {
    floor.append(el('div', { class: 'line', style: 'top:50%;background:rgba(255,255,255,.3)' }));
    ['red', 'blue'].forEach((side) => {
      const back = side === 'red';
      sides[side].slice(0, 8).forEach((p, i) => {
        const x = 10 + i * (80 / Math.max(1, sides[side].length));
        const node = standing(p, x, back ? 66 : 8,
          p.down ? `${p.name} · down` : `${p.name} · ${p.hp}`,
          (p.down ? ' downed' : '') + (lastHp[p.id] !== undefined && p.hp < lastHp[p.id] ? ' hit' : ''));
        lastHp[p.id] = p.hp;
        world.append(node);
        // the shot that just landed, drawn flat on the floor from shooter to target
        if (game.state === 'reveal' && p.correct && !p.down) {
          const foes = sides[side === 'red' ? 'blue' : 'red'];
          const aim = foes.find(f => f.id === p.target) || foes[0];
          if (aim) {
            const j = foes.indexOf(aim);
            const tx = 10 + j * (80 / Math.max(1, foes.length));
            const ty = back ? 8 : 66;
            const dx = tx - x, dy = (back ? 66 : 8) - ty;      // in floor percentages
            const angle = Math.atan2(dy * 0.42, dx) * 180 / Math.PI;   // the floor is wider than deep
            world.append(el('div', { class: 'beam', style:
              `left:${x}%;bottom:${(back ? 68 : 10)}%;width:${Math.hypot(dx, dy * 0.42)}%;` +
              `--a:${angle}deg;transform:rotate(${angle}deg)` }));
          }
        }
      });
    });
  }));

  const bars = el('div', { class: 'card pad', style: 'margin-top:12px' });
  ['red', 'blue'].forEach(side => {
    const team = game.teams[side];
    bars.append(el('div', { class: 'spread', style: 'margin-top:6px' },
      el('strong', {}, team.name + (side === 'red' ? '' : '')),
      el('span', { class: 'tiny faint' }, `${Math.max(0, team.hp)} HP`)));
    bars.append(el('div', { class: 'hpbar' }, el('i', {
      style: `width:${Math.max(0, team.hp / maxHp(side) * 100)}%;background:${side === 'red'
        ? 'linear-gradient(90deg,#ff4d5e,#ff9b6a)' : 'linear-gradient(90deg,#4f6bff,#22d3ee)'}` })));
  });
  wrap.append(bars);

  const feed = el('div', { class: 'feed' });
  (game.lastEvents || []).slice().reverse().forEach(line => feed.append(el('div', {}, line)));
  if (!game.lastEvents?.length) feed.append(el('div', { class: 'faint' },
    'Line up a shot in the countdown, then answer to fire it.'));
  wrap.append(feed);
  return wrap;
}

/* ── final ─────────────────────────────────────── */
/* Third, then second, then first: the order a hall announces them in, each one
 * stepping into a light. The winner's name is held back until the end. */
function announce() {
  const crown = document.querySelector('.crown');
  const line = crown && crown.querySelector('h1');
  const winner = line ? line.textContent : '';
  if (line) { line.textContent = 'And the places are'; crown.classList.add('hush'); }

  const step = (place, delay) => setTimeout(() => {
    const node = document.querySelector(`.stand[data-place="${place}"]`);
    if (node) node.classList.add('up');
    if (place === 1) {
      if (line) { line.textContent = winner; crown.classList.remove('hush'); }
      confetti(160);
    }
  }, delay);
  step(3, 500); step(2, 1900); step(1, 3300);
}

function overView() {
  const top = game.players.slice(0, 3);
  const root = el('div', { class: 'finale' });

  let headline = 'Final scores', sub = game.quizTitle;
  if (game.mode === 'laser') {
    const red = game.teams.red, blue = game.teams.blue;
    const winner = red.hp === blue.hp ? null : (red.hp > blue.hp ? red : blue);
    headline = winner ? `${winner.name} wins` : 'A draw';
    sub = `${red.name} ${Math.max(0, red.hp)} HP · ${blue.name} ${Math.max(0, blue.hp)} HP`;
  } else if (game.mode === 'snow') {
    // a team game is decided by whose fort is still standing, not by who scored most
    const red = game.teams.red, blue = game.teams.blue;
    const winner = red.blocks === blue.blocks ? null : (red.blocks > blue.blocks ? red : blue);
    headline = winner ? `${winner.name} wins` : 'A draw';
    sub = `${red.name} ${Math.max(0, red.blocks)} blocks · ${blue.name} ${Math.max(0, blue.blocks)} blocks`;
  } else if (game.mode === 'balloon') {
    const floating = game.players.filter(p => (p.balloons || 0) > 0);
    headline = top[0] ? `${top[0].name} wins` : 'Final scores';
    sub = floating.length
      ? `${floating.length} still floating · ${top[0] ? top[0].score + ' points' : ''}`.trim()
      : 'Every balloon popped';
  } else if (game.mode === 'boss') {
    const boss = game.boss || { hp: 0, name: 'The boss' };
    headline = boss.hp === 0 ? `The class beat ${boss.name}` : `${boss.name} survived`;
    sub = boss.hp === 0 ? 'Every right answer landed a blow.' : `${boss.hp} HP left. Closer next lesson.`;
  } else if (top[0]) {
    const win = { kart: `${top[0].distance}m driven`, tower: `${top[0].blocks} blocks high`,
                  heist: `${top[0].coins} gold`, cards: `${(top[0].cards || []).length} of 8 cards`,
                  tug: `pulled ${top[0].hits}`,
                  treasure: `${top[0].coins} coins`,
                  volcano: `${Math.round(top[0].height || 0)} up the wall`,
                  factory: `${top[0].coins} banked from ${top[0].machines || 0} machines`,
                  fishing: `${top[0].weight || 0} caught` }[game.mode];
    headline = `${top[0].name} wins`;
    sub = win || `${top[0].score} points`;
  }
  // announce() rewrites this line as the places go up, so the update pass leaves
  // it alone; otherwise the headline snapped back to the winner a second in
  const crown = el('div', { class: 'crown', 'data-static': '' });
  crown.append(el('h1', {}, headline), el('p', {}, sub));
  root.append(crown);

  // announce() owns this once it is on screen: data-static keeps the update pass
  // from stripping the classes that light each place up
  const podium = el('div', { class: 'podium', 'data-static': '' });
  const scene = el('div', { class: 'set' },
    el('div', { class: 'backdrop' }), el('div', { class: 'ground' }));
  const hall = el('div', { class: 'hall' });
  podium.append(scene, hall);

  // each place is a block standing on the floor: the CSS puts them where they go,
  // so the order they are built in does not matter
  [top[0], top[1], top[2]].forEach((p, i) => {
    if (!p) return;
    const place = i + 1;
    const tint = place === 1 ? '#E8A400' : place === 2 ? '#93A0BC' : '#B4713A';
    hall.append(el('div', { class: 'stand p' + place, 'data-place': place },
      el('div', { class: 'spot' }),
      el('div', { class: 'medal', html: Sprite.icon('medal', 34, tint) }),
      el('div', { class: 'who-box' },
        el('div', { class: 'mini-face', html: Sprite.face(p.avatar, place === 1 ? 94 : 74) })),
      el('div', { class: 'block' },
        el('div', { class: 'front' },
          el('div', { class: 'num' }, String(place)),
          el('div', { class: 'plate' },
            el('div', { class: 'who' }, p.name),
            el('div', { class: 'pts' }, game.mode === 'laser' ? p.score + ' dmg' : unitFor(p)))),
        el('div', { class: 'top' }),
        el('div', { class: 'side' }))));
  });
  root.append(podium);

  const rest = el('div', { class: 'rest' });
  if (game.players.length > 3) rest.append(leaderboard({ from: 3, title: 'Everyone else' }));
  root.append(rest);

  root.append(el('div', { class: 'row', style: 'justify-content:center;gap:10px;flex:none' },
    el('a', { class: 'btn', href: '/quiz' }, 'Back to quizzes'),
    el('button', { class: 'btn primary', onclick: () => location.href = '/studio?id=' + (game.quizId || '') }, 'Edit this quiz')));
  return root;
}

$('#end').onclick = () => {
  // Same rule as Start: never a dead button. A board that cannot end the game
  // says so when asked, rather than refusing quietly.
  if (!hostToken) {
    return toast('End this game from the device that made it, or make a new one', 'bad');
  }
  const close = modal(`
    <h2 style="margin-bottom:6px">End the game?</h2>
    <p class="muted" style="margin-bottom:20px">Everyone stops where they are and the final scores go up.</p>
    <div class="row" style="justify-content:flex-end;gap:10px">
      <button class="btn" id="no">No, keep playing</button>
      <button class="btn primary" id="yes">Yes, end it</button>
    </div>`, {
    onMount(box) {
      box.querySelector('#no').onclick = () => close();
      box.querySelector('#yes').onclick = async () => {
        close();
        try { await api(`/games/${pin}/end`, { method: 'POST', body: { hostToken } }); }
        catch (err) { toast(err.message, 'bad'); }
      };
    }
  });
};

/* The board must survive a dropped wifi packet: only a 404 means the game has
 * really gone, anything else is worth asking again for. */
let retries = 0;
function refresh() {
  return api(`/games/${pin}`).then(state => { retries = 0; apply(state); }).catch(err => {
    if (err && err.status === 404) return fail();
    retries += 1;
    if (!game) $('#stage').innerHTML = `<div class="card pad empty"><span class="em">${Sprite.icon('ghost', 48)}</span>
      Reconnecting…</div>`;
    setTimeout(refresh, Math.min(8000, 600 * retries));
  });
}
refresh();
connect();
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('online', refresh);
</script>
</body>
</html>
