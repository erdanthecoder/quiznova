<style>
.stage{max-width:1300px;margin:0 auto;padding:24px 22px 60px}

/* lobby */
.pin-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:center;padding:34px}
.pin-big{font-size:clamp(3.2rem,9vw,5.6rem);font-weight:900;letter-spacing:.16em;line-height:1;
  background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.join-url{font-size:1.15rem;font-weight:700}
.mini-face{display:inline-flex;line-height:0;vertical-align:middle}
.mode-badge{display:inline-flex;gap:9px;align-items:center;padding:9px 16px;border-radius:99px;font-weight:750;font-size:.9rem}
.mode-normal{background:rgba(124,92,255,.18);border:1px solid rgba(124,92,255,.45);color:#cfc4ff}
.mode-laser{background:rgba(255,77,94,.16);border:1px solid rgba(255,77,94,.45);color:#ffb3ba}

.players{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.pchip{display:flex;gap:9px;align-items:center;padding:9px 15px;border-radius:99px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);font-weight:650;animation:popIn .35s var(--ease) both;font-size:.92rem}
@keyframes popIn{from{opacity:0;transform:scale(.8) translateY(8px)}}
.pchip.red{border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.12)}
.pchip.blue{border-color:rgba(79,107,255,.5);background:rgba(79,107,255,.12)}
.pchip .av{font-size:1.15rem}

/* the board, sized for the back row of a classroom */
.board,.lobby{display:flex;flex-direction:column;gap:14px;height:calc(100vh - 128px);min-height:520px}
/* the waiting room fills whatever the join bar and the buttons leave */
.lobby .waiting{flex:1;min-height:0;display:flex}
.lobby .waiting:empty{flex:0;min-height:0}
.lobby .waiting > .stage3d{flex:1;min-height:180px}
.joinbar{flex:none;display:flex;align-items:center;gap:30px;background:#fff;color:#161036;border:3px solid #0b0718;
  border-radius:24px;padding:16px 26px;box-shadow:0 13px 0 -3px rgba(0,0,0,.5)}
.lobby-art{flex:none;line-height:0;border-radius:16px;overflow:hidden;border:3px solid #0b0718}
.lobby-art svg{display:block}
.joinbar .lab{font-size:.66rem;letter-spacing:.17em;text-transform:uppercase;font-weight:800;opacity:.5}
.joinbar .where{font-size:clamp(.95rem,1.6vw,1.35rem);font-weight:850;line-height:1.18;word-break:break-word}
.pinhuge{font-size:clamp(2.4rem,6.6vw,5rem);font-weight:900;letter-spacing:.1em;line-height:1.05}
.qrbox{flex:none;background:#fff;border-radius:12px}
.crowd{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px}
.face{display:flex;align-items:center;gap:10px;padding:11px 20px;border-radius:99px;font-weight:800;
  font-size:clamp(1rem,1.4vw,1.3rem);background:rgba(255,255,255,.08);border:2px solid var(--line);
  animation:popIn .35s var(--ease) both}
.face.red{border-color:rgba(255,77,94,.55);background:rgba(255,77,94,.14)}
.face.blue{border-color:rgba(79,107,255,.55);background:rgba(79,107,255,.14)}
.face .av{font-size:1.5rem}
.nobody{margin:auto;text-align:center;opacity:.6;font-size:1.1rem}
.lobbybar{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ask{background:#fff;color:#161036;border:3px solid #0b0718;border-radius:24px;padding:20px 28px;
  display:flex;align-items:center;gap:24px;box-shadow:0 13px 0 -3px rgba(0,0,0,.5)}
.ask h1{flex:1;text-align:center;font-size:clamp(1.6rem,4.2vw,3.4rem);line-height:1.14;
  font-weight:850;letter-spacing:-.02em;margin:0}
.dial{position:relative;flex:none;width:clamp(80px,7.4vw,116px);aspect-ratio:1}
.dial > svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .num svg{width:auto;height:auto;transform:none}
.dial .num{position:absolute;inset:0;display:grid;place-items:center;
  font-size:clamp(1.7rem,2.6vw,2.6rem);font-weight:900;color:#161036}
.dial.low .num{color:#F4364C}
.dial.low{animation:pulseLow .9s infinite}
@keyframes pulseLow{50%{transform:scale(1.06)}}
.tally{flex:none;text-align:center;min-width:88px}
.tally b{display:block;font-size:clamp(1.6rem,2.4vw,2.4rem);font-weight:900;line-height:1}
.tally span{font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;opacity:.5;font-weight:800}

/* The answers are four buttons lying on a table, not four rectangles on a wall.
 * The grid is one plane tilted away from the camera, so the far row is genuinely
 * smaller and the near row genuinely larger — and each tile is thick, with a lit
 * top edge and a riser in its own colour underneath.
 *
 * The tilt is deliberately small. This screen's first job is to be readable from
 * the back of a room; anything past about eight degrees starts costing letters. */
.board{perspective:1700px;perspective-origin:50% 34%}
.grid4{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:15px;min-height:0;
  transform:rotateX(6deg) scale(.985);transform-origin:50% 50%;transform-style:preserve-3d;
  padding-bottom:10px}
.grid4.one{grid-template-columns:1fr}
.tile{position:relative;display:flex;align-items:center;gap:20px;padding:18px 26px;border-radius:22px;
  background:var(--c);color:#fff;border:3px solid rgba(0,0,0,.42);overflow:hidden;
  box-shadow:0 12px 0 -2px rgba(0,0,0,.5),0 26px 30px -14px rgba(0,0,0,.6),
             inset 0 3px 0 rgba(255,255,255,.3),inset 0 -14px 22px -14px rgba(0,0,0,.45);
  box-shadow:0 12px 0 -2px color-mix(in srgb,var(--c) 52%,#07040f),
             0 26px 30px -14px rgba(0,0,0,.6),
             inset 0 3px 0 rgba(255,255,255,.3),inset 0 -14px 22px -14px rgba(0,0,0,.45);
  transition:opacity .4s,transform .4s,filter .4s,box-shadow .4s;
  animation:tileIn .34s var(--ease) both}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) translateZ(-60px)}}
.tile .sh{flex:none;width:clamp(34px,3vw,52px);display:grid;place-items:center}
.tile .sh svg{width:100%;height:auto;fill:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.tile .lbl{flex:1;font-size:clamp(1.05rem,2.1vw,2rem);font-weight:800;line-height:1.16}
.tile .n{flex:none;font-size:clamp(.95rem,1.5vw,1.5rem);font-weight:900;opacity:.92}
.tile .fill{position:absolute;left:0;bottom:0;height:9px;width:0;background:rgba(255,255,255,.9);
  transition:width .85s var(--ease)}
.tile .tick{flex:none;font-size:clamp(1.1rem,1.7vw,1.7rem);opacity:0;transform:scale(.4);transition:.4s var(--ease)}
/* on the reveal the wrong answers sink into the table and the right one comes
   up off it — depth doing the work a colour change used to do on its own */
.tile.miss{opacity:.3;transform:translateZ(-46px);filter:saturate(.3) brightness(.8);
  box-shadow:0 3px 0 -1px rgba(0,0,0,.5)}
.tile.hit{transform:translateZ(38px);animation:hitPop .55s var(--ease)}
.tile.hit .tick{opacity:1;transform:scale(1)}
@keyframes hitPop{0%{transform:translateZ(0)}45%{transform:translateZ(70px)}100%{transform:translateZ(38px)}}
.board.result .grid4{flex:none;grid-auto-rows:minmax(50px,auto)}
.board.result .ask{padding:12px 24px}
.board.result .ask h1{font-size:clamp(1.2rem,2.6vw,2.1rem)}
.board.result .tile{padding:12px 22px}
.board .rest{flex:none}
.board.result .rest{flex:1;min-height:0;overflow:auto;padding-bottom:4px}
.why{margin:0;font-size:1rem;font-weight:600;opacity:.8;text-align:center}

/* ── the arena, in three dimensions ───────────────────────
 * One floor, tilted away from the viewer, with everything standing on it.
 * Each figure is counter-rotated by the same angle so it stands upright while
 * the ground runs away into the distance, which is what makes it read as depth
 * rather than as a flat picture of depth. */
/* The hall the floor stands in. This is painted on the container itself rather
 * than as a child layer: .stage3d carries the perspective, so any child of it
 * with a transform joins one 3D context where the browser sorts by depth and
 * z-index stops meaning anything. A background cannot lose that argument. */
.stage3d{position:relative;height:100%;min-height:300px;perspective:1100px;perspective-origin:50% 34%;
  border-radius:26px;overflow:hidden;
  background:
    radial-gradient(66% 52% at 50% 47%,rgba(124,77,255,.32),rgba(8,5,18,0) 74%),
    linear-gradient(180deg,#0C0820 0%,#1C1442 43%,#0A0718 46%,#07040F 100%)}
.world{position:absolute;inset:6% 4% 4%;transform-style:preserve-3d;transform:rotateX(58deg);border-radius:26px}
.floor{position:absolute;inset:0;border-radius:26px;overflow:hidden;
  /* the far end of the floor fades into the hall, so the ground runs out of
     sight instead of stopping at a hard edge */
  background:linear-gradient(0deg,rgba(9,6,22,0) 40%,rgba(9,6,22,.8) 96%),
             var(--floor,linear-gradient(180deg,#2A2547,#151129));
  box-shadow:inset 0 0 90px rgba(0,0,0,.55),0 40px 70px -30px rgba(0,0,0,.9)}
.floor::after{content:'';position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px),
                   linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px);
  background-size:6.25% 12.5%}
.floor .line{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.22)}
.floor .finish{position:absolute;top:0;bottom:0;width:12px;
  background:repeating-linear-gradient(180deg,#fff 0 10px,#241C38 10px 20px)}
.figure{position:absolute;bottom:0;transform-style:preserve-3d;transform:rotateX(-58deg);
  transform-origin:bottom center;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:left .9s var(--ease),bottom .9s var(--ease)}
.figure .tag{font-size:.72rem;font-weight:800;white-space:nowrap;padding:2px 7px;border-radius:99px;
  background:rgba(10,7,20,.72);border:1px solid rgba(255,255,255,.16)}
.figure .shadow{position:absolute;bottom:-4px;width:70%;height:8px;border-radius:50%;
  background:rgba(0,0,0,.45);filter:blur(2px);transform:rotateX(58deg)}
.figure.lead .tag{background:var(--sun);color:#1b1330;border-color:#0b0718}
.pillar{width:34px;border-radius:6px 6px 0 0;background:var(--c,#7C4DFF);
  box-shadow:inset -6px 0 0 rgba(0,0,0,.22),0 0 18px rgba(0,0,0,.35);transition:height .8s var(--ease)}
.beam{position:absolute;height:7px;border-radius:4px;transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(255,197,61,.25),#FFC53D,#FF7A45);
  box-shadow:0 0 22px rgba(255,197,61,.85);animation:fire .45s var(--ease) both}
@keyframes fire{from{transform:scaleX(.05) rotate(var(--a));opacity:0}}

/* snowball fight: two forts on the floor, losing blocks as they are hit */
.fort{position:absolute;bottom:0;transform-style:preserve-3d;transform:rotateX(-58deg);
  transform-origin:bottom center;display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.fort .row{display:flex;gap:4px}
.fort .brick{width:38px;height:22px;border-radius:4px;background:var(--c,#F4364C);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.35);animation:settle .4s var(--ease) both}
.fort .brick.gone{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px rgba(255,255,255,.16);
  animation:crumble .5s var(--ease) both}
@keyframes settle{from{transform:translateY(-14px);opacity:0}}
@keyframes crumble{from{transform:none;opacity:1}to{transform:translateY(16px) rotate(12deg);opacity:.25}}
.fort .plate{margin-top:7px;font-size:.74rem;font-weight:800;white-space:nowrap;padding:3px 9px;
  border-radius:99px;background:rgba(10,7,20,.75);border:1px solid rgba(255,255,255,.18)}
.fort.fallen{filter:grayscale(.7) brightness(.72)}
 /* The ball's flight is animated on `left`, which resolves against the floor's own
  * width — a percentage inside `translate` would resolve against the ball instead. */
.snowball{position:absolute;bottom:36%;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 0 16px rgba(255,255,255,.85),inset -3px -3px 0 rgba(120,160,200,.35);
  margin-left:-9px;pointer-events:none;transform:rotateX(-58deg)}
.snowball.at-blue{animation:lob-left .85s var(--ease) both}
.snowball.at-red{animation:lob-right .85s var(--ease) both}
@keyframes lob-left{
  0%{left:70%;transform:rotateX(-58deg) translateY(0) scale(.45);opacity:0}
  15%{opacity:1}
  55%{transform:rotateX(-58deg) translateY(-38px) scale(1.2)}
  100%{left:30%;transform:rotateX(-58deg) translateY(0) scale(.85);opacity:0}}
@keyframes lob-right{
  0%{left:30%;transform:rotateX(-58deg) translateY(0) scale(.45);opacity:0}
  15%{opacity:1}
  55%{transform:rotateX(-58deg) translateY(-38px) scale(1.2)}
  100%{left:70%;transform:rotateX(-58deg) translateY(0) scale(.85);opacity:0}}

/* balloon drop: how many each child has left, above their head */
.balloons{display:flex;gap:5px;justify-content:center;align-items:flex-end;margin-bottom:1px;height:34px}
.balloons i{width:19px;height:24px;border-radius:50% 50% 45% 45%;background:var(--c,#F4364C);
  position:relative;animation:sway 2.6s ease-in-out infinite;transform-origin:bottom center;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.16)}
.balloons i::after{content:'';position:absolute;left:50%;top:100%;width:1.5px;height:8px;
  margin-left:-.75px;background:rgba(255,255,255,.35)}
.balloons i:nth-child(2){animation-delay:-.9s}
.balloons i:nth-child(3){animation-delay:-1.8s}
.balloons i.popped{background:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);animation:none;opacity:.45}
.balloons i.popped::after{display:none}
@keyframes sway{50%{transform:rotate(9deg)}}
/* under the waiting room: the same names again, small, in one line of sight */
.crowd.strip{flex:none;max-height:78px;overflow:auto;gap:8px}
.crowd.strip .face{padding:5px 12px;font-size:.92rem;gap:7px;border-width:2px}
.crowd.strip .face .av{font-size:1rem}
/* the lobby: a blook walks in from the back rather than blinking into being */
.figure.arriving{animation:walkOn .6s var(--bounce) both}
@keyframes walkOn{
  from{opacity:0;transform:rotateX(-58deg) translateY(26px) scale(.6)}}
.figure.red .tag{background:rgba(244,54,76,.85);border-color:#7A0F1E}
.figure.blue .tag{background:rgba(79,107,255,.85);border-color:#1E2A6E}
.figure.knocked{filter:grayscale(1) brightness(.62)}
.figure.knocked .tag{background:rgba(10,7,20,.6);color:var(--faint)}

/* ── Volcano Climb: a wall, seen from the side ────────────
 * The one board that is not a floor. The whole game is a single axis, so a
 * top-down arena would be a picture of nothing; a wall with a line coming up it
 * is the game itself. */
.wall3d{position:relative;height:100%;min-height:300px;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,#1A1030 0%,#2A1436 55%,#3A1420 100%)}
.wall3d .rock{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(115deg,rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(65deg,rgba(0,0,0,.35) 1px,transparent 1px);
  background-size:56px 74px,74px 56px}
.wall3d .lava{position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,#FF7A45,#F4364C 40%,#7A0F1E);
  box-shadow:0 -14px 40px rgba(255,122,69,.55);transition:height 1s var(--ease)}
.wall3d .lava .lip{position:absolute;left:0;right:0;top:-7px;height:14px;border-radius:50%;
  background:linear-gradient(180deg,#FFD86B,#FF7A45);filter:blur(2px);
  animation:bubble 2.6s ease-in-out infinite}
@keyframes bubble{50%{transform:translateY(-4px) scaleY(1.25)}}
.wall3d .lava .lvl{position:absolute;right:14px;top:8px;font-size:.74rem;font-weight:900;
  letter-spacing:.05em;color:#3A0A12;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.wall3d .climber{position:absolute;margin-left:-24px;display:flex;flex-direction:column;
  align-items:center;gap:2px;transition:bottom 1s var(--ease);z-index:2}
.wall3d .climber .tag{font-size:.7rem;font-weight:800;white-space:nowrap;padding:2px 7px;
  border-radius:99px;background:rgba(10,7,20,.78);border:1px solid rgba(255,255,255,.16)}
.wall3d .climber.lead .tag{background:var(--sun);color:#1b1330;border-color:#0b0718}
.wall3d .climber.caught{filter:saturate(.4) brightness(.7);animation:flail .7s ease-in-out infinite}
@keyframes flail{50%{transform:translateX(4px) rotate(5deg)}}

/* ── Factory: a shop floor rather than an arena ───────────
 * One line per player, because what is being compared is what they have built,
 * and a row of sheds compares at a glance in a way a scatter of figures does not. */
.floorplan{display:flex;flex-direction:column;gap:9px;overflow:auto;padding-right:2px}
.bay{display:flex;align-items:center;gap:11px;padding:9px 13px;border-radius:16px;
  background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.09)}
.bay.lead{border-color:var(--sun);background:rgba(255,197,61,.12)}
.bay .nm{font-weight:850;font-size:.95rem;min-width:6.5ch;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bay .sheds{flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:30px}
.bay .machine{width:30px;height:26px;border-radius:5px 5px 3px 3px;display:grid;place-items:center;
  background:linear-gradient(180deg,#FFD86B,#E8A400);border:2px solid #7A4F00;
  box-shadow:0 3px 0 #7A4F00;animation:clank 2.4s ease-in-out infinite}
@keyframes clank{50%{transform:translateY(-3px)}}
.bay .takings{font-weight:900;font-size:1.05rem;text-align:right;min-width:7ch}
.bay .takings em{display:block;font-style:normal;font-size:.7rem;font-weight:800;color:var(--mint)}

/* ── Fishing: bands of water running away from the camera ─ */
.floor.water{background:linear-gradient(0deg,rgba(9,6,22,0) 40%,rgba(9,6,22,.8) 96%),
  linear-gradient(180deg,#0A2E52,#062038 45%,#04121F)}
.floor .band{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.16)}
.floor .band span{position:absolute;left:12px;top:-15px;font-size:.66rem;font-weight:900;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}

/* maps: the same arena, dressed differently */
.map-hall,.map-arena,.map-city,.map-site,.map-cave,.map-lair{--floor:linear-gradient(180deg,#2A2547,#151129)}
.map-space{--floor:linear-gradient(180deg,#131A4A,#05060F)}
.map-jungle{--floor:linear-gradient(180deg,#123D2B,#07160F)}
.map-bunker{--floor:linear-gradient(180deg,#3A3730,#16150F)}
.map-moon{--floor:linear-gradient(180deg,#3C4258,#0E1119)}
.map-desert{--floor:linear-gradient(180deg,#6A4A22,#2A1B0B)}
.map-ice{--floor:linear-gradient(180deg,#1E5570,#081E2B)}
.map-candy{--floor:linear-gradient(180deg,#6B2350,#260C1D)}
.map-castle{--floor:linear-gradient(180deg,#3E3A2E,#171510)}
.map-beach{--floor:linear-gradient(180deg,#7A6132,#241C0D)}
.map-vault{--floor:linear-gradient(180deg,#243A5E,#0A1120)}
.map-volcano{--floor:linear-gradient(180deg,#5E1F16,#1C0806)}
.map-ruins{--floor:linear-gradient(180deg,#33452F,#101710)}
.map-playground{--floor:linear-gradient(180deg,#5C6E86,#161C26)}
.map-forest{--floor:linear-gradient(180deg,#2C4258,#0A1018)}
.map-peak{--floor:linear-gradient(180deg,#6A7C93,#1A222E)}
.map-fair{--floor:linear-gradient(180deg,#6B4A2A,#22160C)}
.map-clouds{--floor:linear-gradient(180deg,#3C5A86,#101828)}
.map-night{--floor:linear-gradient(180deg,#241C50,#080614)}
.map-crater{--floor:linear-gradient(180deg,#5E2318,#180806)}
.map-ashfall{--floor:linear-gradient(180deg,#3E3A3E,#100E12)}
.map-obsidian{--floor:linear-gradient(180deg,#2A2436,#08060C)}
.map-works{--floor:linear-gradient(180deg,#4A4436,#141210)}
.map-foundry{--floor:linear-gradient(180deg,#5A3220,#160C08)}
.map-orbital{--floor:linear-gradient(180deg,#1E2A52,#06080F)}
.map-pier{--floor:linear-gradient(180deg,#0A3A5E,#04141F)}
.map-reef{--floor:linear-gradient(180deg,#0E5468,#031C24)}
.scene.map-space{filter:hue-rotate(200deg) saturate(.9)}
.scene.map-jungle{filter:hue-rotate(80deg) saturate(1.2)}
.scene.map-bunker{filter:saturate(.5) brightness(.92)}
.scene.map-moon{filter:hue-rotate(215deg) saturate(.6)}
.scene.map-desert{filter:hue-rotate(-25deg) saturate(1.3)}
.scene.map-ice{filter:hue-rotate(160deg) saturate(.8) brightness(1.08)}
.scene.map-candy{filter:hue-rotate(295deg) saturate(1.3)}
.scene.map-castle{filter:hue-rotate(30deg) saturate(.7)}
.scene.map-beach{filter:hue-rotate(35deg) saturate(1.2)}
.scene.map-vault{filter:hue-rotate(210deg) saturate(.85)}
.scene.map-volcano{filter:hue-rotate(-40deg) saturate(1.4)}
.scene.map-ruins{filter:hue-rotate(60deg) saturate(.6)}
.scene.map-forest{filter:hue-rotate(185deg) saturate(.75)}
.scene.map-peak{filter:saturate(.55) brightness(1.06)}
.scene.map-clouds{filter:hue-rotate(190deg) saturate(.9)}
.scene.map-night{filter:hue-rotate(240deg) saturate(1.15) brightness(.92)}

/* the arena on the big screen */
.arena-board{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;
  border:3px solid #0b0718;box-shadow:0 22px 50px -24px rgba(0,0,0,.9)}
.arena-board canvas{position:absolute;inset:0;display:block;width:100%;height:100%}

/* laser arena */
.arena{display:grid;grid-template-columns:1fr 74px 1fr;gap:14px;align-items:stretch;margin-top:18px}
.team{padding:18px;border-radius:var(--r-lg);border:1px solid var(--line);background:rgba(255,255,255,.03)}
.team.red{border-color:rgba(255,77,94,.4);background:linear-gradient(180deg,rgba(255,77,94,.13),rgba(255,77,94,.03))}
.team.blue{border-color:rgba(79,107,255,.45);background:linear-gradient(180deg,rgba(79,107,255,.13),rgba(79,107,255,.03))}
.hpbar{height:16px;border-radius:99px;background:rgba(0,0,0,.42);overflow:hidden;margin:10px 0 14px;border:1px solid rgba(255,255,255,.09)}
.hpbar i{display:block;height:100%;transition:width .7s var(--ease)}
.team.red .hpbar i{background:linear-gradient(90deg,#ff4d5e,#ff9b6a)}
.team.blue .hpbar i{background:linear-gradient(90deg,#4f6bff,#22d3ee)}
.fighter{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:11px;margin-bottom:6px;background:rgba(0,0,0,.22)}
.fighter.down{opacity:.42;filter:grayscale(1)}
.fighter .mini{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.fighter .mini i{display:block;height:100%;background:var(--mint);transition:width .5s}
.hit{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.vs{display:grid;place-items:center;font-weight:900;font-size:1.5rem;color:var(--faint);position:relative}
.beam{position:absolute;height:4px;width:100%;background:linear-gradient(90deg,transparent,#fff,transparent);
  border-radius:99px;opacity:0;box-shadow:0 0 22px 5px rgba(255,255,255,.6)}
.beam.fire{animation:beam .55s ease-out}
@keyframes beam{0%{opacity:0;transform:scaleX(.2)}30%{opacity:1;transform:scaleX(1)}100%{opacity:0}}
.feed{margin-top:14px;padding:12px 16px;border-radius:var(--r-md);background:rgba(0,0,0,.3);border:1px solid var(--line);
  font-size:.87rem;min-height:52px}
.feed div{padding:3px 0;animation:fadeUp .3s var(--ease) both;color:var(--muted)}

/* kart race */
.track{margin-top:18px;padding:18px;border-radius:var(--r-lg);border:2.5px solid var(--line);background:rgba(0,0,0,.28)}
.lane{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.lane .who{width:120px;font-weight:800;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .road{position:relative;flex:1;height:34px;border-radius:99px;background:rgba(255,255,255,.07);
  border:2px dashed rgba(255,255,255,.18);overflow:hidden}
.lane .road::after{content:'';position:absolute;inset:0 0 0 auto;width:6px;
  background:repeating-linear-gradient(180deg,#fff 0 6px,#111 6px 12px)}
.lane .kart{position:absolute;top:3px;font-size:1.5rem;transition:left 1s var(--ease);transform:translateX(-50%)}
.lane .kart.boost{filter:drop-shadow(0 0 10px #FFC53D)}
.lane .m{width:64px;text-align:right;font-weight:800;font-size:.82rem;color:var(--muted)}

/* tug of war: one rope, and a marker that can come all the way back */
.tugline{position:absolute;left:6%;right:6%;top:44%;height:10px;border-radius:99px;
  background:linear-gradient(90deg,#C99A5B,#E0B77C,#C99A5B);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.tugmid{position:absolute;top:26%;bottom:14%;left:50%;width:4px;margin-left:-2px;border-radius:3px;
  background:rgba(255,255,255,.5)}
.tugmark{position:absolute;top:36%;width:26px;height:36px;margin-left:-13px;border-radius:7px;
  border:3px solid rgba(0,0,0,.4);transition:left .55s cubic-bezier(.22,1,.36,1)}
.tugmark.red{background:#F4364C} .tugmark.blue{background:#4F6BFF}
.tugend{position:absolute;top:30%;bottom:16%;width:5px;border-radius:3px;background:rgba(255,255,255,.35)}
.tugplate{position:absolute;top:6%;padding:6px 12px;border-radius:99px;font-weight:900;font-size:.9rem;
  border:3px solid rgba(0,0,0,.4);white-space:nowrap}
.tugplate.red{background:#F4364C;color:#fff;left:6%}
.tugplate.blue{background:#4F6BFF;color:#fff;right:6%}

/* gold heist: a pile per player, and the last chest called out */
.piles{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-end;
  padding:14px 10px 6px;width:100%}
.pile{display:flex;flex-direction:column;align-items:center;gap:5px;width:96px}
.pile .heap{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;min-height:10px}
.pile .coin{width:var(--w,52px);height:9px;border-radius:99px;background:linear-gradient(180deg,#FFD86B,#E5A02A);
  border:2px solid rgba(0,0,0,.35)}
.pile .amt{font-weight:900;font-size:1.05rem}
.pile .who{font-size:.76rem;font-weight:800;max-width:92px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.pile .say{font-size:.66rem;font-weight:700;color:var(--sun);min-height:1em;text-align:center;line-height:1.25}

/* card collector: everybody's set, side by side */
.sets{display:flex;flex-direction:column;gap:8px;padding:10px 8px;width:100%;
  max-width:760px;margin:0 auto}
.setrow{display:flex;align-items:center;gap:10px}
.setrow .nm{width:120px;font-weight:800;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:none}
.setrow .hand{display:flex;gap:5px;flex-wrap:wrap}
.swap{width:30px;height:42px;border-radius:6px;border:2px solid rgba(0,0,0,.4);background:#fff;
  display:grid;place-items:center;transition:transform .3s}
.swap.gap{background:rgba(255,255,255,.12);border-style:dashed;border-color:rgba(255,255,255,.35)}
.swap.new{animation:dealt .5s cubic-bezier(.22,1,.36,1)}
@keyframes dealt{from{transform:translateY(-16px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.setrow .spare{font-size:.7rem;font-weight:800;color:var(--faint)}

/* tower build */
.skyline{display:flex;gap:16px;align-items:flex-end;justify-content:center;margin-top:18px;padding:18px 12px;
  min-height:220px;border-radius:var(--r-lg);border:2.5px solid var(--line);background:rgba(0,0,0,.28)}
.tower{display:flex;flex-direction:column;align-items:center;gap:5px}
.tower .stack{display:flex;flex-direction:column-reverse;gap:3px;min-height:8px}
.tower .blk{width:46px;height:16px;border-radius:5px;border:2px solid rgba(0,0,0,.45);
  animation:drop .35s var(--bounce) both}
@keyframes drop{from{transform:translateY(-22px);opacity:0}}
.tower .cap{font-size:1.3rem}
.tower .who{font-size:.78rem;font-weight:800;margin-top:4px;max-width:74px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:center}

/* treasure run */
.chests{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.chest{padding:14px;border-radius:var(--r-lg);border:2.5px solid var(--line);background:rgba(255,197,61,.12);
  text-align:center}
.chest .coins{font-size:1.7rem;font-weight:900;color:#FFC53D}
.chest .tag{font-size:.72rem;font-weight:800;color:var(--mint);min-height:14px}

/* boss battle */
.boss{margin-top:18px;padding:22px;border-radius:var(--r-lg);border:2.5px solid var(--line);
  background:linear-gradient(180deg,rgba(244,54,76,.2),rgba(0,0,0,.35));text-align:center}
.boss .face{font-size:4rem;animation:bob 3s ease-in-out infinite}
.boss.hurt .face{animation:shake .4s}
.boss h2{font-size:1.5rem;margin:6px 0 12px}
.boss .bar{height:22px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;border:2px solid rgba(255,255,255,.15)}
.boss .bar i{display:block;height:100%;background:linear-gradient(90deg,#F4364C,#FF9A3D);transition:width .7s var(--ease)}
.classbar{height:14px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:14px;
  border:2px solid rgba(255,255,255,.15)}
.classbar i{display:block;height:100%;background:var(--grad-mint);transition:width .7s var(--ease)}

/* leaderboard */
.lb{display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;gap:13px;align-items:center;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);transition:.5s var(--ease)}
.lb-row .rank{width:26px;font-weight:800;color:var(--faint)}
.lb-row.top{background:linear-gradient(90deg,rgba(255,200,87,.2),rgba(255,255,255,.04));border-color:rgba(255,200,87,.45)}
.lb-row .score{margin-left:auto;font-weight:800;font-size:1.05rem}

.finale{display:flex;flex-direction:column;gap:16px;height:calc(100vh - 128px);min-height:520px}
.crown{flex:none;background:#fff;color:#161036;border:3px solid #0b0718;border-radius:24px;padding:20px 28px;
  text-align:center;box-shadow:0 13px 0 -3px rgba(0,0,0,.5)}
.crown h1{font-size:clamp(1.6rem,4vw,3rem);font-weight:900;letter-spacing:-.02em;margin:0;line-height:1.12}
.crown p{margin:6px 0 0;font-weight:600;opacity:.6}
/* ── the podium, as a place rather than a bar chart ────────
 *
 * Three blocks standing on a floor in a hall, seen from slightly above. Every
 * face is a real surface — a lit top, a front, and a side that catches less
 * light — so it reads as something solid the winners are standing on rather than
 * as three coloured rectangles. This is the moment a room remembers, so it is
 * worth the depth.
 *
 * CSS rather than canvas on purpose: the blooks are SVG and stay sharp at any
 * size, and a school laptop does not have to composite a canvas at 60fps while
 * the confetti is running.
 */
.podium{flex:none;position:relative;height:min(46vh,380px);margin:10px 0 4px;overflow:hidden;
  border-radius:20px;background:#0A0718}
/* The scenery and the people who stand in it are two layers, not one 3D soup.
 * Trying to order them by depth alone put a translucent floor in front of the
 * winner and washed the gold out to brown: every see-through layer that lands in
 * front costs the block underneath a little more of its colour. So the hall is
 * flat stacking — scenery behind, stands in front — and 3D is used only where it
 * earns something, inside a block that really does have three faces. */
/* Names here are deliberately not .face/.floor/.scene: those already mean a
 * player chip, a race track and an arena backdrop elsewhere in this file, and
 * borrowing them handed the podium a pop-in animation and a half-opaque
 * overlay it never asked for. Third time a generic class name has done this.
 *
 * The perspective lives here, not on .podium. Put it on the outer box and the
 * scenery and the stands share one 3D rendering context, where the browser sorts
 * by depth and ignores z-index — which is how a see-through floor ended up in
 * front of the winner and turned the gold to brown. Kept inside .scene, the
 * scenery is one flat layer that can simply be told to stay behind. */
.podium .set{position:absolute;inset:0;z-index:0;pointer-events:none;
  perspective:1200px;perspective-origin:50% 34%}
.podium .hall{position:absolute;inset:0;z-index:1}
.podium .ground{position:absolute;left:-40%;right:-40%;bottom:-8%;height:170%;
  transform:rotateX(76deg);transform-origin:50% 100%;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 2px,transparent 2px 90px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 90px),
    radial-gradient(60% 70% at 50% 16%,rgba(124,77,255,.34),rgba(8,5,18,0) 72%),
    linear-gradient(180deg,#1B1436,#0A0718)}
.podium .backdrop{position:absolute;left:6%;right:6%;top:-6%;height:80%;
  transform:translateZ(-340px);border-radius:24px;
  background:radial-gradient(72% 92% at 50% 100%,rgba(124,77,255,.32),rgba(10,7,22,0) 74%)}

.stand{position:absolute;bottom:6%;opacity:0;transform:translateY(44px)}
.stand.up{opacity:1;transform:none;transition:opacity .5s var(--ease),transform .7s var(--bounce)}
.stand.p1{left:50%;width:196px;margin-left:-98px;--h:176px;--fh:94px;--c:#FFC53D;--lit:#FFE9A8;--dark:#C08200;z-index:3}
.stand.p2{left:21%;width:172px;margin-left:-86px;--h:132px;--fh:74px;--c:#C9D2E6;--lit:#EFF3FB;--dark:#8791AC;z-index:2}
.stand.p3{left:79%;width:172px;margin-left:-86px;--h:104px;--fh:74px;--c:#E0A46B;--lit:#F7D1A7;--dark:#9E6530;z-index:1}

.stand .block{position:absolute;left:0;right:0;bottom:0;height:var(--h);z-index:1;
  transform-style:preserve-3d;perspective:900px}
.stand .block .front{position:absolute;inset:0;background:linear-gradient(180deg,var(--lit),var(--c));
  border:3px solid rgba(8,5,18,.85);border-radius:5px 5px 0 0}
.stand .block .top{position:absolute;left:0;right:0;top:0;height:58px;
  transform:rotateX(76deg);transform-origin:50% 0;
  background:linear-gradient(180deg,var(--lit),var(--c));
  border:3px solid rgba(8,5,18,.85);border-radius:5px}
.stand .block .side{position:absolute;top:0;bottom:0;right:0;width:36px;
  transform:rotateY(56deg);transform-origin:100% 50%;
  background:var(--dark);border:3px solid rgba(8,5,18,.85)}
.stand .block .num{position:absolute;left:0;right:0;top:8px;text-align:center;
  font-size:clamp(1.4rem,2.6vw,2.2rem);font-weight:900;color:rgba(8,5,18,.5);
  text-shadow:0 2px 0 rgba(255,255,255,.35)}
/* Name and score are painted on the block itself, the way a real podium has the
   country on the front. Floating them above the blook left it hovering in the
   air with a hand's width of nothing under its feet. */
.stand .block .plate{position:absolute;left:5px;right:5px;bottom:9px;text-align:center;
  color:rgba(8,5,18,.9)}
.stand .who{font-size:clamp(.9rem,1.35vw,1.2rem);font-weight:900;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 0 rgba(255,255,255,.4)}
.stand .pts{font-weight:800;font-size:.82rem;color:rgba(8,5,18,.62)}

/* the blook stands on top of the block, feet on the lit surface */
.stand .who-box{position:absolute;left:0;right:0;bottom:calc(var(--h) - 14px);text-align:center;z-index:2}
.stand .mini-face{display:inline-block;line-height:0;filter:drop-shadow(0 10px 9px rgba(0,0,0,.55))}
.stand .medal{position:absolute;left:50%;margin-left:-17px;
  bottom:calc(var(--h) + var(--fh) + 2px);line-height:0;z-index:3;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));
  opacity:0;transform:scale(.4) rotate(-25deg)}
.stand.up .medal{animation:medalDrop .7s .25s var(--bounce) forwards}
@keyframes medalDrop{to{opacity:1;transform:none}}

/* The beam runs past the block and spills onto the floor either side of it — a
   lamp that stopped dead at the block top read as a grey panel, not as light.
   It sits behind the block, so the block itself stays crisp. */
.stand .spot{position:absolute;left:50%;bottom:-26px;width:320px;margin-left:-160px;
  height:calc(var(--h) + 330px);
  pointer-events:none;opacity:0;z-index:0;
  background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,244,214,.2) 62%,rgba(255,244,214,.05));
  clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(9px)}
.stand.up .spot{animation:lampOn 1s var(--ease) forwards}
@keyframes lampOn{0%{opacity:0}45%{opacity:.9}100%{opacity:.55}}
.crown{transition:opacity .4s}
.crown.hush{opacity:.35}
@media (max-width:860px){
  .podium{height:min(38vh,290px)}
  .stand.p1{width:156px;margin-left:-78px;--h:136px}
  .stand.p2,.stand.p3{width:134px;margin-left:-67px}
  .stand.p2{--h:108px} .stand.p3{--h:88px}
}
@media (prefers-reduced-motion:reduce){
  .stand,.stand.up{transition:none;opacity:1;transform:none}
  .stand.up .medal,.stand.up .spot{animation:none;opacity:1;transform:none}
}
.finale .rest{flex:1;min-height:0;overflow:auto}
.lb-row .move{font-weight:800;font-size:.85rem;width:34px;text-align:right}
.lb-row .move.up{color:#12BE8E}.lb-row .move.down{color:#FF8A9B}.lb-row .move.same{opacity:.3}

@media (max-width:900px){
  .pin-panel{grid-template-columns:1fr}
  .answers{grid-template-columns:1fr}
  .arena{grid-template-columns:1fr;gap:10px}
  .vs{height:36px}
}
/* .chip sets display, which beats the browser's own rule for [hidden] */
#goal[hidden]{display:none}
#music{padding-left:11px;padding-right:11px}
#music.quiet{opacity:.55}
</style>
